—1920年代","进入法国外交职业体系，参与驻外和外交部事务，逐步升任高级使节。"],["1920年代—1937","曾任驻巴西等地使节，1930年代任驻美国大使，处理法美关系、贸易和战争债务议题，1937年由博内接替。"],["1937—1961","离任后于1961年去世，私人及退休生活资料本次未详考。此人不能与19世纪学者爱德华·德·拉布莱混同。"]],[q("André_de_Laboulaye")]);E("henribunle","亨利·邦勒","1884—1986","法国统计学家 · 人口统计行政",["邦勒"],[["1884—1910年代","接受法国理工教育，进入国家统计工作，早期在经济及人口统计领域形成专业基础。"],["1910年代—1945","参与法国统计机构、国际统计交流及教学，1937年任巴黎统计学会会长。战争中继续统计行政，其机构角色需结合占领时期档案评价。"],["1945—1986","战后参与国家统计机构建设及国际统计工作，1986年去世，享年超过百岁。其专业生涯跨越统计制度的多次改革。"]],[["同行评议研究 · 邦勒及法国统计史","https://shs.cairn.info/revue-francaise-de-socio-economie-2013-2-page-5?lang=fr"]]);E("michelhuber","米歇尔·于贝尔","1875—1947","法国国家统计学家",["于贝尔"],[["1875—1901","1875年出生，1895年进入综合理工学院，1901年在吕西安·马尔领导下进入法国国家统计机构。"],["1901—1939","长期从事法国人口及国家统计，学习德国、英国方法，参与统计教学、资料和行政建设，1937年报告国家统计四十年发展。"],["1939—1947","继续统计著述与学术交流，1947年去世。巴黎统计学会悼文记其近四十年的国家统计工作，是生平与职业年表的直接资料。"]],[["巴黎统计学会 · 1947年于贝尔悼文","https://www.numdam.org/article/JSFS_1947__88__385_0.pdf"]]);E("adolphelandry","阿道夫·朗德里","1874—1956","法国人口学家 · 经济学家与政治家",["朗德里"],[["1874—1910年代","在科西嘉成长，接受高等教育，研究经济和社会问题，进入教学、地方及议会政治。"],["1910年代—1945","担任部长和议员，研究人口变动，提出人口转变相关理论，参与统计学会与人口政策讨论。"],["1945—1956","继续人口学和公共事务，1956年去世。其人口理论与具体政府政策不是同一事项，1937主持会议只是学术组织活动之一。"]],[q("Adolphe_Landry")]);E("marceldoret","马塞尔·多雷","1892—1955","法国试飞员 · 特技与远程飞行",["多雷"],[["1892—1918","早年在法国成长，第一次世界大战中进入军事和航空领域，接受飞行训练。"],["1918—1930年代","任试飞员，参加特技表演和远距离飞行，尝试巴黎至东京航程，1937年的途中记录需与最终航程结果分别叙述。"],["战争时期—1955","二战及战后继续航空相关活动，1955年去世。途中抵达、预告起飞、迫降确认均不等同于完成全程纪录。"]],[q("Marcel_Doret")]);E("dmitrinavachine","德米特里·纳瓦欣","1889—1937","俄国经济工作者 · 巴黎政治谋杀受害者",["纳瓦欣"],[["1889—革命时期","俄国人，具有经济和公共事务背景，革命前后具体教育及早期任职在本次所读资料中未完整核实。"],["革命后—1930年代","从事经济与金融活动，后来在法国生活，与俄国侨民及欧洲政治经济环境相联系。不能仅凭遇害报道给他添加未经证实的间谍身份。"],["1937","1937年1月在巴黎遇害，研究将案件与极右翼“兜帽党”相联系，日期存在23日和24日两说。保留分歧，幕后责任仍需侦查档案。"]],[q("Dmitri_Navachine")],"生卒年及职业主要据辅助传记；遇害具体日存在23日与24日两说，侦查原件未校读。");E("renemassigli","勒内·马西利","1888—1988","法国外交官 · 欧洲安全与英法关系",["马西利"],[["1888—1920年代","接受法国高等教育，第一次世界大战后进入外交，参与和平与欧洲国际事务。"],["1920年代—1945","在外交部负责政治和欧洲安全议题，后驻土耳其；二战中加入自由法国，参与抵抗阵营的外交建设。"],["1945—1988","长期任驻英大使，后任外交部秘书长，继续著述与外交研究，1988年去世。1937的边境监督说明属于外交方案，并非所有监督已执行。"]],[q("René_Massigli")]);E("jeangabin","让·迦本","1904—1976","法国电影演员",["迦本"],[["1904—1930年代","生于表演家庭，早年参加歌舞和舞台，后来转入有声电影，以工人、普通人和犯罪题材角色获得声誉。"],["1930年代—1945","主演《Pépé le Moko》《大幻影》等，战争中到美国工作，后参加自由法国军事行动。银幕角色不能当作真实犯罪经历。"],["1945—1976","战后重建演艺事业，出演大量电影，成为法国电影的重要面孔，1976年去世。职业活动横跨战前诗意现实主义和战后制片环境。"]],[Oe("Jean-Gabin")]);E("julienduvivier","朱利安·杜维威","1896—1967","法国电影导演",["杜维威"],[["1896—1920年代","在法国成长，早年从事戏剧，进入电影制作，经历默片到有声片的转型。"],["1920年代—1945","执导《美好团队》《Pépé le Moko》等，塑造法国诗意现实主义电影的重要面貌，战争时期在美国工作。"],["1945—1967","回法国继续执导多种题材影片，1967年去世。影片后来的经典评价不应倒写成首映当天已有的社会反响。"]],[Oe("Julien-Duvivier")]);E("mireillebalin","米蕾伊·巴兰","1909—1968","法国电影演员",[],[["1909—1930年代","生于法国，早年从事模特等工作，后来进入电影界，逐步获得重要角色。"],["1930年代—1945","以《Pépé le Moko》等影片成名，参与法国电影制作。战争和解放时期遭受暴力及职业打击，私人关系不能作为遭暴力的正当理由。"],["1945—1968","战后事业衰退，经历贫困和疾病，1968年去世。演艺荣誉与晚年困境均是生平的一部分，不能只保留银幕形象。"]],[q("Mireille_Balin")]);E("huanglin","黄霖","1914—1986","中央警卫团团长 · 后任空军将领",["黄国应"],[["1914—1936","原名黄国应，湖南浏阳人，1929年参加红军，1931年加入中国共产党，经历中央苏区战斗和长征，担任基层指挥职务。"],["1936—1949","任中央警卫团团长，1937年到延安为中央迁驻作准备。抗战中在陕北公校、抗大及新四军等系统工作，后来参加中原及其他战场军事活动。"],["1949—1986","在地方军区、防空及空军系统任职，1955年获少将军衔，后任广州军区空军副司令员，1986年去世。其生平跨越警卫、地面部队和空军工作。"]],[["央广网 · 黄霖传略","https://hn.cnr.cn/hngbwh/20150715/t20150715_519218754.shtml"],["人民政协报 · 中央迁驻延安","https://dangshi.people.com.cn/n1/2017/0316/c85037-29148238.html"]]);E("choijinha","崔镇河","1889—1967","旅美朝鲜独立运动者 · 国民会干部",[],[["1889—1917","平壤人，赴美国求学，1916年到美国本土，1917年任大韩人国民会北美总会总务，开始长期侨团工作。"],["1917—1945","组织独立运动筹款，支持上海临时政府，多次任国民会会长。1937年改组时任中央常务部总务，战时支持外交、侨民身份保障及光复军。"],["1945—1967","1948至1950年继续任国民会总务和《新韩民报》主笔，1967年去世，1995年获追授独立章。生年采用纪念基金会明确记载的1889年。"]],[["大韩人国民会纪念基金会 · 崔镇河","https://knamf.org/최진하/"]]);E("limjeonggu","林正九","1887—1939","旅美朝鲜牧师 · 独立运动者",[],[["1887—1917","生于平壤，1905年赴夏威夷，后在美国本土求学，参加公立协会及克莱蒙特学生培养所，接受大学和神学教育。"],["1915—1937","在加州韩人教会传教，长期参与国民会组织、侨民教育、独立筹款及临时政府支持。1937年任中央执行委员兼救济事务常务委员。"],["1937—1939","继续牧会及侨团工作，1939年12月28日去世，2013年获追授爱国章。其牧师和独立运动身份相互联系，并非只参加一次代表大会。"]],[["大韩人国民会纪念基金会 · 林正九","https://knamf.org/임정구/"]]);E("jeongduhyeon","郑斗铉","1888—卒年未详","朝鲜教育与科学工作者 · 崇实学校事务",[],[["1888—1920年代","1888年出生，赴日本接受教育，研究朝鲜近代教育的材料记其曾就读明治学院及多所帝国大学，后来从事教育与科学。"],["1920年代—1945","与平壤崇实学校及基督教教育相连，1937年作为经营委员参与学校转让谈判，以家长意见为由拒签。谈判角色不代表全部教学经历。"],["1945年后","光复后在北方参与高等教育建设，与金日成大学设立相关。后期政治处境及可靠卒年在本次材料中未完整核实，暂保留缺口。"]],[["韩国历史研究会 · 郑斗铉与郑光铉","https://www.koreanhistory.org/webzine/view/2489?page=14"],["韩国经济 · 学术传记书评","https://www.hankyung.com/amp/2021121637151"]],"已确认生年、崇实教育与后期高等教育身份；卒年未可靠核实。");E("danielwbell","丹尼尔·W·贝尔","1891—1971","美国财政官员 · 代理预算局长",["丹尼尔·贝尔","Daniel W. Bell"],[["1891—1930年代","出生于1891年，进入美国财政和预算行政体系，长期从事公共财务管理，与后来同名社会学家不是同一人。"],["1934—1946","1934至1939年任代理预算局长，参与罗斯福政府预算工作，后来任财政部高级职务。1937年的总统会见发生在其预算行政任期内。"],["1946—1971","离开主要联邦行政职务后参与金融相关活动，1971年去世。FRASER人物目录及白宫历任预算主管表支持其身份和任期。"]],[["圣路易斯联储 FRASER · 贝尔人物档案","https://fraser.stlouisfed.org/author/bell-daniel-w-daniel-wafena"],["白宫 · 历任预算主管","https://georgewbush-whitehouse.archives.gov/omb/print/text/former_directors.html"]]);E("edwardfilene","爱德华·A·菲林","1860—1937","美国百货企业家 · 信用合作与社会改革",["爱德华·法林","Edward A. Filene"],[["1860—1890年代","生于马萨诸塞州，在家族百货企业工作，逐步参与经营，对商业组织和消费者服务形成改革兴趣。"],["1890年代—1930年代","发展菲林百货业务，倡导劳动和商业改革，推动美国信用合作社运动，支持以合作金融服务普通劳动者。"],["1930年代—1937","继续公共和金融改革活动，1937年在巴黎去世。白宫日志的Edward A. Filene用于识别旧译“爱德华·法林”，不与同姓访客混同。"]],[q("Edward_Filene"),["罗斯福总统图书馆 · 1937年1月6日访客记录","https://www.fdrlibrary.marist.edu/daybyday/daylog/january-6th-1937/"]]);function $e(a,i,l,o,c,f,h){E(a,i,"生卒未详",l,o,[["早年未详","现有材料能识别这位人物及其职业或活动身份，尚未取得足以补齐出生、家庭、教育和早期经历的独立传记。不借用同姓、同名人物的资料。"],["已知经历",c],["后期与生卒未详",h??"现有已查材料没有给出完整后期生活与可靠死亡日期。保留资料缺口，后续可由人事档案、回忆或权威传记补充；最后出现年份不作卒年。"]],[f],"档案人物：主要据所列直接记录建立身份和已知经历，早晚年与生卒资料尚不完整。")}$e("fukadashuzo","深田修造","日本电影导演 · 松竹制作体系",[],"松竹作品数据库列其为1937年《秋怨》导演，合作人员包括编剧野田高梧、原作者片冈铁兵及松竹演员。该片是松竹大船摄影所制作的有声长片。",["松竹 ·《秋怨》制作档案","https://www.shochiku.co.jp/cinema/database/01909/"]);$e("baesangha","裵相河","朝鲜学术刊物创办者",["裴相河"],"韩国学中央研究院记其为京城帝国大学法文学部出身者，与李康国等在1929年创办《新興》。刊物发表人文社会科学和文学作品，1937年1月出至第9号后停刊。",["韩国学中央研究院 ·《新興》","https://encykorea.aks.ac.kr/Article/E0033604"]);$e("hyunyeongseop","玄永燮","朝鲜翻译与文化活动者",[],"韩国学中央研究院《新興》条目列其翻译王尔德作品，译作刊在1937年1月终刊号。可确认文学翻译署名，不能从单篇译作推定全部政治立场或其他同名者经历。",["韩国学中央研究院 ·《新興》","https://encykorea.aks.ac.kr/Article/E0033604"]);$e("choiyongjin1937","崔龙振","1937年朝鲜学生速滑选手",[],"国史编纂委员会记其参加1937年全日本学生冰上赛，1500米第二名、5000米冠军，后来同月在全日本锦标赛取得500米冠军。赛事类别和成绩分别维护。",["国史编纂委员会 · 学生冰上赛","https://db.history.go.kr/modern/level.do?levelId=su_011_1937_01_06_0120"],"尚未取得可靠出生及后期身份资料，不把此人自动认作1922年出生、参加1948年冬奥会的同名运动员。");$e("jangwoosik","张祐植","朝鲜学生速滑选手",[],"国史编纂委员会记其在1937年全日本学生冰上选手权大会1500米比赛获第三名，与金正渊、崔龙振、李圣德同场竞技。资料支持运动员身份及该成绩，未提供完整运动生涯。",["国史编纂委员会 · 1500米比赛","https://db.history.go.kr/modern/level.do?levelId=su_011_1937_01_05_0110"]);$e("yeondonghak","延东学","朝鲜独立运动参与者 · 上海被捕者",[],"国史编纂委员会《近代史年表》将其记为韩国独立党员，1937年1月7日在上海被日本总领事馆警察逮捕。现有目录没有具体行动、供述或判决，不补写这些情节。",["国史编纂委员会 · 延东学被捕","https://db.history.go.kr/diachronic/level.do?levelId=tcmd_1937_01_07_0040"]);$e("soninsil","孙仁实","梨花女专速滑选手",[],"国史编纂委员会记其代表梨花女专参加冰上竞技，1937年1月17日女子500米以1分1.8秒创当时朝鲜纪录。体育身份与赛事的殖民制度背景分别叙述，不推定政治立场。",["国史编纂委员会 · 女子500米纪录","https://db.history.go.kr/modern/level.do?levelId=su_011_1937_01_17_0510"]);$e("minseokhyeon","闵奭铉","朝鲜药业企业代表",[],"国史编纂委员会据朝鲜总督府官报记其为共生药业股份公司代表，公司1937年1月20日在京城设立。资料支持企业职务，尚不能推定医学教育、全部股权或个人财富。",["国史编纂委员会 · 共生药业设立","https://db.history.go.kr/modern/level.do?levelId=su_011_1937_01_20_0590"]);$e("parkjongsik","朴棕植","光复团活动者 · 殖民司法案件当事人",[],"国史编纂委员会记其1920年以满洲为基地参与光复团武装活动，后来被殖民法院判刑，1937年1月25日上告案开庭。早年案情、上诉公判和最终判决是不同阶段，最后结果本次未详。",["国史编纂委员会 · 朴棕植上告公判","https://db.history.go.kr/modern/level.do?levelId=su_011_1937_01_25_0720"]);$e("dirkdejonge","德克·德容格","美国和平集会权案件当事人",["德容格","DeJonge"],"参加并协助主持俄勒冈州一场共产党组织的和平会议，遭“犯罪工团主义”法定罪。1937年美国最高法院撤销州判决，确认和平集会受宪法保障，案件成为公民自由的重要判例。",["美国最高法院判决 · DeJonge v. Oregon","https://supreme.justia.com/cases/federal/us/299/353/"]);$e("isaacvangrove","Isaac van Grove","美国音乐工作者 · 歌剧与指挥",["Isaac Van Grove"],"1937年音乐演出资料将其列为指挥，芝加哥交响乐团档案亦记其担任小提琴家的伴奏。可识别其职业音乐活动，尚未核实可靠生卒及全部教育、任职经历。",["芝加哥交响乐团 · 演出档案","https://csoarchives.wordpress.com/tag/gregor-piatigorsky/"]);$e("hesselman","L. W. Hesselman","美国海军预备役军官委员会成员",[],"罗斯福总统图书馆1937年1月9日名单列其参加海军预备役军官委员会到访。能够确认委员会和军官身份，日志没有建议书或会谈内容，不把到访写成其决定美国扩军政策。",["罗斯福总统图书馆 · 1937年1月9日","https://www.fdrlibrary.marist.edu/daybyday/daylog/january-9th-1937/"]);$e("baevers","B. A. Evers","美国海军预备役军官委员会成员",[],"罗斯福总统图书馆名单记其与海军预备役军官委员会1937年1月9日拜访总统。现有缩写不足以填入完整姓名和私人经历，军衔及以后任职仍需海军人事档案确认。",["罗斯福总统图书馆 · 1937年1月9日","https://www.fdrlibrary.marist.edu/daybyday/daylog/january-9th-1937/"]);$e("albertsoiland","Albert Soiland","美国海军预备役委员会到访成员",[],"1937年白宫日志列其参加海军预备役军官委员会。现阶段依据访客记录建立军方组织活动身份，未用未经身份比对的同名医学传记补齐其全部生涯。",["罗斯福总统图书馆 · 1937年1月9日","https://www.fdrlibrary.marist.edu/daybyday/daylog/january-9th-1937/"]);$e("sidneypasternack","Sidney Pasternack","数学与量子力学研究者",["Pasternack"],"俄勒冈州立大学所藏保林通信记有其开普勒体系平均值研究稿件，1937年由保林转交《国家科学院院刊》编辑。该记录可确认研究署名和投稿环节，未把提交日当作论文印行日。",["俄勒冈州立大学 · 1937年1月11日通信","https://scarc.library.oregonstate.edu/coll/pauling/calendar/1937/01/11.html"]);$e("beryljoslin","Beryl Henley Joslin","美国海军舰艇命名仪式参与者",[],"美国海军官方舰史记其1937年1月12日主持亨利号驱逐舰命名下水。仪式参与身份不等于该舰指挥官，也不据舰艇服役和战史推定其个人军旅经历。",["美国海军 · Henley II舰史","https://www.history.navy.mil/research/histories/ship-histories/danfs/h/henley-ii.html"]);$e("francisorourke","Francis O’Rourke","美国汽车工人 · 弗林特罢工日记作者",["Francis O'Rourke"],"弗林特静坐罢工教学资料引用其1937年1月12日日记，记录国民警卫队到来和工人对保护的期待。日记提供劳动者亲历视角，个人感受与部队的实际命令需分别核实。",["匹兹堡大学 · 弗林特罢工材料","https://voices.pitt.edu/LessonPlans/documents/LaborUnionsFlint.pdf"]);$e("chroper","C. H. Roper","美国海军唐斯号首任舰长",[],"美国海军战舰辞典记唐斯号1937年1月15日服役，由C. H. Roper任首任舰长。姓名缩写按舰史保留，不把他与商务部长丹尼尔·罗珀混同，也不把该舰全部后续战绩归于其个人指挥。",["美国海军 · Downes II舰史","https://www.history.navy.mil/research/histories/ship-histories/danfs/d/downes-ii.html"]);$e("fredstitt","弗雷德·斯蒂特","美国物理化学研究人员",["Fred Stitt"],"保林1937年推荐信记其参与血红蛋白及衍生物磁性研究，协助研究生量子力学课程，并获推荐申请哈佛青年研究人员项目。多年后的保林研究所口述历史仍提到其工作。",["俄勒冈州立大学 · 保林推荐信","https://scarc.library.oregonstate.edu/coll/pauling/calendar/1937/01/29.html"],"口述历史为后期研究活动提供线索，但未形成完整、经核实的个人年表，生卒及家庭仍保留未详。");$e("edwinbuchman","埃德温·R·布赫曼","美国化学研究者 · 维生素研究",["布赫曼","Edwin R. Buchman"],"1937年向保林提出接纳维生素C研究及资助意向。后来论文目录及1944年加州理工学院学位论文致谢记有其化学研究和指导工作，1940年参与羧化酶抑制相关论文。",["俄勒冈州立大学 · 布赫曼通信","https://scarc.library.oregonstate.edu/coll/pauling/calendar/1937/01/27.html"],"后续研究可参照加州理工学院论文及PNAS论文，尚未取得可靠完整传记，生卒未详。");$e("asahakyan","阿·萨阿基扬","库斯塔奈地方党组织工作人员",["萨阿基扬"],"地方档案纪年记其1937年1月5日向上级提出兴建机械化面包厂的报告，反映库斯塔奈食品生产需求。报告和建议支持其地方行政活动身份，不表示工厂当日获批或开工。",["库斯塔奈档案史家地方纪年","https://archive.ng.kz/modules/newspaper/article.php?numberid=705&storyid=25824"]);$e("nikolaisemenovattache","尼古拉·谢苗诺夫","苏联驻法武官 · N. A. Semenov",["尼古拉·谢苗诺夫"],"俄罗斯总统图书馆记其以驻法武官身份向伏罗希洛夫提交1937年1月10日报告，讨论与法国总参谋部副首长的军事实务接触。档案号和署名支持身份，与诺贝尔化学奖得主同名而非同人。",["俄罗斯总统图书馆 · 武官报告","https://www.prlib.ru/item/1297732"]);$e("schweisguth","施韦斯古特","法国总参谋部副首长 · 军事合作会谈者",[],"俄罗斯军事档案的驻法武官报告将其记为法国总参谋部副首长，涉及法苏军事合作及面对德国战争的行动讨论。报告目录可确认职务与会谈角色，具体谈话日和协议结果仍需正文。",["俄罗斯总统图书馆 · 法苏军事接触","https://www.prlib.ru/item/1297732"]);$e("samatov","萨马托夫","哈萨克国民经济核算机关负责人",[],"俄罗斯科学院研究引用其1937年1月14日报告，回顾哈萨克农村1930至1933年人口减少及后续变化。其统计行政身份可确认，报告中的人口减少须区分死亡、迁移和统计口径。",["俄罗斯科学院 · 1937年人口普查研究","https://istmat.org/files/uploads/31167/zhiromskaya._polveka_po_grifom_sekretno.pdf"]);$e("arnoldtrial","阿诺德（莫斯科审判被告）","1937年莫斯科审判案件当事人",["阿诺德"],"1937年第二次莫斯科审判中被判十年监禁，与被判死刑的十三人不同。政治审判中的指控和口供不能直接当作已经证实的犯罪事实，现有材料不足以补齐早期职业和全部后期遭遇。",["同期报纸 · 莫斯科审判宣判","https://paperspast.natlib.govt.nz/newspapers/WAG19370201.2.37"]);$e("stroilov","斯特罗伊洛夫","1937年莫斯科审判案件当事人",[],"1937年第二次莫斯科审判被判八年监禁，判决与拉狄克等人的十年刑不同。记录能支持当事人和判刑节点，不能据政治指控推定其确有破坏或间谍行为。",["同期报纸 · 莫斯科审判判刑","https://paperspast.natlib.govt.nz/newspapers/WAG19370201.2.37"]);$e("sjwolf","S. J. 沃尔夫","卡普进出口公司代表",["S. J. Wolf","沃尔夫"],"美国国务院1937年1月25日备忘录记S. J. Wolf与Rhodes上校提出向苏联出口Vultee飞机的许可申请，并讨论拆解舰船出口。原文缩写按署名保留，未凭卷末索引的近似姓名补全。",["美国国务院 FRUS · 文件402","https://history.state.gov/historicaldocuments/frus1933-39/d402"]);$e("rhodescarp","罗兹（卡普公司代表）","美国对苏出口事务公司代表",["罗兹","Commander Rhodes"],"美国国务院备忘录记其与沃尔夫1937年1月25日到军械管制办公室，提出飞机出口许可申请。文书以Commander Rhodes称呼，尚不足以确定全名或完整军旅生涯，不借用其他罗兹的传记。",["美国国务院 FRUS · 文件402","https://history.state.gov/historicaldocuments/frus1933-39/d402"]);$e("josephcgreen","约瑟夫·C·格林","美国国务院军械管制官员",["格林","Joseph C. Green"],"1935至1938年主持国务院军械管制办公室，后主管管制部门。1937年备忘录记录对苏出口申请及建议企业直接询问国务卿，署名Joseph C. Green；行政建议不等于许可已获批准。",["美国国务院 FRUS · 人物任职索引","https://history.state.gov/historicaldocuments/frus1933-39/persons"]);$e("amn ikonov".replace(" ",""),"阿·尼科诺夫","苏联红军情报局副负责人 · A. M. Nikonov",["尼科诺夫"],"俄罗斯总统图书馆记其1937年1月28日向国防人民委员伏罗希洛夫提交德日协定及德国对罗马尼亚计划的军情报告。目录明确副负责人职务，情报题名中的计划仍须其他证据核实。",["俄罗斯总统图书馆 · 情报局报告","https://www.prlib.ru/item/1297720"]);$e("abosulaev","阿·博苏拉耶夫","苏联舞台美术设计人员",["博苏拉耶夫"],"列宁格勒大剧院演出年表列其负责1937年《大日子》的舞台设计，与导演阿列克谢·季基和作曲瓦·奥兰斯基合作。作品署名支持专业身份，不据此推断完整教育及政治遭遇。",["托夫斯托诺戈夫大剧院 · 历史演出年表","https://bdt.spb.ru/o-teatre/spektakli-bdt-1919-1955-godov.php"]);$e("voransky","瓦·奥兰斯基","苏联戏剧配乐作曲人员",["奥兰斯基"],"大剧院官方演出年表将其列为1937年《大日子》作曲，参与戏剧与音乐的舞台合作。现阶段保留机构记录的姓名缩写，没有将同姓军事或政治人员经历加入其生平。",["托夫斯托诺戈夫大剧院 · 历史演出年表","https://bdt.spb.ru/o-teatre/spektakli-bdt-1919-1955-godov.php"]);$e("komarovrally","科马罗夫（红场讲话者）","1937年莫斯科群众集会讲话者",["科马罗夫"],"亚历山大·格拉德科夫日记记其与赫鲁晓夫、什维尔尼克在1937年1月30日红场集会中讲话。日记和编辑说明支持这一活动身份，尚未完成与同姓官员的全名比对，不推定全部任职年表。",["格拉德科夫 · 1937年1月日记","https://www.nn.media/magazine/107/397/"]);$e("mostrovsky","米·奥斯特洛夫斯基","苏联驻罗马尼亚外交代表",["奥斯特洛夫斯基"],"俄罗斯总统图书馆记其1937年1月31日向李维诺夫报告罗马尼亚局势及对外政策，目录列外交代表身份和复制件档案号。此人不是《钢铁是怎样炼成的》作者，报告署日不等于全部案情发生日。",["俄罗斯总统图书馆 · 外交代表报告","https://www.prlib.ru/item/1297738"]);$e("joyce btdrama".replace(" ",""),"乔伊斯·比塞尔·托马斯","英国早期电视短剧作者",[],"专业电视史考证列其为1937年《地下铁谋杀之谜》的剧作者，作品由乔治·莫尔·奥费拉尔制作。资料支持写作署名，未取得完整剧本或生平，不能给作品中的虚构谋杀添加真实当事人身份。",["早期BBC电视史 · 原创短剧","https://www.illuminationsmedia.co.uk/otd-in-early-british-television-19-january-1937/"]);$e("johnmasson","约翰·马森","阿伯丁救生艇救援人员",[],"RNLI阿伯丁站史记其在1937年1月26日Fairy号救援中抓住落到两船之间的船员，避免对方被卷走。可确认海上救援行动，不从一次英雄行为推定完整工作、军旅或家庭生活。",["皇家全国救生艇协会 · 阿伯丁站史","https://rnli.org/find-my-nearest/lifeboat-stations/aberdeen-lifeboat-station/station-history-aberdeen"]);$e("captainluiset","吕伊塞（驻丹吉尔武官）","1937年法国驻丹吉尔武官",["吕伊塞"],"1937年路透电讯记其以法国驻丹吉尔武官身份获准进入西属摩洛哥。材料称Luiset上尉，支持武官及许可交涉身份，但没有完整全名和实际行程，不与同姓抵抗运动人物自动合并。",["新加坡国家图书馆 · 同期电讯","https://eresources.nlb.gov.sg/newspapers/digitised/article/pinangazette19370116-1.2.33"]);$e("senatormilan","米兰（法国参议员）","法国参议院财政委员会委员",[],"法国参议院1937年1月20日财政委员会记录中，米兰要求补充阿尔萨斯—洛林社会保险补助资料。可确认议会监督身份，不能据姓氏附会上同名现代作者、运动员或城市历史。",["法国参议院 · 财政委员会原卷","https://archives.senat.fr/pdf/01_ArchivesEnLigne/PVcommission_III/14S/FR_SENAT_014S_0124.pdf"]);E("linsen","林森","1868—1943","国民政府主席",[],[["1868—1911","生于福建，早年接受教育，参与反清革命及同盟会活动，辛亥革命期间参加政治组织工作。"],["1912—1937","在民国议会和国民党政府任职，1931年起任国民政府主席，1937年主持张学良特赦相关政府会议。其名义国家地位与蒋介石掌握的实际权力需区分。"],["1937—1943","抗战期间随政府迁驻重庆，继续担任主席，1943年因病去世。其生平包含革命、议会和国家礼仪职务，并非只有一项赦免决定。"]],[q("Lin_Sen")]);E("wangshuchang","王树常","1885—1960","东北军将领 · 军政人员",[],[["1885—1920年代","生于奉天，早年接受军事教育，进入东北地方军队，逐步担任指挥和参谋职务。"],["1920年代—1949","在东北军及南京政府军政体系工作，曾任地方行政和军事职务，1937年西北善后安排中获任甘肃绥靖主任。任命与实际赴任分别核实。"],["1949—1960","留在中国大陆，参加新中国相关公共事务，1960年去世。早期军人经历与后期政治处境应分阶段叙述。"]],[q("Wang_Shuchang")]);E("fengxuefeng","冯雪峰","1903—1976","作家 · 文学理论家与中共联络工作者",[],[["1903—1920年代","浙江义乌人，青年时参加文学活动，创作诗歌，进入共产党组织，与上海新文学及左翼文化环境相联系。"],["1920年代—1949","参与左翼文艺、鲁迅相关联络和党务工作，经历长征，西安事变后在上海从事联络。后来继续文学批评、翻译与出版。"],["1949—1976","任人民文学出版社等机构职务，后受到政治批判和迫害，1976年去世。其文学事业和政治经历均应保留，不能只记一次电报联系。"]],[q("Feng_Xuefeng")]);E("hanfuju","韩复榘","1890—1938","山东省政府主席 · 国民党将领",[],[["1890—1920年代","河北人，早年从军，在冯玉祥部队中升任，参与民国军阀战争与国民革命军重组。"],["1930—1937","长期控制山东军政，1937年西安善后时被各方争取参与调停。全面抗战后指挥山东防务，后来因撤退和军政冲突遭追究。"],["1938","1938年被南京国民政府拘捕、军事审判并处决。撤退行为、审判程序和中央与地方矛盾应依据军政材料分别考察。"]],[q("Han_Fuju")]);E("daili","戴笠","1897—1946","国民党情报与秘密警察组织负责人",[],[["1897—1920年代","浙江江山人，早年经历多种职业，进入黄埔军校及国民党军政网络，逐渐从事情报和秘密活动。"],["1930年代—1945","领导国民党军统体系，开展情报、反谍和战时秘密行动，也参与政治镇压和暗杀。1937年的陪同交涉是其军政工作的一环。"],["1946","1946年乘飞机途中失事死亡。其生平既包含抗战情报工作，也包含秘密警察和政治暴力责任，不只以传奇或单一功绩叙述。"]],[q("Dai_Li")]);E("yangshangkun","杨尚昆","1907—1998","中国共产党军政领导人 · 后任国家主席",[],[["1907—1930年代","四川人，青年时加入共产党，赴苏联学习，回国后参加党务和红军政治工作，经历长征。"],["1930年代—1949","在红军和八路军政治、中央机关系统工作，1937年参与西安善后相关商议。此后负责中央办公与组织协调等事务。"],["1949—1998","长期承担中央和军委工作，文化大革命中遭迫害，后来复出，1988至1993年任国家主席，1998年去世。后期军政决策亦属于生平考察。"]],[q("Yang_Shangkun")]);E("wangjiaxiang","王稼祥","1906—1974","中国共产党领导人 · 外交与党务",[],[["1906—1930年代","安徽人，青年时参加共产党，赴苏联学习，回国后任党务和红军政治职务，经历长征及党内路线争论。"],["1930年代—1949","参加中央军政和政治局工作，在统一战线、军队及党内事务中发挥作用，抗战时任重要党政职务。"],["1949—1974","任新中国首任驻苏大使，后负责中共中央对外联络，晚年受到政治批判，1974年去世。外交与党内经历相互联系。"]],[q("Wang_Jiaxiang")]);E("zhangguotao","张国焘","1897—1979","中共早期领导人 · 后脱离共产党",[],[["1897—1921","江西人，在北京大学求学时参加学生和工人运动，是中国共产党创始成员之一。"],["1921—1938","在党务和根据地军政中任职，领导红四方面军，长征中与中央发生严重路线和组织冲突，1938年脱离共产党并转入国民党方面。"],["1938—1979","后来在香港及加拿大生活，撰写回忆录，1979年去世。回忆材料具有当事人视角，也需与其他人物和档案交叉核对。"]],[q("Zhang_Guotao")]);E("hezhuguo","何柱国","1897—1985","东北军将领 · 骑兵与统一战线",[],[["1897—1920年代","生于广西，早年接受军事教育，进入东北军体系，逐渐担任高级指挥职务。"],["1920年代—1949","领导东北军骑兵等部，参加西安事变及善后军内讨论，抗战中继续军事活动，后来与国民党中央关系及政治选择发生变化。"],["1949—1985","留在中国大陆，参与政协等公共事务，1985年去世。其军队职务、各次政治立场应按阶段而非固定派别标签记录。"]],[q("He_Zhuguo")]);E("gengjizhi","耿济之","1899—1947","俄语翻译家 · 文学译介",[],[["1899—1920年代","生于北京，学习俄语，青年时参与新文学运动及文学研究会，开始翻译俄罗斯文学。"],["1920年代—1940年代","翻译契诃夫、陀思妥耶夫斯基等作品，参与中俄文化和外交相关工作，成为现代中国俄罗斯文学译介的重要人物。"],["1940年代—1947","继续翻译及文化工作，1947年去世。葛宝权书信提到托其带书，是文学交流背景，不据此补写未有日期的具体旅程。"]],[q("Geng_Jizhi")]);E("harrybyrd","哈里·F·伯德","1887—1966","美国弗吉尼亚政治家 · 参议员",["伯德"],[["1887—1920年代","在弗吉尼亚成长，经商并进入地方政治，任州长，形成长期影响州政治的保守民主党组织网络。"],["1933—1965","任美国参议员，强调财政保守，反对部分新政政策，也支持种族隔离及抵制学校整合。1937预约中的会见是否发生仍需与日志说明区分。"],["1965—1966","退休后于1966年去世。其财政立场与种族政治责任均属于完整生平，而不是仅记录一次可能未发生的预约。"]],[q("Harry_F._Byrd")]);$e("mahenian","马鹤年","1937年高台县长",[],"甘肃党史材料记其在1937年元旦红五军攻占高台时被俘，身份为县长。资料支持地方行政任职和这一经历，未核实完整早期仕途及后期去向，不以同名其他政治人物补写。",["甘肃省委党史研究室 · 高台战事资料","https://www.81.cn/yljnt_208627/ylml/D/9316666_2.html"]);E("tukhachevsky","米哈伊尔·图哈切夫斯基","1893—1937","苏联元帅 · 红军军事理论与建设",["图哈切夫斯基"],[["1893—1918","受俄国军事教育，参加第一次世界大战，曾被德军俘虏，逃回俄国后转入红军。"],["1918—1936","参加俄国内战及对波战争，参与镇压和军事建设，推动机械化、现代作战及纵深战役相关思想，担任红军高级职务。"],["1937","大清洗中遭捕，被秘密审判并处决，后来获平反。1937年日记中的人事传闻不能写成他已取代伏罗希洛夫，也不能将政治审判指控作为真实罪行。"]],[q("Mikhail_Tukhachevsky")]);E("borisgodunov","鲍里斯·戈杜诺夫","约1552—1605","俄国沙皇 · 后世戏剧与歌剧题材",[],[["约1552—1584","出身俄国贵族家庭，进入宫廷和政治核心，其妹妹与费奥多尔结婚，家族关系帮助其政治地位上升。"],["1584—1605","费奥多尔在位时掌握重要实际权力，1598年被选为沙皇，推动行政与对外政策，任内面对饥荒、社会动荡和王位挑战。"],["1605及身后","1605年去世，俄国进入更严重的动荡时期。普希金戏剧和穆索尔斯基歌剧对其生平进行艺术再现，剧情和1937排练活动不能当作本人历史行动。"]],[Oe("Boris-Godunov")]);const Ur={...Nw,...c7,...d7,...y7,china:{name:"中国人民抗日战争纪念馆 · 抗战大事记（人民网转载）",url:"https://dangshi.people.com.cn/n/2015/0708/c395775-27272267.html"},chronicle:{name:"新华网资料 · 抗日战争重大记事（中国新闻网转载）",url:"https://www.chinanews.com.cn/news/2005/2005-05-09/26/571773.shtml"},iwm:{name:"英国帝国战争博物馆 · 二战历史",url:"https://www.iwm.org.uk/history/a-short-history-of-the-second-world-war"},state:{name:"美国国务院 · 1937—1945 年外交史",url:"https://2001-2009.state.gov/r/pa/ho/time/wwii/"},wwii:{name:"美国国家二战博物馆 · 二战年表",url:"https://www.nationalww2museum.org/war/topics/world-war-ii-timeline"},evian:{name:"美国大屠杀纪念馆 · 埃维昂会议",url:"https://encyclopedia.ushmm.org/content/en/article/the-evian-conference"},ancient:{name:"大英百科全书 · 中国历史",url:"https://www.britannica.com/place/China/History"},xianOrigin:{name:"中共中央党史和文献研究院网站 ·《百炼成钢》第十七集：西安事变",url:"https://www.dswxyjy.org.cn/n1/2021/0415/c437209-32079141.html"}},ze=(a,i,l,o,c,f,h)=>({id:a,name:i,type:l,lifespan:o,subtitle:c,description:f,milestones:h}),w=(a,i)=>({date:a,text:i}),xt=Object.fromEntries([ze("china","中国","国家","文明绵延至今","东亚 · 本长卷的时间原点","中国的历史由多个朝代、政权和社会转型共同构成。国家、朝代与文明并非同一概念；此处以中国历史为主线，连接同时代的世界。",[w("约前2070年","传统夏朝起年；具体年代和考古对应仍有讨论。"),w("前221年","秦完成统一，建立中央集权的帝国。"),w("1912年1月1日","中华民国临时政府成立。"),w("1949年10月1日","中华人民共和国成立。")]),ze("roc","中华民国","国家","1912年成立","抗战时期的中国国家名称","1912年成立。全面抗战期间，国民政府组织正面战场作战，并参与同盟国外交。1949年后，中华民国政府迁往台湾；1949年不是其宣布灭亡的日期。",[w("1912.01.01","临时政府在南京成立，孙中山就任临时大总统。"),w("1927.04.18","南京国民政府成立。"),w("1937.11.20","国民政府宣布迁都重庆。"),w("1945.09.09","中国战区受降仪式在南京举行。"),w("1949.12","政府迁往台湾。")]),ze("prc","中华人民共和国","国家","1949年10月1日—至今","新中国 · 历史长卷的新篇","1949年10月1日，中华人民共和国中央人民政府成立，开国大典在北京天安门广场举行。本 Demo 的中国时间轴在这一节点结束。",[w("1949.09.21","中国人民政治协商会议第一届全体会议开幕。"),w("1949.09.27","通过国都、纪年、国歌、国旗等决议。"),w("1949.10.01","开国大典，中华人民共和国成立。")]),ze("britain","英国","国家","1707年—至今（联合王国演变）","欧洲 · 联合王国","1707年英格兰与苏格兰合并为大不列颠王国，1801年与爱尔兰合并。1922年爱尔兰大部分地区脱离后，逐步形成今日的联合王国。英国在第二次世界大战中为主要同盟国。",[w("1707.05.01","大不列颠王国成立。"),w("1801.01.01","大不列颠及爱尔兰联合王国成立。"),w("1939.09.03","对德国宣战。"),w("1940.05.10","丘吉尔出任首相。"),w("1945.05.08","欧洲胜利日。")]),ze("germany","德国","国家","1871年统一—至今","欧洲 · 1937—1945 年处于纳粹统治","德国于1871年统一。1933—1945年为纳粹统治时期，发动侵略战争并实施大屠杀。1945年纳粹政权覆亡，德国战后分裂，1990年重新统一。政权覆亡不等于国家文明消失。",[w("1871.01.18","德意志帝国成立。"),w("1933.01.30","希特勒被任命为总理。"),w("1939.09.01","入侵波兰，欧洲战事爆发。"),w("1945.05.08","无条件投降生效，纳粹政权终结。"),w("1990.10.03","德国重新统一。")]),ze("japan","日本","国家","古代形成—至今","东亚 · 近代帝国与战后转型","日本近代在明治维新后建立帝国体制，走上对外侵略扩张道路。1931年发动九一八事变，1937年发动全面侵华战争，1945年投降。1947年新宪法生效，进入战后体制。",[w("1868年","明治维新开始。"),w("1931.09.18","发动九一八事变。"),w("1937.07.07","制造卢沟桥事变，全面侵华。"),w("1945.08.15","天皇广播宣布接受《波茨坦公告》。"),w("1945.09.02","正式签署投降书。"),w("1947.05.03","战后宪法生效。")]),ze("korea","朝鲜","国家","1392年朝鲜王朝建立—1910年并入日本；1945年光复后南北分立","东亚 · 1937年处于日本殖民统治之下","朝鲜半岛的国家与文明经历朝鲜王朝、大韩帝国和日本殖民统治。1910年《日韩合并条约》后，朝鲜总督府在半岛实行殖民统治；1937年时半岛没有独立的国家政府，海外的独立运动团体在中国等地活动。1945年日本战败后，半岛南北分别建立政权。本长卷的“朝鲜”列同时记录殖民统治下的半岛与海外独立运动，不用它指代1948年后的任一政权。",[w("1392年","朝鲜王朝建立。"),w("1897年","改国号为大韩帝国。"),w("1910.08.29","《日韩合并条约》公布，朝鲜总督府开始统治。"),w("1919.03.01","三一运动爆发。"),w("1937.01.10","朝鲜民族革命党在南京召开全党代表大会。"),w("1945.08.15","日本投降，朝鲜光复。"),w("1948年","半岛南北分别成立政权。")]),ze("ussr","苏联","国家","1922.12.30—1991.12.26","欧亚 · 苏维埃社会主义共和国联盟","苏联由多个加盟共和国组成，1922年成立，1991年解体。二战中承担对德战争的主要陆上战场之一，并于1945年8月对日宣战。",[w("1922.12.30","苏联成立。"),w("1939.08.23","签订《苏德互不侵犯条约》。"),w("1941.06.22","遭德国入侵，苏德战争爆发。"),w("1945.08.08","对日本宣战。"),w("1991.12.26","苏联正式解体。")]),ze("usa","美国","国家","1776.07.04—至今","北美 · 美利坚合众国","美国于1776年宣布独立。二战前期逐渐由中立转向援助同盟国，1941年珍珠港事件后正式参战，并向中国等国提供军事与物资援助。",[w("1776.07.04","通过《独立宣言》。"),w("1789.04.30","华盛顿就任首任总统。"),w("1941.03.11","《租借法案》签署。"),w("1941.12.08","对日宣战。"),w("1945.09.02","接受日本投降。")]),ze("france","法国","国家","历 本条记录事变发生的起始日。1937年关于西安善后的文电、调停与驻防交涉在各自发生的年份另行收录，不把善后日期改写为事变发生日。`,"政治",["zhangxueliang","yanghucheng","chiang"],"xianOrigin",{id:"xian-incident-1936-12-12",day:12,precision:"day",location:"西安、临潼",topicIds:["xian-incident","united-front"],featured:!0,evidenceNote:"所引纪录片解说全文明确记载1936年12月12日事变发生及通电主张；为机构网站转载的历史解说，不宣称已逐项校读同期原始文电。"}),...o7,P(1937,"china",7,"1937年7月7日","卢沟桥事变","一声枪响，全面抗战由此开始。","[[japan|日本]]侵略军在北平西南卢沟桥附近借军事演习挑衅，以士兵失踪为借口要求进入宛平城搜查，随后发动进攻。中国守军奋起抵抗。卢沟桥事变又称七七事变，标志着全国性抗战的开始。此前，中国人民自1931年九一八事变起已开展局部抗战。","战役",["roc"],"china",{image:"bridge",featured:!0}),P(1937,"china",7,"1937年7月17日","庐山谈话：表明抗战立场","“地无分南北，年无分老幼。”","[[chiang|蒋介石]]在庐山发表谈话，强调一旦战端开启，无论地域、年龄，均有守土抗战之责。谈话是在卢沟桥事变后中国社会要求全面抵抗侵略的背景下发表的，成为国民政府抗战立场的重要公开表达。","政治",["chiang","roc"],"chronicle"),P(1937,"china",8,"1937年8月13日—11月12日","淞沪会战","上海浴血三个月，打破速胜幻想。","[[roc|国民政府]]在上海及周边地区组织大规模防御作战。中国军队与[[japan|日军]]展开持续约三个月的激战，最终中国军队撤退、上海沦陷。会战付出巨大牺牲，延缓了日军进攻，也为内地迁厂、迁校与持久抵抗争取时间。","战役",["roc","chiang"],"chronicle",{image:"shanghai"}),P(1937,"china",8,"1937年8月25日","红军主力改编为八路军","开赴华北，建立敌后抗日战场。","在国共合作抗日背景下，红军主力改编为国民革命军第八路军。[[zhu|朱德]]任总指挥，[[peng|彭德怀]]任副总指挥。部队随后进入华北，开展游击战争；9月改称第十八集团军，八路军的称谓继续广泛使用。","政治",["zhu","peng"],"chronicle"),P(1937,"china",9,"1937年9月22日—23日","第二次国共合作形成","共同抗日成为民族的时代命题。","9月22日，国民党中央通讯社公布《中国共产党为公布国共合作宣言》；23日，[[chiang|蒋介石]]发表谈话，承认中国共产党的合法地位。以国共合作为基础的抗日民族统一战线正式形成。[[zhouenlai|周恩来]]等人在此前的谈判和统战工作中发挥了作用。","政治",["chiang","zhouenlai"],"china"),P(1937,"china",9,"1937年9月25日","平型关大捷","八路军第一一五师伏击日军。","[[lin|林彪]]等指挥八路军第一一五师，在山西平型关附近伏击[[japan|日军]]运输部队。战斗取得胜利，打击了日军的气焰，鼓舞了抗战军民的信心。平型关战斗是太原会战中的重要战斗。","战役",["lin"],"chronicle"),P(1937,"china",11,"1937年11月20日","国民政府宣布迁都重庆","山城成为战时首都，抗战走向持久。","随着上海失守、南京受到威胁，[[roc|国民政府]]宣布迁都重庆。此后，政府机构逐步内迁，重庆成为抗战时期政治与外交的重要中心。大量工厂、学校与文化机构的内迁，为长期抵抗保存力量。","政治",["roc"],"chronicle"),P(1937,"china",12,"1937年12月13日起","南京大屠杀","铭记遇难者，守护不能遗忘的历史。","[[japan|日军]]占领南京后，对平民和放下武器的军人实施大规模屠杀、强奸与抢掠。暴行持续数周，南京大屠杀遇难者达30万人以上。这是日本侵华战争中的重大暴行。记忆与纪念的核心，是对遇难者的尊重与对和平的守护。","战役",["japan"],"china"),P(1938,"china",4,"1938年4月7日","台儿庄大捷","徐州会战中的重大胜利。","在[[li|李宗仁]]指挥的第五战区作战中，中国军队在台儿庄击退[[japan|日军]]，取得抗战初期重要胜利。战役是徐州会战的一部分，提振了全国军民坚持抗战的信心。","战役",["li"],"china",{featured:!0}),P(1938,"china",5,"1938年5月26日—6月3日","《论持久战》讲演","在艰难时刻，判断战争的长期走向。","[[mao|毛泽东]]在延安抗日战争研究会上作《论持久战》讲演，分析中国与[[japan|日本]]的条件，反对亡国论和速胜论，阐述抗战将经历战略防御、战略相持和战略反攻三个阶段。","文化",["mao"],"china"),P(1938,"china",6,"1938年6月9日","花园口决堤","阻滞日军，也造成深重的平民灾难。","为阻滞[[japan|日军]]西进，国民党军队在郑州花园口炸开黄河堤防。洪水造成河南、安徽、江苏等地严重灾害，大量平民伤亡和流离失所。决堤的军事目的与其巨大的人道代价都构成这段历史的一部分。","战役",["roc"],"chronicle"),P(1938,"china",6,"1938年6月12日—10月27日","武汉会战","抗战进入战略相持的新阶段。","中国军队在武汉及周边地区与[[japan|日军]]展开持续数月的作战。武汉最终失守，但日军未能迫使中国停止抵抗。通常以武汉会战结束为节点，判断中国抗战进入战略相持阶段。","战役",["chiang","roc"],"chronicle"),P(1939,"china",3,"1939年3月（创作）· 4月13日（首演）","《黄河大合唱》诞生","以歌声凝聚抗战的民族力量。","[[xian|冼星海]]根据光未然的歌词在延安创作《黄河大合唱》，4月13日首演。作品借黄河意象表现民族苦难与不屈抵抗，成为抗战时期传播广泛的音乐作品。","文化",["xian"],"china",{featured:!0}),P(1939,"china",9,"1939年9月—10月","第一次长沙会战","中国军队抵御日军对长沙的进攻。","[[japan|日军]]向长沙方向发动进攻，中国军队在湘北组织防御与反击，日军随后撤回原阵地。这是长沙地区多次会战中的第一次，具体起止日的划分在不同战史中存在差异，故按月份标注。","战役",["roc"],"chronicle"),P(1939,"china",11,"1939年11月7日","黄土岭战斗","晋察冀敌后战场的重要战斗。","八路军在河北涞源黄土岭一带伏击[[japan|日军]]，日军旅团长阿部规秀在战斗中死亡。战斗属于晋察冀边区冬季反“扫荡”作战的一部分。","战役",["zhu"],"chronicle"),P(1939,"china",12,"1939年12月18日—31日","昆仑关战役","争夺桂南要隘，保卫西南通道。","中国军队在广西昆仑关与[[japan|日军]]作战，夺回关隘。[[dai|戴安澜]]率第二〇〇师参加战役。桂南战局与中国对外补给通道的安全密切相关。","战役",["dai"],"chronicle"),P(1940,"china",3,"1940年3月30日","南京汪伪政权成立","日本扶植的傀儡政权登场。","[[wang|汪精卫]]在南京建立受[[japan|日本]]扶植的傀儡政权，以“国民政府”为名与重庆的[[roc|国民政府]]对立。它成为日本对华占领统治的重要工具。","政治",["wang","roc"],"chronicle"),P(1940,"china",5,"1940年5月16日","张自忠将军殉国","枣宜会战中，一位抗日将领的最后一战。","第三十三集团军总司令[[zhang|张自忠]]在湖北宜城南瓜店一带与[[japan|日军]]作战时阵亡。他是抗战中殉国的高级将领，其事迹在战时与战后得到广泛纪念。","战役",["zhang"],"chronicle"),P(1940,"china",8,"1940年8月20日开始","百团大战","华北敌后战场的大规模交通破袭。","[[peng|彭德怀]]等组织八路军在华北发起大规模进攻，重点破坏正太铁路等交通线，打击[[japan|日军]]据点。战役此后转入反“扫荡”阶段，显示出敌后战场在持久抗战中的重要作用。","战役",["peng","zhu"],"china",{featured:!0}),P(1940,"china",10,"1940年10月4日—6日（主要战斗）","黄桥战役","新四军在苏北的重要战役。","新四军在江苏黄桥地区与国民党韩德勤部交战并取得胜利。战役改变了苏北地区的军事局面，也反映出抗战期间国共合作中持续存在的摩擦与冲突。","战役",["yet"],"chronicle"),P(1941,"china",1,"1941年1月4日—11日","皖南事变","抗日统一战线遭遇严重危机。","[[yet|叶挺]]率领的新四军军部及皖南部队北移时，在安徽泾县茂林地区遭国民党军队围攻，造成严重伤亡，叶挺被扣押。各资料对撤离、围攻及结束日期的范围略有差异；这里采用抗战纪念馆大事记的日期范围。","政治",["yet","zhouenlai"],"china"),P(1941,"china",1,"1941年1月20日","新四军军部重建","继续坚持华中敌后抗战。","皖南事变后，中共中央军委命令重建新四军军部，由陈毅任代理军长、刘少奇任政治委员。新四军在华中继续开展抗日战争。","政治",["mao"],"chronicle"),P(1941,"china",12,"1941年12月9日","中国正式对日、德、意宣战","中国战场更紧密地融入世界反法西斯战争。","珍珠港事件后，[[roc|国民政府]]正式向[[japan|日本]]、[[germany|德国]]和意大利宣战。中国的抵抗早已持续多年；正式宣战改变了法律和外交关系，使中国与[[usa|美国]]、[[britain|英国]]等国的同盟合作进一步加强。","外交",["roc","japan","germany","usa","britain"],"state",{featured:!0}),P(1941,"china",12,"1941年12月—1942年1月","第三次长沙会战","在太平洋战争初期取得胜利。","[[japan|日军]]再次进攻长沙，中国军队组织抵抗与反击，迫使日军撤退。会战跨越1941年与1942年，胜利鼓舞了抗战军民，也获得国际关注。","战役",["roc"],"chronicle"),P(1942,"china",1,"1942年1月1日","签署《联合国家宣言》","二十六国确立共同抗击轴心国的立场。","[[china|中国]]与[[usa|美国]]、[[britain|英国]]、[[ussr|苏联]]等26国在华盛顿签署《联合国家宣言》，承诺集中军事、经济资源打击轴心国，不单独议和。这一宣言成为战后联合国名称和合作理念的重要来源。","外交",["usa","britain","ussr","roc"],"china",{featured:!0}),P(1942,"china",2,"1942年2月25日","中国远征军入缅","走出国境，协同盟军抗击日军。","中国远征军开赴缅甸，与[[britain|英国]]等盟军协同对[[japan|日军]]作战，力图保卫滇缅公路补给线。战局随后恶化，部队经历艰苦撤退。[[dai|戴安澜]]、[[sun|孙立人]]等参加了这一战场的作战。","战役",["dai","sun","britain"],"china"),P(1942,"china",4,"1942年4月17日—19日","仁安羌救援作战","中国军队在缅甸支援被围英军。","[[sun|孙立人]]所部新三十八师参与仁安羌救援，支援受[[japan|日军]]威胁的[[britain|英军]]。战斗是第一次缅甸战役中中国军队的重要行动，体现了跨国协同作战。","战役",["sun","britain"],"chronicle"),P(1942,"china",5,"1942年5月1日起","冀中“五一大扫荡”","敌后根据地进入最艰难的时期。","[[japan|日伪军]]对冀中抗日根据地发动大规模“扫荡”，对军民造成重大伤害。根据地被分割，部队与群众在极端困难中坚持游击战和生存生产。","战役",["zhu"],"chronicle"),P(1943,"china",1,"1943年1月11日","中美、中英签订新约","废除一系列在华治外法权及特权。","[[roc|中国政府]]分别与[[usa|美国]]、[[britain|英国]]签署新约，废除两国在华治外法权和相关特权。新约是中国近代争取国家主权与平等外交关系的重要节点。","外交",["roc","usa","britain"],"china"),P(1943,"china",10,"1943年10月24日","中国驻印军开始缅北反攻","重建陆上国际补给线。","中国驻印军向缅北[[japan|日军]]展开反攻，[[sun|孙立人]]等参与指挥。此后与滇西反攻的中国远征军相配合，逐步打开中印公路。","战役",["sun"],"chronicle"),P(1943,"china",11,"1943年11月22日—26日","开罗会议","中国参与 动军队部署，红军南下关中支援东北军与十七路军，各方在联防、释张与撤兵之间寻找妥协，军官内部的主战与主和分歧尚未消除。与此同时，红五军在高台由攻占转入孤立防守并遭重创，中央迁驻延安的警卫和部队准备也在推进。"),"1937/china/经济":M("税制落地与西南工业起步","年初经济记录呈现财政制度与工业建设的两条线索：所得税从条例进入营利事业的实际征收，引出职业团体对负担和减免的讨论；重庆电力炼钢厂则结束自1919年以来屡次中断的筹建，首次产出电炉钢，长期建设开始转化为生产能力。"),"1937/china/文化":M("抗日教育与公共文艺讨论展开","年初，红军教育开始更鲜明地面向抗日任务，抗大更名、开学和招生接连推进，中央党校也踏上迁校行程。城市文化界通过《文摘》、文学译介和小说结集扩大知识传播；围绕《日出》的集体批评又从报纸专版延伸到公演宣传，使文艺讨论进入更广的公共空间。"),"1937/china/社会":M("和平抗日诉求走向群众动员","西安事变之后，停止内战的诉求在年初继续进入社会生活，西安各界以游行和通电要求撤兵、实现对内和平。中央迁驻延安后，当地军民的欢迎活动把团结抗日、生产支援与日常组织联系起来，政治主张开始通过群众参与获得具体表达。"),"1937/china/战役":M("全面抗战展开，战场与灾难扩大","7月卢沟桥冲突使战争扩展为全面抗战，随后战线从华北延伸至上海，淞沪会战持续三个月，平型关的伏击则体现了华北抗战中的另一种作战方式。上海失守后战局继续恶化，12月日军在南京实施大屠杀，平民遭受深重灾难，战争的代价远超前线交锋。"),"1937/japan/政治":M("军部干预下的内阁危机","年初议会围绕预算与军部政治责任的争论公开激化，广田内阁随之辞职。宇垣虽奉命组阁，却因陆军拒绝提供大臣而失败，林铣十郎接获新的组阁命令；这场更替显示军部已能通过大臣人选阻断政府形成，议会政治的空间受到挤压。"),"1937/japan/军事":M("军备约束解除，军部影响加深","承接1936年底海军条约体系的结束，日本年初进入“无条约时代”，海军军备失去原有的国际限制。陆军又以拒绝推荐大臣阻止宇垣组阁，军队对内阁的影响直接显现；海军纪念1932年上海事变的活动，则延续了对既往对华军事行动的宣传。"),"1937/japan/经济":M("贸易管制与殖民地重工业规划","年初日本进一步收紧进口许可与外汇管理，对美棉布出口也受到双边配额限制。与贸易约束并行，关东军制定伪满洲国的五年产业开发纲要，把煤、钢铁、汽车和飞机列为重点，殖民地经济规划更加围绕重工业展开。"),"1937/japan/文化":M("报纸文学与有声电影进入新年","年初的文化记录以大众读物和电影为中心：《路傍之石》通过报纸连载呈现贫困少年与教育制度的关系，松竹继续推出有声剧情片。文学与银幕提供了观察当时社会生活的窗口，这些已收录节点集中于1月。"),"1937/japan/社会":M("城市地标盗窃案的发现与追查","名古屋城金鯱鳞片失窃成为年初引人注目的城市事件，案件从发现损坏进入追查，至月底嫌疑人被捕。现有记录呈现这一案件的前后过程；发现日存在不同记载，不能据此确定唯一日期。"),"1937/japan/外交":M("对外往来转入侵华战争引发的危机","年初日本仍通过接待菲律宾总统与德国海军来访开展对外交往。随着对华战争扩大，年底日军击沉美国炮舰“帕奈号”，使战场行动直接引发对美外交危机，也显示侵华战争的影响已外溢到其他国家。"),"1937/japan/战役":M("从华北冲突走向全面侵华","日本在华北的军事行动于7月发生重大升级，卢沟桥冲突没有停留在局部交锋，而是扩展为全面侵华战争。这一转折改变了中日战局，也使日本的战争规模与中国社会承受的破坏急剧扩大。"),"1937/usa/政治":M("第二任期开启，行政改革提上议程","罗斯福开始第二任期，新一届国会与白宫围绕行政管理展开协调，布朗洛委员会报告提出加强总统辅助和机构协作，改革仍需立法推进。国内法院确认和平集会的权利，海外战争风险则促使5月的新《中立法》继续以避免卷入冲突为政策目标。"),"1937/usa/军事":M("海军建设与国内秩序任务并行","年初美国海军的新舰下水、服役和人事补充陆续推进，预备役军官也进入总统的接见安排。军力使用还涉及国内事务：弗林特劳资冲突后，密歇根州调入国民警卫队维持秩序，同时继续推动谈判，现有记录尚未呈现争端的最终解决。"),"1937/usa/经济":M("新政制度实施与汽车业劳资冲突","1935年社会保障立法开始落实为养老保险工资税，白宫预算则试图兼顾经济复苏、继续救济与收支平衡。汽车业的静坐罢工在年初持续，厂门冲突、州长调解和临时休战相继出现，但工会代表权争端尚未解决，复苏中的劳资关系仍然紧张。"),"1937/usa/文化":M("大众传播拓展，科研交流持续","年初，舞台、电影和广播连续剧扩展了大众文化的传播形式，反排外题材也进入银幕，横贯大陆飞行纪录则展现航空技术进展。保林的通信与实验笔记记录科研提名、投稿、合作和资助的日常过程，反映学术网络如何支撑研究。"),"1937/usa/社会":M("洪灾推动全国救济与公共协调","年初俄亥俄河流域的持续降雨发展为大洪水，多地水位突破历史纪录，总统募捐公告与白宫洪灾会议把地方灾情转化为全国救济行动。同期的航空事故、自然保护地划设和慈善广播，也反映公共安全、景观保护与社会救助并行的议题。"),"1937/usa/外交":M("中立政策面对侵略扩大的压力","年初美国通过西班牙武器禁运和护照限制，试图阻止本国卷入海外内战，同时维持与英国、巴西等国的外交接触。到10月，罗斯福在“隔离”演说中公开警告国际侵略，中立取向与应对战争蔓延之间的张力更加明显。"),"1937/ussr/政治":M("宪法落实与政治镇压同时推进","承接1936年联盟宪法，俄罗斯和乌克兰共和国在年初通过各自的新宪法。与此同时，涉密审判限制控辩参与，第二次莫斯科审判集中宣判，强制迁移与安全机关权力扩张相继出现；制度建设的公开叙事与政治镇压的现实形成鲜明反差。"),"1937/ussr/军事":M("对德日威胁的研判与海外采购","年初红军情报部门持续追踪德国战争准备、德日关系和东欧局势，把国外政治经济变化纳入军事判断。苏联同时向美国交涉舰用装甲、舰船图纸和飞机采购，交易受到设计能力、出口许可与军事保密的限制，装备需求尚未都转化为实际交付。"),"1937/ussr/经济":M("科研待遇、城市供给与财物管理","年初苏联的经济记录落在具体制度与供给问题上：科学院工资和学衔津贴开始采用新标准，地方提出以机械化面包厂缓解城市供应不足。中央又要求安全机关向财政系统移交部分贵重财物，体现不同机构之间的资源管理调整。"),"1937/ussr/文化":M("公共文化扩展中的剧院压力","年初儿童节庆、城市讲堂、美术展和新影片继续展开，公共文化活动与新宪法宣传相互交织。梅耶荷德剧院却不断面对报刊批评与剧目管理争执，私人合作和改变隶属关系的设想也由此出现，艺术创作空间受到行政与评论机关的持续压力。"),"1937/ussr/社会":M("人口普查揭示人口变化与政治压力","年初普查从预填、单日清点进入复查，统计结果低于官方预期，随后遭到封存；哈萨克农村人口变化的报告则为理解此前饥荒与迁移留下材料。月底围绕莫斯科审判的群众集会，显示社会活动也被纳入政治宣传与动员。"),"1937/ussr/外交":M("欧洲安全交涉与对华关系推进","年初苏联一面接待新任美国大使，一面围绕法苏军事合作、西班牙监督及德苏贸易展开交涉，东欧形势也进入外交报告。中国全面抗战爆发后，中苏在8月签订互不侵犯条约，随后援助推进，苏联的安全安排与中国战场进一步联系。"),"1937/germany/政治":M("独裁制度巩固，扩张计划深化","纳粹执政进入第四年，年初以延长《授权法》和统一公务员制度巩固希特勒的权力，教育、司法与城市规划也进一步受到党政控制，部门权限争执仍然存在。到11月，领导层通过霍斯巴赫会议讨论扩张计划，国内集权与对外野心更加紧密地结合。"),"1937/germany/军事":M("干涉西班牙与战争动员准备","年初德国军舰对西班牙共和国商船实施拦截，军事力量已经介入海外内战。国内战争经济机构则要求处理军政部门的权限冲突，强调军事需求的优先地位，显示对外干涉与内部动员准备正在同时推进。"),"1937/germany/经济":M("自给与动员需求深入经济治理","年初经济政策围绕四年计划、自给和军事人力需求展开，农业劳动、税收及公司制度调整不断进入部门协调。对美贸易仍受补贴、易货与平等待遇争议牵制，对犹太人加重税负的歧视性方案也在内部讨论，经济治理受到动员目标与种族迫害政策的影响。"),"1937/germany/文化":M("大众娱乐与文化奖项政治化","年初电影、歌剧和足球赛事继续吸引公众，银幕上既有都市娱乐，也有服务纳粹意识形态的宣传作品。希特勒因奥西茨基获诺贝尔和平奖而禁止德国人接受诺贝尔奖，并设立替代奖项，国际文化荣誉被纳入政治控制。"),"1937/germany/社会":M("劳动保护与保险改革仍在协调","年初青少年劳动保护和社会保险重组进入跨机构讨论，童工、学徒休息与保险给付成为具体议题。部分规则形成共识，但组织统一、缴费和新增负担仍有分歧，现有材料呈现的是改革磋商阶段，不能把草案当作已经全面实施的制度。"),"1937/germany/外交":M("德意接触与非干预承诺的张力","年初德国在摩洛哥登陆传闻引发的危机中作出保证，并参与西班牙海陆监督讨论，另一面又借戈林访意深化德意接触。外交内部关于犹太人迁往巴勒斯坦的讨论，则把反犹政策与出口利益放在同一权衡中，反映外交决策的政治取向。"),"1937/germany/战役":M("西班牙内战空袭的平民代价","德国对西班牙内战的军事干涉发展到空中轰炸，4月格尔尼卡遭袭，使平民承受的战争破坏震动国际社会。这个节点展示了海外内战如何成为欧洲军事介入的战场，也凸显现代空袭对城市生活的威胁。"),"1937/britain/政治":M("王位与政府交接，政治阵营分化","承接1936年的王位变动，英国年初推进永久摄政安排，乔治六世随后加冕，5月首相也由鲍德温转为张伯伦。公共秩序立法与左翼联合运动反映反法西斯压力下的国内分歧；印度选举、巴勒斯坦调查和殖民人事则显示帝国治理仍是政治的重要部分。"),"1937/britain/军事":M("海军扩建与本土防空准备","年初新战列舰和驱逐舰陆续开工，本土舰队驶向直布罗陀，海上力量建设继续推进。空袭风险同时进入民防计划与议会辩论，飞机产能、防毒急救和地方防空组织成为议题，军备建设开始更直接地连接工业布局与平民保护。"),"1937/britain/经济":M("帝国特惠与国际贸易恢复的争议","年初英国与美国围绕帝国贸易壁垒交换意见，英加安排受到美方质疑，英国则强调促进贸易的意愿。畜牧业援助与进口关税在议会讨论中相连，邮轮检修又受流感影响，现有节点展现贸易政策、产业保护与实际经营条件的交织。"),"1937/britain/文化":M("早期电视形成更稳定的节目体系","延续前一年开始的电视服务，BBC在年初把艺术、女性工作、戏剧和烹饪引入新节目，并结束贝尔德系统的轮换试验，服务转向405线系统。舞台、广播音乐与科幻爱好者聚会同时活跃，文化传播正在形成更多面向公众的渠道。"),"1937/britain/社会":M("生活保障议题与日常观察兴起","年初矿难、风暴和洪水暴露劳动与生活安全问题，救生行动与之相伴。家庭供养、产妇照护及工厂制度进入议会改革议程，“大众观察”又开始征集普通人的生活记录，社会政策与认识日常生活的新方法同时展开。"),"1937/britain/外交":M("以协商与非干预应对地中海危机","年初英国通过英意协定和西班牙非干预磋商寻求稳定地中海局势，并限制本国人员赴西班牙参战。此前签署的英埃条约进入登记与大使交接阶段，英爱会谈则涉及宪法、港口和贸易，既有帝国关系也在法律与外交层面调整。"),"1937/france/政治":M("人民阵线承压，殖民矛盾显现","年初人民阵线政府在殖民地调查、宪政恢复与民族主义组织问题上采取不同措施，改革期待与殖民统治的矛盾逐渐显露，国内也出现极右翼相关暴力案件。政府面对持续的政治经济压力，布鲁姆于6月辞职，执政局面发生变化。"),"1937/france/军事":M("防务建设与地中海警戒加强","年初法国推动军备贷款和国防开支授权，航空生产能力成为防务讨论的重点。西班牙内战又使摩洛哥与地中海进入警戒范围，法国舰船遇袭后调整还击指示；相关登陆传闻和飞机国籍仍未确认，警戒不能被写成已证实的军事入侵。"),"1937/france/经济":M("航空产业重组与融资需求并行","年初飞机制造业继续分批归入新的工业体系，试飞与工厂接管呈现生产组织调整的进程。预算、税制和国有钾盐矿制度同时推进，政府与铁路又寻求英国短期融资，对美进口许可交涉则反映资金与贸易条件仍制约经济运行。"),"1937/france/文化":M("早期电视、都市艺术与反战表达","年初法国开始每日电视播出，电影与戏剧仍是巴黎文化生活的重要载体，远程飞行尝试也吸引公众关注。毕加索以版画回应西班牙局势，使反战表达进入艺术创作；艺术家救助经费的审议则显示文化活动同时面对生活保障问题。"),"1937/france/社会":M("劳工改革落地，西班牙难民获援","年初铁路四十小时工作制形成实施法令，社会保险补助仍待进一步审查，巴黎地铁新段则扩展城市交通。法国接待从西班牙撤离的儿童，并召开援助伤者、孤儿和难民的会议，海外战争的人道后果已经进入国内社会行动。"),"1937/france/外交":M("欧洲和平谋求与地区争议交涉","年初法国在英法协调中讨论西班牙非干预、志愿人员限制和边境监督，希望缓和冲突以推动更广泛的欧洲合作。摩洛哥登陆传闻经交涉后降温，与土耳其关于亚历山大勒塔的争议也形成原则安排，但具体法规和保障仍待后续落实。"),"1937/korea/政治":M("殖民压迫下的抗日组织与重整","年初海外朝鲜人团体在南京、旧金山和华北推进组织调整与抗日联络，独立运动延续到不同地区。与此同时，上海独立党员遭拘捕，岛内政治案件上诉和剧团干部被捕也进入记录，组织活动始终面对日本殖民权力的压制。"),"1937/korea/经济":M("殖民地建设扩张与工资争议","年初铁路、水利、冶炼和纺织建设继续展开，金融网点向北平延伸，肥料贸易则进入许可管理。产业与交通扩张并未消除劳动矛盾，釜山码头、驳船和纺织工人相继要求加薪，长项冶炼所发生罢工，建设进程与劳工诉求并存。"),"1937/korea/文化":M("报刊读者扩展与冰上体育活跃","年初报纸通过新春文艺、小说连载和少年刊物扩大读者群，学术杂志却也出现停刊，出版活动呈现不同走向。朝鲜选手在多项冰上比赛中取得成绩，女子纪录与城市对抗赛进入年表，体育成为公众文化生活的另一条重要线索。"),"1937/korea/社会":M("学校存续与地方社会组织的努力","年初教会学校的转让和存续面临困境，家长与教师通过谈判、组织和紧急会议尝试维持教育。妇人问题研究会及地方禁酒团体现民间组织活动，火田民迁移政策则显示殖民当局对居民生活和土地使用的干预。"),"1937/korea/外交":M("殖民当局推进跨境技术协调","年初朝鲜总督府与伪满洲国围绕鸭绿江设立共同技术委员会形成备忘录，跨境河流事务进入联合协调。这里记录的是日本殖民体系内当局之间的安排，不能据此视为朝鲜独立国家的外交行为。"),"1936/china/政治":M("停止内战的诉求推动西安兵谏","面对日本侵略与国内战争并存的局面，停止内战、共同抗日成为重要政治诉求。12月张学良、杨虎城在西安发动兵谏，把这一诉求推向全国政治的中心，也留下停战承诺、各军关系及善后安排等需要继续解决的问题。"),"1938/china/战役":M("大会战延续，抗战走向相持","承接1937年全面抗战的展开，中国军队继续在徐州与武汉一线抵抗日军，台儿庄胜利提振士气，武汉会战后战争进入战略相持的新阶段。花园口决堤虽用于阻滞日军，却造成深重的平民灾难，防御作战的代价同时落在广大社会。"),"1938/china/文化":M("从战争挫折中判断持久抗战道路","全面抗战进入第二年，连续作战与失地使战争前途成为迫切问题。毛泽东通过《论持久战》讲演分析战争的长期走向，将眼前的艰难战局放入持久抗战的战略判断中，为理解战争进程提供系统论述。"),"1939/china/文化":M("抗战音乐成为民族动员的力量","随着抗战走向持久，文化创作继续承担凝聚社会的任务。《黄河大合唱》从创作走向首演，以集体歌声表达民族苦难与抵抗意志，使战争经验转化为具有广泛感召力的音乐。"),"1939/china/战役":M("相持阶段的正面防御与敌后作战","抗战进入相持阶段后，日军进攻仍在持续，中国军队在长沙抵御攻势，在桂南争夺昆仑关以保卫西南通道。黄土岭的敌后战斗则展现华北抗战的另一条战线，正面防御与根据地作战共同构成这一年的抵抗。"),"1940/china/政治":M("占领区傀儡政权加深政治分裂","持久抗战继续之际，日本在南京扶植汪精卫政权，试图以傀儡统治巩固占领。战争由军事对抗进一步牵动政治合法性与统治秩序，中国面临的压力也从战场延伸到占领区政权建设。"),"1940/china/战役":M("敌后破袭扩大，战场形势复杂","这一年正面战场继续承受日军攻势，张自忠在枣宜会战中殉国；华北敌后则通过百团大战开展大规模交通破袭。黄桥战役反映苏北抗战中的复杂军事关系，正面作战、敌后攻势与内部冲突交织，战争并非单一战线的推进。"),"1941/china/政治":M("统一战线遭危机，华中抗战延续","抗战尚在持续，年初皖南事变却使国共合作遭受严重冲击，抗日统一战线面临危机。新四军随后重建军部并继续华中敌后作战，军事组织的恢复与维持共同抗日的政治难题同时摆在面前。"),"1941/china/外交":M("中国抗战与全球战争进一步汇合","太平洋战争爆发使国际局势骤变，中国在12月正式向日本、德国和意大利宣战。此前已持续多年的中国抗战，由此在外交上更明确地融入共同反对轴心国的战争框架。"),"1941/china/战役":M("长沙防御延续到太平洋战争初期","长沙地区在此前会战之后再次面对日军攻势，中国军队于年底展开第三次防御作战。战役跨入1942年并取得胜利，既延续了正面战场的抵抗，也与太平洋战争初期的国际战局相衔接。"),"1942/china/外交":M("共同对敌的立场形成多国承诺","承接前一年中国正式对轴心国宣战，年初中国与其他国家签署《联合国家宣言》。二十六国以共同文件确立协力抗击轴心国的立场，中国的持久抗战进一步进入多国合作的外交体系。"),"1942/china/战役":M("境外协同作战与敌后严峻考验","中国远征军进入缅甸，与盟军协同抗击日军，仁安羌救援体现了跨国战场上的支援行动。国内冀中根据地又遭遇“五一大扫荡”，境外作战扩大与敌后生存压力加重并行，中国抗战同时面对不同方向的困难。"),"1943/china/外交":M("条约地位改善，参与战后东亚讨论","中国与美国、英国签订新约，废除一系列在华治外法权与特权，长期不平等的条约关系得到调整。年底中国参与开罗会议，讨论对日战争与战后东亚安排，外交议题由战时合作进一步延伸到未来秩序。"),"1943/china/战役":M("缅北反攻起步，国内防御仍艰苦","继前一年入缅作战后，中国驻印军开始缅北反攻，重建陆上国际补给线成为重要目标。国内常德会战则经历持续坚守与争夺，境外反攻并未消除本土战场的压力，抗战在推进与防御中继续。"),"1944/china/战役":M("国内严重失利与滇西反攻并存","日军“一号作战”在豫湘桂造成严重失利，衡阳的长期坚守显示正面战场承受的巨大压力。另一方向上，远征军强渡怒江、推进滇西反攻并收复腾冲，国内战局恶化与西南通道的军事进展形成并行的两条线索。"),"1945/china/战役":M("滇缅作战成果转为陆路补给","承接缅北与滇西的反攻，中国部队在芒友会师，中印公路于年初打通。此前围绕西南通道的持续作战开始转化为实际补给条件，为战争最后阶段提供陆路联络。"),"1945/china/政治":M("胜利前夕筹划反攻与战后道路","抗战进入最后阶段，中国共产党召开第七次全国代表大会，将全面反攻的准备与战后政治道路相联系。战争终结已成为现实前景，各方对未来国家方向的筹划也随之更加突出。"),"1945/china/外交":M("从促降声明走向胜利与受降","战争进入尾声，中、美、英通过《波茨坦公告》敦促日本无条件投降。日本8月宣布投降、9月正式签署投降书，随后中国战区在南京举行受降仪式，长期抗战由外交促降转入正式结束与接收投降的阶段。"),"1938/britain/外交":M("以领土妥协谋求和平，危机未解","面对德国扩张，英国继续以协商和让步寻求避免战争，并参与慕尼黑协定。以他国领土为代价的安排没有消除欧洲危机，绥靖政策与侵略扩大的矛盾进一步显现。"),"1939/britain/外交":M("从慕尼黑妥协转向对德战争","前一年的领土让步没有换来稳定，德国入侵波兰后，英国于9月对德宣战。此前试图以绥靖避免战争的路线走到转折点，英国正式进入欧洲战争。"),"1940/britain/政治":M("战争危局推动领导层更替","欧洲战争迅速扩大，英国在5月由丘吉尔接任首相，进入新的战时领导阶段。政府交接发生在德军西线攻势展开之时，组织抵抗与维持国家意志成为执政的中心任务。"),"1940/britain/战役":M("大陆撤退之后转入本土空防","德军西线攻势迫使盟军从敦刻尔克撤离，大陆战场的危机直接影响英国安全。随后不列颠之战把防御重心移到本土上空，英国从保存兵力的撤退转入抵抗空袭的持续作战。"),"1941/britain/外交":M("英美协作开始描绘战后原则","英国继续处于战争之中，英美领导人通过大西洋宪章提出未来国际秩序的原则。合作议题由眼前的战时支援延伸到战争结束后的安排，为更广泛的同盟协调提供共同表述。"),"1942/britain/战役":M("北非防线转向主动推进","北非长期争夺在第二次阿拉曼战役出现重要转折，英军的胜利改变了当地战局。这一节点反映英国在持续防御之后取得反攻机会，盟军在北非的形势开始改善。"),"1943/britain/外交":M("对日合作与东亚战后安排相连","随着盟军逐步取得主动，英国领导人参与开罗会议，与中国、美国协调对日战争。会谈把战时协作与战后东亚秩序相联系，外交准备已开始超越当下作战。"),"1944/britain/战役":M("盟军重返欧洲大陆","经过持续准备，盟军在6月实施诺曼底登陆，开辟欧洲西线第二战场。英国参与的跨海作战使抵抗由岛屿防御和外围战场进一步转入欧洲大陆，为解放占领区创造条件。"),"1945/britain/外交":M("欧洲战事结束，转向和平安排","持续多年的欧洲战争在德国投降后结束，英国于5月庆祝胜利。从本土防御到盟军反攻的历程告一段落，国家面对的任务开始由战时合作转向和平时期的国际安排。"),"1945/britain/政治":M("战时胜利之后发生选举交接","欧洲战争结束后，英国通过大选决定新的执政方向，工党取得胜利，艾德礼接替丘吉尔。战时领导人的功绩没有自动延续为选举授权，国内政治开始转向和平时期的社会与重建诉求。"),"1938/germany/政治":M("领土扩张与反犹迫害同时升级","继前一年的集权与扩张讨论之后，德国吞并奥地利，将扩张目标转化为实际领土变化。年底“水晶之夜”暴行使对犹太人的迫害急剧升级，纳粹政策在国境内外同时造成更严重的破坏。"),"1939/germany/战役":M("扩张政策转化为欧洲全面战争","此前的吞并与领土索求发展为直接军事入侵，德国于9月进攻波兰。欧洲战事由此爆发，扩张不再局限于外交威胁和局部安排，而转入大规模战争。"),"1940/germany/战役":M("波兰战后继续向西欧进攻","德国在前一年发动欧洲战争后，于5月把大规模攻势转向西欧，军队进入荷兰、比利时和法国。战争的地域与影响迅速扩大，西线国家的防御与政治秩序遭受重大冲击。"),"1941/germany/战役":M("入侵苏联使东线全面开战","德军在西欧作战之后继续扩大战争，于6月发动对苏联的入侵。此前的苏德互不侵犯安排被打破，东线全面开战，欧洲战争进入范围更广、消耗更深的阶段。"),"1942/germany/政治":M("反犹迫害推进到系统灭绝的协调","纳粹对犹太人的迫害继续升级，万湖会议对欧洲犹太人的系统性灭绝进行协调。这里呈现的是国家机构参与组织大规模杀戮的节点，战争与种族迫害在制度层面进一步结合。"),"1943/germany/战役":M("东线攻势在斯大林格勒遭重挫","从前一年延续的斯大林格勒战役以德军第六集团军投降告终，德国在东线遭受重大失败。此前的进攻态势受到根本挑战，战争主动权开始进一步向苏军转移。"),"1944/germany/政治":M("战局恶化中出现内部反纳粹行动","随着军事形势恶化，德国国内部分力量试图通过刺杀希特勒改变政治局面。7月行动失败，显示对纳粹统治的内部反对已采取极端方式，却未能实现政权更替。"),"1945/germany/外交":M("军事败局以无条件投降终结","德国战争与纳粹统治走向崩溃，5月无条件投降正式生效，欧洲战事结束。此前不断扩大的侵略战争至此告终，德国进入由战败与盟国接收决定的新阶段。"),"1938/japan/政治":M("侵华战争推动全国动员立法","全面侵华战争延续到第二年，日本公布国家总动员法，把战争需求更加深入地嵌入经济与社会。军事实力的投入由前线扩展为国家制度化动员，战争对国内生活的影响进一步加深。"),"1939/japan/战役":M("北方边境战争影响战略取向","在对华战争仍然持续的背景下，日本与苏联在诺门罕发生大规模边境作战。战役的结果影响日本此后的战略选择，也显示其军事扩张同时面对北方强邻的约束。"),"1940/japan/外交":M("与德意结盟使战争阵营更加明确","日本在持续战争中与德国、意大利签订三国同盟条约，轴心联盟形成。亚洲与欧洲的侵略国家通过正式条约建立联系，地区战争更深地卷入全球阵营对抗。"),"1941/japan/战役":M("战争从亚洲大陆扩展到太平洋","日本在12月袭击珍珠港，把军事冲突直接扩大到美国。太平洋战争全面爆发，原有的对华战争与更广泛的海空战场连接起来，日本进入规模更大的国际战争。"),"1942/japan/战役":M("海上攻势在中途岛遭受重挫","太平洋战争初期的扩张未能持续顺利推进，日本在中途岛海战中损失重要航母力量。海空优势受到严重削弱，战局开始出现不利于日本的关键变化。"),"1943/japan/战役":M("撤出瓜岛，战略主动权继续流失","承接前一年太平洋战场的消耗，日本于年初完成从瓜达尔卡纳尔的撤离。持续争夺以撤退告终，盟军反攻获得进展，日本的战略主动权进一步受到削弱。"),"1944/japan/战役":M("岛屿防线后退，美军逼近本土","太平洋战局继续向日本不利的方向发展，塞班岛战役结束后，美军取得更靠近日本本土的基地。此前逐岛争夺的结果开始直接影响本土安全，日本防御面临更迫近的压力。"),"1945/japan/战役":M("战争末期本土遭受核武器灾难","战争进入最后阶段，广岛与长崎先后遭原子弹轰炸，平民承受巨大的人道灾难。日本本土成为新型毁灭性武器的攻击目标，战争损失与长期后果远远超出当时的军事行动。"),"1945/japan/外交":M("战争扩张以正式投降收场","经历长期对外战争与末期败局，日本于9月在“密苏里”号上签署投降书，正式向盟国投降。战争从军事停止转入法律与外交上的结束，战后的接收与秩序安排由此展开。"),"1938/ussr/战役":M("远东边境安全受到苏日冲突考验","欧洲安全局势紧张的同时，苏联在远东与日本发生张鼓峰军事冲突。已收录节点显示苏联的军事压力并非只来自欧洲，边境防御也牵动亚洲的地区关系。"),"1939/ussr/外交":M("对德关系突变，东欧安排重组","欧洲战争临近之际，苏联与德国签订互不侵犯条约，改变此前对德安全关系。秘密议定书又划分东欧势力范围，使条约不仅涉及双边不战承诺，也影响其他国家的命运。"),"1940/ussr/外交":M("冬季战争结束，北方关系重定","从前一年延续的苏芬冬季战争以莫斯科和平条约结束。军事冲突转入条约安排，苏联与芬兰的关系及北方安全格局进入新的阶段。"),"1941/ussr/战役":M("对德战争中的城市围困与坚守","德国入侵后，苏联的安全局面由外交安排迅速转为全面战争，列宁格勒自9月起被围。城市居民与守军在饥饿和炮火中长期坚持，东线战事同时成为社会生存的严峻考验。"),"1942/ussr/战役":M("斯大林格勒争夺延续至次年","德军进攻使东线战事集中到斯大林格勒，苏军从城市防御进入持续争夺，战役跨越1942与1943年。其结局将改变双方战略形势，但在这一年，战争仍表现为漫长而惨烈的攻守与消耗。"),"1943/ussr/战役":M("东线由艰苦抵抗走向掌握主动","承接斯大林格勒战役带来的形势变化，苏军在库尔斯克继续与德军展开大规模较量。战役后苏联进一步掌握战略主动权，东线的攻守关系发生持续转变。"),"1944/ussr/战役":M("大规模夏季攻势推进东线反攻","苏军在前一年逐步取得主动后，发动“巴格拉季昂”行动，扩大东线反攻。战争重心由守住本土进一步转向打击德军占领体系，与盟军其他战场的攻势形成呼应。"),"1945/ussr/外交":M("胜利前夕协商欧洲与对日安排","德国败局已渐明朗，苏联与英美在雅尔塔讨论战后欧洲，同时商议苏联对日参战。外交谈判把正在结束的欧洲战争与尚未结束的亚洲战争连接起来，未来秩序也进入大国协商。"),"1945/ussr/战役":M("欧洲战争结束后转向对日作战","苏联在欧洲战事结束后于8月对日宣战，随后出兵中国东北，对关东军展开大规模进攻。战争重心从欧洲转向亚洲，这一行动发生在世界战争走向最终结束的阶段。"),"1938/usa/外交":M("欧洲难民危机进入多国磋商","欧洲迫害与紧张局势加深，难民安置问题在埃维昂会议进入国际议程。美国参与的多国讨论显示，战争爆发前的人道危机已经需要跨国回应，外交关注不再仅限于国家间的领土与贸易。"),"1939/usa/政治":M("中立制度向有限支援调整","欧洲战争爆发后，美国修订《中立法》，以“现金购买，自行运输”的方式向盟国开放购买。政策仍保留避免直接参战的框架，却开始调整对战争物资交易的限制，为有限支援留出空间。"),"1940/usa/外交":M("从中立约束走向扩大援英","欧洲战局恶化使英国面临更大压力，美国通过驱逐舰换基地协定提供进一步援助。对外政策由前一年的有限贸易开放继续向实际支援推进，但正式参战仍属于后续阶段。"),"1941/usa/外交":M("大规模援助最终转为直接参战","《租借法案》把美国对反轴心国家的支援扩大为制度化的大规模援助。年底珍珠港遇袭后，美国对日宣战，从援助者转为直接交战国，太平洋与欧洲战局由此更加紧密地汇合。"),"1942/usa/战役":M("太平洋战争开始持续反攻","美国在前一年参战后，与盟军于8月在瓜达尔卡纳尔展开作战，太平洋反攻由此推进。岛屿争夺成为持续消耗的战场，战争从应对突袭转向争夺主动权。"),"1943/usa/外交":M("三国协调欧洲作战与共同战略","盟军逐步改善战局，美国与英国、苏联在德黑兰举行首脑会议，协调欧洲战争。战时援助和各自作战进一步转为最高层的共同战略磋商，为后续联合行动作准备。"),"1944/usa/战役":M("跨海登陆推动欧洲大陆反攻","美国军队参与诺曼底登陆，将此前的战时准备与跨国协调转化为进入欧洲大陆的军事行动。西线第二战场展开后，对德国的压力进一步增大，解放占领区进入新阶段。"),"1945/usa/政治":M("战争未终，总统发生交接","罗斯福在4月去世，杜鲁门继任总统，美国在世界战争尚未完全结束时完成领导层交接。长期战时领导告一段落，新政府同时面对战争收尾与战后政策的责任。"),"1945/usa/外交":M("战争末期建立战后合作框架","欧洲战事结束、亚洲战争仍在继续之际，美国参与《联合国宪章》的签署。战时同盟的合作经验开始转化为新的国际组织框架，为战后的和平与国家协作提供制度基础。"),"1938/france/外交":M("对德妥协延续，安全危机扩大","继此前谋求欧洲合作与缓和的努力，法国参加慕尼黑协定，以妥协回应德国的领土要求。达拉第政府的选择没有消除扩张压力，法国的欧洲安全政策仍处于让步与防御之间。"),"1939/france/外交":M("妥协未能止战，法国对德宣战","前一年的慕尼黑安排未能阻止德国继续扩张，入侵波兰后，法国与英国于9月对德宣战。以谈判维持和平的政策转入战争状态，欧洲西线进入新的军事与外交阶段。"),"1940/france/政治":M("国家危局中形成继续抵抗的呼声","德军西线攻势使法国面临重大危局，戴高乐在6月发出继续抵抗的呼吁。自由法国运动由此获得象征性的起点，国家政治道路开始在失败、占领与坚持抵抗之间分化。"),"1941/france/战役":M("法国分裂延伸到海外战场","前一年的政治分裂继续影响战争，自由法国与英军在叙利亚、黎巴嫩对抗维希部队。抵抗与维希之间的矛盾进入实际战场，法国的战争经历也由本土延伸到海外。"),"1942/france/战役":M("占领扩大，维希控制进一步受限","德军在11月进入法国此前的未占区，使占领范围继续扩大。维希政权原有的控制空间进一步缩小，法国社会与抵抗力量面对的军事环境更加严峻。"),"1943/france/政治":M("海外抵抗力量推进政治整合","在占领与持续抵抗的背景下，法国民族解放委员会于阿尔及尔成立。分散力量开始建立共同政治机构，为继续战争与未来恢复国家治理作准备。"),"1944/france/战役":M("盟军推进与法国首都解放","随着盟军重返欧洲大陆，占领下的法国迎来解放进程，巴黎在8月重获自由。长期抵抗与军事推进在首都汇合，国家由占领状态迈向恢复与重建。"),"1945/france/外交":M("欧洲胜利结束占领与抵抗阶段","前一年的解放进程延续到战争终结，法国在5月迎来欧洲胜利。占领、分裂与抵抗的战争阶段告一段落，恢复国家生活与参与战后国际安排成为新的方向。"),"-2070/china/政治":M("早期国家形成的传统历史记忆","传统纪年把夏的起点放在约公元前2070年，禹与启的叙事反映早期国家和王朝权力形成的历史记忆。这里概述的是一个长期演进的阶段，不能把传统年代当作已由同时代文字证实的单年建国日期。"),"-2070/egypt/政治":M("统一王国之后的分裂与重整","约公元前21世纪的埃及处于第一中间期，尼罗河流域的政治权力经历分裂与重新整合。该节点用于对读同时期文明的状态，表示一个历史阶段，并不意味着变化集中发生在公元前2070年。"),"-2070/greece/文化":M("爱琴海文明迈向宫殿时代","约公元前21世纪，米诺斯文明的发展呈现爱琴海世界走向宫殿时代的趋势。文化变化通过长期积累展开，当前年份提供的是约略的时代参照，不能视为某一座宫殿或文明确切成立的日期。"),"-1600/china/政治":M("商的兴起与青铜礼制的发展","约公元前1600年前后，中国早期王朝的脉络进入商的兴起阶段，青铜器与礼制成为认识其政治文化的重要线索。王朝形成和社会组织经历长期变化，约年纪法保留了这一阶段的时间不确定性。"),"-1600/egypt/政治":M("多个政治中心并存的中间期","约公元前17世纪，埃及处于第二中间期，政治权力并非集中于单一稳定中心。现有条目概述多个中心并存的格局，作为阶段背景与中国、爱琴世界对读，并非某个确定年份的一次政权更替。"),"-1600/greece/文化":M("希腊大陆青铜文明逐渐兴起","约公元前1600年前后，迈锡尼文明在希腊大陆兴起，爱琴文明的发展重心呈现新的面貌。这是青铜时代文化逐步形成的节点，具体过程跨越较长时期，不能以一个约年替代全部发展历程。"),"-1046/china/战役":M("商周更替开启新的统治秩序","约公元前1046年，周在牧野击败商，王朝更替由军事胜负转入新的政治建设。礼制与分封随周的建立逐步展开，战役构成时代转折，但制度形成并非都在同一年完成。"),"-1046/egypt/政治":M("新王国之后进入政治重组","约公元前11世纪，埃及进入第三中间期，新王国之后的权力结构重新组合。这个阶段与中国商周更替大致同时，记录的是长期政治格局，无法把全部变化压缩到公元前1046年。"),"-1046/greece/文化":M("宫殿文明之后的爱琴世界重建","约公元前11世纪，爱琴世界经历宫殿文明之后的转型，原有社会秩序改变，新的文化生活逐步形成。条目指向重建阶段的整体面貌，保留世纪级时间范围，而不是一场有确定日期的事件。"),"-221/china/政治":M("列国战争走向统一帝国","长期列国竞争与兼并在公元前221年形成重大转折，秦完成统一，建立新的帝国秩序。文字、交通规范等统一措施随之推进，政治重心从多国争夺转向如何组织和治理更广阔的疆域。"),"-221/rome/政治":M("共和国延续，新的地中海战争将至","公元前221年的罗马仍处于共和国时代，与迦太基的竞争构成重要背景。第二次布匿战争尚未爆发，这一条目提供战争前夕的政治状态，用于与中国统一后的格局对读。"),"-221/egypt/政治":M("希腊化王朝中的君主交接","埃及继续由托勒密王朝统治，公元前221年托勒密四世即位，王朝出现新的君主交接。与中国建立统一帝国相对照，这里的变化发生在延续中的希腊化政治秩序内部。"),"-202/china/政治":M("楚汉竞争结束，帝国重新建立","秦亡后的军事与政治竞争以汉朝建立告一段落，刘邦成为新王朝的统治者。公元前202年的转折在于战争胜负转化为新的帝国秩序，国家重建成为接续的任务。"),"-202/rome/战役":M("对迦太基战争取得决定性胜利","罗马与迦太基的长期战争在扎马出现决定性转折，罗马击败对手。地中海竞争的力量关系随战役改变，共和国的战争经历由艰苦对抗转向胜利后的优势地位。"),"-202/egypt/政治":M("托勒密王朝在新君统治下延续","约公元前202年，埃及处于托勒密五世统治时期，希腊化王朝继续延续。这个条目呈现当时的国家状态，并不代表该年才开始托勒密五世的统治，也不是一个独立的建国事件。"),"220/china/政治":M("汉末权力分裂转入王朝更替","东汉末年的权力分裂在220年形成正式王朝更替，曹丕代汉建立曹魏。原有帝国名义终结，三国时代的政治格局逐渐展开，统一王朝的继承问题进入新的阶段。"),"220/rome/政治":M("塞维鲁王朝下的帝国延续","220年的罗马仍处于塞维鲁王朝，埃拉伽巴路斯在位，帝国制度继续运作。与中国当年的王朝更替对照，这里提供的是既有统治阶段的背景，没有将一个在位年份写成新政权的起点。"),"265/china/政治":M("魏晋交接，新的统一力量形成","三国格局延续之中，司马炎于265年末代魏建立晋朝，北方统治权发生交接。新王朝的成立为此后的统一提供政治基础，但这一年尚不能等同于全国统一已经完成。"),"265/rome/政治":M("三世纪危机中的内战与边境压力","265年的罗马仍陷于三世纪危机，内战与边境压力同时影响帝国稳定。此处描绘延续中的危机阶段，与中国北方建立新王朝的变化对读，而非把全部危机归于这一年。"),"420/china/政治":M("东晋终结，南朝王朝序列开启","东晋在420年被刘宋取代，南方政权进入新的王朝阶段。长期南北分立的局面并未因这次交接结束，但南朝的王朝序列由此展开，统治权发生明确更替。"),"420/rome/政治":M("东西两部走向不同的帝国道路","420年，罗马帝国东西两部的政治道路继续分化，分治格局已经存在。当前节点呈现当时的并立状态，不能把它写成帝国在这一年才首次分裂。"),"581/china/政治":M("北方王朝更替开启统一进程","杨坚在581年代北周建立隋朝，北方统治秩序发生更替。新王朝开启进一步统一的进程，但南北分立尚未在这一年结束，建国与完成统一需要区别。"),"581/rome/战役":M("东部帝国竞争继续围绕波斯展开","581年，东罗马与波斯的战争仍在持续，地中海东部的帝国竞争牵动边境安全。这里概述延续中的交战局面，与中国北方新王朝的建立同时对读，不把战争起点归于当前年份。"),"618/china/政治":M("隋末动荡中出现唐的新王朝","隋末的政治与军事动荡尚未平息，李渊于618年在长安称帝，唐朝成立。新王朝从纷争中开始建立统治，建国是转折点，后续稳定与统一仍需继续推进。"),"618/rome/战役":M("希拉克略时代的对波斯战争延续","618年的东罗马处于希拉克略统治时期，与萨珊波斯的长期战争仍在持续。帝国的主要军事压力来自这一对抗，当前条目描绘战争阶段，不能视为希拉克略在该年才开始统治。"),"907/china/政治":M("唐的终结使分裂进入新阶段","唐末的政治分裂在907年发展为王朝正式终结，后梁建立。五代十国时期由此展开，王朝名义的交接没有消除各地割据，国家秩序继续处于重组之中。"),"907/abbasid/政治":M("巴格达哈里发统治阶段的延续","907年的巴格达处于穆克塔迪尔统治时期，阿拔斯王朝的政治中心仍在延续。这个节点用在位背景呈现当时西亚的政治面貌，并不意味着王朝或该君主的统治始于907年。"),"907/rome/政治":M("马其顿王朝下的东罗马延续","907年的东罗马由利奥六世统治，处于马其顿王朝时期。与中国当年唐朝终结的剧烈变化相对照，这里提供延续中的王朝背景，而非一项新的建国或即位事件。"),"960/china/政治":M("五代政权交接中建立北宋","五代的王朝更替在960年出现新的转折，陈桥兵变后赵匡胤建立宋朝。北方统治权完成交接，重建国家秩序成为方向，但各地分立并未在建国当年立即结束。"),"960/abbasid/政治":M("哈里发地位与实际权力分离","960年的巴格达处于白益王朝控制之下，阿拔斯哈里发仍保留宗教地位。既有王朝名义与实际政治权力并不相同，条目呈现的是延续中的权力结构，不能把960年当作控制关系才开始的日期。"),"960/rome/战役":M("争夺克里特推动地中海扩张","东罗马在960年发动对克里特的进攻，作战延续至961年。地中海岛屿的争夺体现帝国军事扩张的方向，当前年度标记的是行动开始，后续结果属于跨年进程。"),"1271/china/政治":M("蒙古统治确立“大元”国号","忽必烈在1271年确定国号“大元”，既有蒙古统治进入新的王朝名义阶段。国号确立是政治制度表达的变化，不能据此把后续全国统一也提前到这一年。"),"1271/rome/政治":M("收复都城后延续帝国重建","1271年的东罗马处于巴列奥略王朝，在收复君士坦丁堡后继续维持帝国统治。这里概述的是恢复都城之后的阶段，收复行动本身并非发生于1271年。"),"1368/china/政治":M("元末战争中建立明的新秩序","元末战乱中的政治竞争在1368年形成重大转折，朱元璋称帝并建都南京，明朝成立。新王朝开始组织统治，王朝更替由军事争夺转入国家秩序的建立。"),"1368/ottoman/政治":M("奥斯曼势力继续向巴尔干扩展","1368年的奥斯曼处于穆拉德一世统治时期，向巴尔干的扩展仍在推进。与中国当年新王朝建立对照，这里呈现延续中的区域扩张，并不把君主即位或扩张起点归于该年。"),"1368/rome/政治":M("疆域收缩中的东罗马晚期","1368年的东罗马已经进入晚期，疆域缩小并面对奥斯曼势力扩张。条目展示一个延续中的弱势格局，与邻近奥斯曼的增长相互对读，未将帝国衰落写成单年发生的事件。"),"1644/china/战役":M("明清更替中的战争继续扩大","明末动荡在1644年迎来清军入关，王朝更替与军事争夺相互交织。入关构成重大转折，但各地战争并未就此结束，新统治的确立仍是此后持续展开的过程。"),"1644/britain/战役":M("英国内战出现重要战场转折","英国内战延续到1644年，马斯顿荒原战役成为议会方面与王党力量对抗的重要节点。战场优势出现变化，但内战仍在继续，不能把一场胜利等同于整个战争结束。"),"1644/france/政治":M("幼主摄政与欧洲战争同时延续","1644年的法国由年幼的路易十四在位，国家仍处于摄政阶段，并卷入三十年战争。王朝延续与欧洲军事竞争同时影响政治生活，当前节点提供的是统治背景，非当年的即位记录。"),"1644/ottoman/政治":M("欧亚帝国在既有统治阶段延续","1644年的奥斯曼帝国由易卜拉欣统治，疆域仍横跨欧洲与亚洲。条目以在位时期说明当时的政治状态，用于跨国对读，并未记录该年出现新的王朝或国家建立。"),"1912/china/政治":M("帝制转折后建立共和临时政府","辛亥革命推动的政治变化在1912年进入共和建制阶段，孙中山于元旦就任临时大总统，中华民国临时政府成立。国家制度的方向由帝制转向共和，后续权力交接与秩序建设仍需推进。"),"1912/britain/文化":M("技术进步遭遇海上安全的惨痛考验","现代远洋运输的发展在“泰坦尼克”号沉没中遭遇重大灾难，技术与规模并未自动保证安全。这一年收录的英国相关节点因此成为观察现代化信心、安全制度与人命代价的窗口。"),"1912/germany/政治":M("帝国延续中的欧洲大国竞争","1912年的德国仍处于德意志帝国时期，欧洲大国之间的竞争持续存在。现有条目呈现战前政治状态，不能将这种长期竞争归结为该年突然发生的一项事件。"),"1912/japan/政治":M("明治时期结束，进入大正年号","明治天皇于7月去世，日本进入大正时代，长期延续的年号与君主统治阶段发生交接。国家制度并非因此立即更换，但政治文化的时代标记从明治转入新的时期。"),"1912/usa/政治":M("进步时代的总统选举带来交接方向","美国在进步时代的改革背景下举行总统选举，威尔逊于11月获胜。选举确定了下一届政府的领导人，但赢得选举与正式就任分属不同阶段，当前年度记录的是选举结果。"),"1949/china/政治":M("长期战争之后建立新国家政权","中国经历长期战争与政治变动后，于1949年举行开国大典，中华人民共和国成立。国家建设由此进入新的政治阶段，建立政府与此后的制度、经济和社会建设相互衔接。"),"1949/usa/外交":M("战后合作转入跨大西洋安全联盟","战后国际关系逐渐形成新的阵营格局，美国与伙伴签署北大西洋公约，安全合作进入正式联盟阶段。此前以共同战胜轴心国为中心的合作，开始转向和平时期的长期防务安排。"),"1949/ussr/政治":M("首次核试验改变战后力量格局","苏联在1949年完成首次原子弹试验，核武器竞争进入新阶段。战后大国关系由常规军事与外交竞争进一步延伸到核能力，安全格局因此发生重要变化。"),"1949/britain/外交":M("欧洲战后安全合作进入联盟框架","英国参与签署北大西洋公约，战后安全合作由多国协调推进为正式联盟。欧洲重建与国际阵营变化同时构成背景，英国的防务安排更加紧密地连接跨大西洋伙伴。"),"1949/france/外交":M("重建中的法国参与共同防务","法国在战后恢复与欧洲安全重组的背景下成为北约创始成员。国家重建与国际防务安排相互联系，安全合作进入长期联盟框架，标志战后外交方向的重要变化。")},Iw={"china:xian-incident/1937/china/政治":M("兵谏之后，停战与释张仍待解决","1936年的西安兵谏留下善后难题，张学良虽获赦免却仍被管束，返陕与撤兵成为年初交涉的焦点。南京、西安和中共代表通过文电、派员与地方调停反复磋商，逐渐转向潼关谈判；月底仍在讨论驻区、经费与共同进退，现有记录尚不能视为善后已经全部完成。"),"china:xian-incident/1937/china/军事":M("三军联防与和平撤防之间的抉择","承接西安事变后的军事紧张，红军年初南下关中支援东北军与十七路军，三军关系成为防线安排的重要基础。张学良被扣又使撤兵谈判陷入分歧，中共主张以和平与适当撤防避免新内战，东北军内部则仍存在释张前不撤的强烈意见。"),"china:xian-incident/1937/china/社会":M("西安民众继续推动停止内战","西安事变后的和平期待在年初转为群众行动，各界团体通过游行与全国通电要求撤兵、停止内战。民众把对内和平与对外抗战相联系，社会诉求由此进入善后交涉的公共环境。"),"china:united-front/1937/china/政治":M("由停止内战逐步走向国共合作","年初围绕西安善后的交涉继续争取停止内战，三方关系与撤防安排仍有分歧。全面抗战阶段，红军主力改编为八路军，第二次国共合作形成，统一战线由和平谈判中的政治诉求进一步转化为共同抗日的组织与合作安排。"),"china:united-front/1937/china/军事":M("联合防御中的协同与分歧","年初红军南下与东北军、十七路军协调防御，既要维持友军关系，也要避免西安善后引发新的内战。军官座谈和撤兵争论显示联合并未自动消除内部分歧，围绕释张、联防与主动北撤的抉择仍在继续。"),"china:united-front/1937/china/社会":M("共同抗日诉求获得社会表达","年初西安各界把停止内战与共同抗日同时作为公开诉求，以游行和通电推动和平。统一战线的政治主张因此不仅见于上层交涉，也通过群众组织与公共行动获得表达。"),"china:income-tax/1937/china/经济":M("所得税从条例走向征收与争议","年初所得税征收推进到营利事业，税制开始从法规安排进入执行。上海律师团体随即组织研究，提出修改与减免意见，制度落地同时带来如何划定负担和落实规则的讨论。"),"china:industry/1937/china/经济":M("多年筹建终于转化为钢铁生产","重庆电力炼钢厂的建设自1919年起历经中断，至1937年1月才首次产出电炉钢。这一节点的意义在于长期筹建转入实际生产，现有记录提供的是工厂投产起点，不能据此概括全部年度工业产量。"),"china:literary-exchange/1937/china/文化":M("编辑、译介与结集拓展知识传播","年初《文摘》创刊、跨国译文通信和小说结集显示文学与学术传播依靠编辑协作持续展开。新刊物也把抗日、反对内战的主张带入公共讨论，出版活动与时代政治诉求相互联系。"),"china:sunrise-discussion/1937/china/文化":M("剧本评论延伸为公演的公共讨论","年初围绕《日出》的集体批评先在报纸专版集中呈现，随后被公演预告和评论节选继续传播。讨论由作家之间的评价延伸至舞台观众，剧本、编辑和演出宣传共同形成持续的公共文艺话题。"),"china:gaotai/1937/china/军事":M("从占领高台转入孤立防守与失利","红五军在元旦取得高台后，很快遭遇马步芳部的持续强攻，与临泽部队的联系受到切断。战局从攻占县城转为孤立守城，至1月20日失守，董振堂、杨克明等牺牲，部队遭受严重损失。"),"china:yanan-relocation/1937/china/政治":M("中央从保安迁驻延安","年初中央机关的驻地发生变化，毛泽东等从保安启程，经过数日行军于1月13日抵达延安。迁驻形成新的工作中心，逐日行程反映转移的过程，不能把沿途住宿地点当作中央已完成迁驻的节点。"),"china:yanan-relocation/1937/china/军事":M("警卫先行，部队配合中央迁驻","中央迁往延安前，警卫部队先行准备，红一团参与配合。朱德与所率队伍随后到达，军事与警卫安排构成机关转移的支撑，迁驻由此表现为人员、部队与驻地准备相衔接的过程。"),"china:yanan-relocation/1937/china/社会":M("迁驻后的欢迎与地方支援","中央进入延安后，当地军民通过欢迎大会和商会慰问参与迁驻后的接应。团结抗日、生产支援的主张在活动中公开表达，机关转移与地方社会的组织支持建立联系。"),"china:cadre-education/1937/china/文化":M("干部培养进一步面向抗日任务","年初红军大学更名为抗大，第二期开学与招生办法相继公布，干部教育开始更明确地围绕抗日任务组织。中央党校人员随后迁校，教育机构的名称、招生与驻地一起调整，为后续培养工作作准备。"),"usa:roosevelt/1937/usa/政治":M("第二任期前后的白宫政治协调","罗斯福在年初与国会领袖、行政管理专家和顾问持续会谈，准备新的任期与就职演说。1月20日第二次宣誓就职，已收录日志呈现交接前后的协调过程，未展开的会谈内容不能被推断成已落实的改革决定。"),"usa:roosevelt/1937/usa/经济":M("预算目标与劳资争端同时进入白宫","年初罗斯福通过财政会见、记者会与预算咨文讨论继续救济和收支平衡。汽车罢工持续期间，工会领袖与密歇根州长也进入接见记录，说明经济政策与劳资局势同时受到关注，但日志本身未说明每次会见的具体谈判结果。"),"usa:roosevelt/1937/usa/外交":M("从西班牙禁运到公开警告侵略","年初罗斯福签署西班牙武器禁运决议，并接待英国与巴西人士，外交活动仍围绕中立与接触展开。到10月，“隔离”演说公开警告国际侵略，海外战争扩大对美国政策形成更强压力。"),"usa:roosevelt/1937/usa/社会":M("洪灾救济与公共事务进入总统日程","年初洪灾促使罗斯福发布募捐公告并继续召开协调会议，总统活动与全国紧急救济相连。自然保护地划设、民权团体接见和慈善广播也出现在记录中，呈现公共事务的不同侧面；接见日志未记载的谈话内容保持未详。"),"usa:roosevelt/1937/usa/军事":M("海军事务通过接见与人事调整推进","年初罗斯福接见海军预备役军官委员会，并任命查尔斯·爱迪生为海军助理部长。当前专题显示总统层面的海军事务与领导人员补充，不能把这些安排直接等同于新的舰艇已经建成或投入战斗。"),"japan:japanese-cabinets/1937/japan/政治":M("陆军阻断组阁，首相人选再更换","广田内阁辞职后，宇垣奉命组织新政府，却因无法获得陆军大臣人选而被迫放弃。月底林铣十郎接获组阁命令，内阁更替的关键在于军部能够通过人选制度阻断组阁，已收录节点仍止于新的受命阶段。"),"japan:japanese-cabinets/1937/japan/军事":M("军部以大臣人选直接影响内阁","宇垣受命组阁之际，陆军三长官会议决定不提供陆军大臣，使新内阁无法组成。军部的政治影响通过一项具体人事拒绝发挥作用，军事机构因此直接决定政府形成的条件。"),"china:full-resistance/1937/china/政治":M("全国抗战推动合作与战时布局","7月以后，国民政府表明抗战立场，红军主力改编和第二次国共合作相继推进，共同抗日成为政治组织的中心。随着战局发展，政府于11月宣布迁都重庆，国家领导与战争准备转向适应长期抗战的布局。"),"china:lugou/1937/china/战役":M("华北从局部冲突转入全面抗战","卢沟桥事变使华北局势在7月急剧升级，战争由局部冲突扩展为全面抗战。9月平型关伏击体现八路军进入华北抗日战场后的作战，抵抗开始呈现不同部队与作战方式的协同。"),"china:shanghai-war/1937/china/战役":M("上海长期抵抗展示战争的持久性","华北战争扩大后，上海在8月进入大规模会战，中国军队持续抵抗约三个月。长期争夺显示战争难以迅速结束，也使城市与前线承受巨大消耗，淞沪成为全面抗战初期的重要战场。"),"china:nanjing-atrocity/1937/china/战役":M("南京平民遭受深重战争暴行","全面侵华战争发展到年底，日军在南京实施大屠杀，平民与被俘人员遭受严重暴行。这个专题记录战争对人的毁灭性后果，铭记遇难者是理解这段历史不可分割的部分。"),"china:xuzhou/1938/china/战役":M("徐州战场的胜利提振抗战士气","全面抗战在前一年展开后，中国军队继续抵御日军进攻，并在徐州会战中取得台儿庄胜利。这个专题呈现一场重要胜利的意义，不能将其直接视为整个徐州会战或全国战局已经逆转。"),"china:wuhan/1938/china/战役":M("武汉大会战之后转向战略相持","抗战进入第二年，中国军队围绕武汉展开持续数月的大会战。会战结束后战争进入战略相持的新阶段，作战重心与长期抗战的条件发生变化，持续抵抗仍是后续任务。"),"china:hundred-regiments/1940/china/战役":M("华北敌后主动扩大交通破袭","抗战相持阶段，华北敌后部队通过百团大战发动大规模交通破袭，打击日军交通与据点体系。作战体现敌后战场的主动行动与组织规模，不能把这一局部攻势概括为全国战争已转入总反攻。"),"china:burma/1942/china/战役":M("首次入缅把抗战延伸到盟军协作","中国远征军进入缅甸，与盟军共同应对日军进攻，中国抗战由本土进一步延伸到境外战场。仁安羌救援显示跨国支援的具体行动，当前收录节点集中于入缅与救援阶段。"),"china:burma/1943/china/战役":M("驻印军转向重建国际陆路补给","继前一年入缅作战之后，中国驻印军在10月开始缅北反攻。重建陆上国际补给线成为作战目标，战场方向从应对日军进攻转入争取恢复通道，但道路尚未在这一节点全部打通。"),"china:burma/1944/china/战役":M("滇西反攻与缅北战场形成呼应","承接缅北反攻，中国远征军在5月强渡怒江，向滇西失地展开反攻。境内反攻与境外通道作战相互衔接，恢复西南联络的军事准备继续推进，当前专题记录的是反攻起点。"),"china:allied-conferences/1943/china/外交":M("中国参与谋划战后东亚秩序","盟军战局逐渐改善，中国与美国、英国在开罗讨论对日战争及战后东亚安排。合作从当前抗战进一步延伸到未来秩序，会议中的原则表达仍需后续战争结果与外交行动落实。"),"china:victory/1945/china/外交":M("宣布投降之后完成签署与受降","日本8月宣布投降后，战争结束仍经历正式文件与地区接收的步骤。9月投降书签署，中国战区随后在南京举行受降仪式，抗战胜利由停战消息转为正式确认与接收投降的程序。")},Wh=["政治","军事","经济","文化","社会","外交","战役"];function Ww(a){const i=a.filter(f=>!f.archive),l=i.length?i:a,o=[],c=f=>{f&&!o.includes(f)&&o.length<3&&o.push(f)};return c(l.find(f=>f.featured)??l[0]),c(l[l.length-1]),c(l.find(f=>!o.some(h=>h.month===f.month))),c(l.find(f=>!o.includes(f))),o.sort((f,h)=>Na(f)-Na(h))}function e9(a,i,l=""){return Wh.flatMap(o=>{const c=a.filter(S=>S.country===i&&S.category===o).sort((S,T)=>Na(S)-Na(T));if(!c.length)return[];const f=Ww(c),h=[...new Set(c.filter(S=>S.archive||/年\d{1,2}月/.test(S.date)).map(S=>S.month))],p=`${c[0].year}/${i}/${o}`,g=l&&Iw[`${l}/${p}`]||$w[p],j=(g==null?void 0:g.title)??`${un(c[0].year)}年的${o}脉络`,v=(g==null?void 0:g.summary)??"本类记录的年度综述尚待补充，可沿下方事件入口阅读已收录的具体活动。",y=h.length===1?`现有记录集中于${h[0]}月`:h.length>1?`已收录${h.join("、")}月的活动`:"按原文纪年收录的代表性节点";return[{country:i,category:o,records:c,highlights:f,title:j,summary:v,coverage:y}]})}function ex({year:a,countries:i,items:l,explore:o,exploreJanuary:c,openEvent:f,topic:h}){const p=Object.fromEntries(i.map(v=>[v,e9(l,v
