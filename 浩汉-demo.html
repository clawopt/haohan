9日教育部又形成修改稿，13日举行部门协调会议。不同版本对“信仰学校”的措辞有分歧；草案拟写的4月1日施行日期不等于该法最终生效。`,"janGeSchool","官方文献集文件2a及编者注2：已读7日草案与9日修改稿，采用草案提出日，不把其拟定生效条款视为实施证据。"),Fe("palestine-memo",9,"外交","外交部德国事务处提出限制犹太人迁往巴勒斯坦的意见","德国 · 柏林 · 外交部","备忘录从反犹立场质疑哈阿瓦拉安排，并建议重新评估与德国出口利益相连的移民政策。",`1月9日，外交部德国事务处形成备忘录，讨论犹太人迁往巴勒斯坦及哈阿瓦拉财产转移安排。文件以反犹观念为依据，提出是否继续通过出口联系促进移民、是否向英国表明立场等问题。

这份意见是纳粹官僚反犹政策讨论的证据，文中的所谓世界性犹太阴谋不是事实。22日的部门回复与6月的后续指令分别形成，本条不把它们合成9日的正式禁令。`,"janGePalestine","官方文献集文件3a：已读1月9日署名备忘录。文件另含1月22日及6月材料，按各自日期处理；不采纳文书中的反犹阴谋论。"),Fe("civil-service-objections",10,"政治","总理府官员对公务员法的越级报告条款提出异议","德国 · 柏林 · 帝国总理府","基利讨论党务报告与行政纪律的冲突，认为草案尚未具备提交内阁的条件。",`1月10日，基利向拉默斯提出公务员法草案意见，重点批评越过行政层级向纳粹党报告的安排，并讨论退休公务员兼有劳动收入时的扣减条款。

他建议在主要争议解决前，不把草案提交1月26日内阁会议。意见维护的是纳粹体制内部的行政权限与纪律，不是恢复民主公务员制度的主张。`,"janGeCivilDraft",pn),Fe("freedom-radio",10,"政治","德国共产党在西班牙开播面向德国的反纳粹短波广播","西班牙 · 马德里附近 · 波苏埃洛-德尔雷伊","后来称为“德国自由广播29.8”的电台开始播音，为德国境内反纳粹听众提供消息。",`广播史研究将1月10日记为德国共产党在西班牙开始反纳粹短波播音的日期。西班牙共和国政府提供马德里附近的发射条件，节目编辑工作在瓦伦西亚等地进行。

柏林艺术科学院馆藏说明确认1937年1月开始这类播音，但只给到月份，并把“德国自由广播29.8”的名称与4月后的人民阵线组织关系联系起来。本条用后来通行名称辨识电台，不把更晚的组织变化提前到首播日。`,"janGeRadio","定日依据为单一广播史研究；艺术科学院馆藏说明交叉支持1月开播及发射、编辑地点，只支持到月。首播录音与原节目单未核，首播日仍待原始广播档案复核。",["janGeRadioArchive"]),Fe("citizenship-certificate",11,"政治","内政部要求修改帝国公民证书草案","德国 · 柏林 · 帝国内政部","普丰特纳记录对年龄、选举资格和海外德国人条件的调整要求。",`1月11日，普丰特纳向内政部宪法与立法部门发出记录，转述希特勒对帝国公民证书草案的意见：应保留既有选举年龄，并重新考虑海外德国人取得证书的条件。

张学良在1936年12月31日被判刑，西安部队既面对主帅去留问题，也面对与南京中央军的关系。阅兵属于实际军事展示，不等同于这天已经发动战斗。`,["zhangxueliang","yanghucheng","northeast-army","army17"],["northeast-army","army17"],"janXian"),te("yang-song",1,"政治","杨虎城致电宋子文，请求张学良返陕","西安 → 南京","杨虎城表示愿与张学良同担责任，要求宋子文继续斡旋。",`杨虎城在元旦给宋子文发电，表示此次举措应与张学良共同承担责任，单独处罚张学良令他不安；请求宋子文帮助张学良尽早返回陕西主持事务。

其背景是中央军向西安方向施压。防御部署与实际交火需要区分，不能把一份作战预案写成已经执行的战役。`,["zhouenlai","yanghucheng","wangyizhe","yejianying"],["northeast-army","army17","red-army"],"janZhou",{references:["janXian"],actions:[Se("zhouenlai","向中央转达友军的驰援要求。"),Se("yanghucheng","与王以哲及中共代表讨论联合防御部署。")]}),te("liweihan-departure",4,"政治","李维汉从保安出发，前往关中特区","保安 → 延安 → 关中","奉中央安排启程，随后由张邦英等护送前往关中特委。",`李维汉等人在1月4日从保安出发。资料记载他到延安后，经郭洪涛建议，与张邦英率游击队间道前往关中特委驻地桃渠河，会见习仲勋。

史料明确给出的是出发日期，没有给到达桃渠河的具体日。因此本条只把启程定位在4日，后续路线作为背景说明。`,["liweihan","xizhongxun"],["cpc-central"],"janLi",{actions:[Se("liweihan","离开保安，启程开展关中特区工作。")]}),te("appointments",5,"政治","南京公布顾祝同、孙蔚如等西北人事安排","南京 · 陕甘军事善后","杨虎城、于学忠被撤职留任，顾祝同任西安行营主任。",`国民政府发布命令，杨虎城、于学忠撤职留任，任命顾祝同为西安行营主任、孙蔚如为陕西省政府主席、王树常为甘肃绥靖主任，并配套安排部队驻区。

前几天电话中已经传达过有关意向；本条记录5日公布的命令，而非把预告日期当作正式任命日。西安方面对这些安排的接受过程仍在继续。`,["guzhutong","yanghucheng","yuxuezhong","sunweiru"],["nanjing-government","central-army"],"janXian"),te("yang-protest",5,"政治","杨虎城领衔通电，抗议扣留张学良与中央军西进","陕西 · 西安","公开要求兑现停止内战的承诺，并促成张学良返陕。",`杨虎城等向中外发出通电，说明西安事变出于抗日救国目的，表达在蒋介石领导下共同抗日的意愿，同时抗议张学良未返、中央军继续西进等情形。

通电是对外政治表达。文中关于各部队和封锁状况的描述是西安方面在当时的陈述，应连同南京方面的来函与安排阅读。`,["yanghucheng","zhangxueliang","chiang"],["army17","northeast-army"],"janXian",{actions:[Se("yanghucheng","领衔向中外发布通电，要求停止军事压力、恢复张学良自由。")]}),te("red-orders",5,"军事","张闻天、毛泽东发电部署红军南下","保安 → 西安、红军前线","要求发拥蒋迎张通电，并指示红一军团、红十五军团急行军南下。",`张闻天、毛泽东联合致电周恩来、博古，贯彻2日会议的方针，政治上要求发“拥蒋迎张”通电；军事上要求彭德怀、任弼时调动红十五军团，红一军团及红十五军团主力南下。

这是命令与部署的发出日，部队具体抵达关中的日期另有8—9日等记载。这里不把发令与到达写成同一个瞬间。`,["zhangwentian","mao","peng","renbishi","zhouenlai","bogu"],["cpc-central","red-army"],"janPolicy",{actions:[Se("zhangwentian","与毛泽东联名发电，要求政治通电与军事支援并行。"),Se("peng","被要求会同任弼时部署红军部队南下。")]}),te("pan-contact",5,"政治","中央电令潘汉年与宋子文接洽","保安 → 上海","要求宋子文继续推动停战、释放政治犯等西安谈判承诺。",`张闻天、毛泽东联名电令在上海的潘汉年迅速与宋子文接洽，要求推动西安谈判所商议的停战撤兵、释放政治犯、停止剿共和对外合作等条件。

本条记录中央给潘汉年的电令。所引研究没有给出潘汉年当天与宋子文会面的确切地点和时刻，不将“要求接洽”改写为“已经会见”。`,["panhannian","songziwen","zhangwentian","mao"],["cpc-central"],"janPolicy"),te("zhou-stay",6,"政治","中央再次指示周恩来留在西安","陕北 → 西安","考虑张学良被扣的风险，暂不让周恩来赴南京谈判。",`1月5日、6日，中央连续向周恩来、博古发电，对周恩来前往南京的安全表示担忧，指示他暂不离开西安，并欢迎南京方面的代表到西安协商。

相关谈判史说明，中央仍希望继续和平接触。本条记录6日的留驻指示，不补写没有史料的当天个人行程。`,["zhouenlai","mao","bogu"],["cpc-central"],"janTalks",{evidenceNote:"相关记载以“1月5日、6日连日发电”表述；本条记6日再次指示。须与此前5日的政治和军事电报分别理解。"}),te("yang-guangxi",6,"政治","杨虎城电请李宗仁、白崇禧策应","西安 → 广西方面","希望桂系支持抗日主张，协助处理张学良被扣与西北危局。",`《杨虎城大传》记载，杨虎城6日致电李宗仁、白崇禧，说明张学良未能返回及中央军西进的局势，要求通盘筹划、切实策应，推动抗日主张。

这条记录可看出地方军事集团之间的政治联络。电报没有证明桂系部队在当天向西安调动；能确认的是请求支持的通信。`,["yanghucheng","li","baichongxi"],["army17","guangxi-clique"],"janXian"),te("propaganda",7,"政治","中央向刘少奇发出西安事变宣传方针指示","陕北 → 北方局","把西安善后问题纳入北方地区的政治宣传工作。",`程中原所引研究记载，1月7日中共中央向刘少奇发出《关于西安事变宣传方针的指示》。它处在中央呼吁停止内战、维护西安和平局面的文电往返中。

资料在此处列出文件题名与日期，未全文转录。本条据此记录指示的发出，不自行补造宣传口号、报纸篇目或执行人数。`,["liushaoqi"],["cpc-central"],"janPolicy"),te("chiang-letter",7,"政治","蒋介石写信给张学良，要求西安各部服从命令","奉化 → 张学良","要求张学良致函杨虎城和各将领，配合陕甘军事善后安排。",`蒋介石7日致信张学良，介绍陕甘军事善后办法，要求他写信劝杨虎城及各将领服从中央安排，并表示如不遵守将按抗命处置。

同日蒋介石也向杨虎城等解释特赦后继续管束的安排。这里以一封有明确对象的信为单位，不把信中的要求写成西安部队已经执行。`,["chiang","zhangxueliang","yanghucheng"],["nanjing-government"],"janXian",{actions:[Se("chiang","致信张学良，要求其转劝西安将领服从善后命令。")]}),te("peace-circular",8,"政治","中共中央与苏维埃中央政府发停止内战通电","陕北 · 对全国公开","公开呼吁和平，敦促蒋介石兑现西安谈判后的承诺。",`1月8日，中共中央与苏维埃中央政府发表《为号召和平停止内战通电》。在中央军施压、张学良未返的背景下，通电继续要求避免内战、推动抗日。

这份公开文电与同时进行的军事准备并存。它不是已经签署的停战协议，也不意味着局势从当天起没有冲突风险。`,["mao","zhangwentian","chiang"],["cpc-central"],"janPolicy"),te("steel",8,"经济","重庆电力炼钢厂第一次产出电炉钢","重庆 · 电力炼钢厂","始于1919年的筹建历经多次中断，这天建成投产并出钢。",`《四川省志·冶金工业志》明确记载，1937年1月8日重庆电力炼钢厂第一次产出电炉钢。该厂1919年开始筹建，因政局和资金问题长期停顿，后由国民政府军政部兵工署接办。

具体可确认的活动是建成投产及首次出钢。资料未提供当天炉次、钢号、班组名单或产量，本条不补写这些生产细节。`,["chongqing-steel"],["nanjing-government"],"janSteel",{actions:[Se("chongqing-steel","投入生产，第一次产出电炉钢。")],evidenceNote:"地方志直接给出1月8日“第一次产出电炉钢”；当天具体产量、班组、钢号未见于本资料。"}),te("reinforcements-arrive",8,"军事","红军部队进入三原、耀县、咸阳一带","陕西 · 关中","8—9日间陆续抵达，支援东北军与十七路军。",`中央党史研究室研究员的西安善后文章记载，红军于1月8日、9日赶到三原、耀县、咸阳一带，为西安方面提供军事支持。

来源把抵达过程写成跨两日的部署，没有给每一支部队的到站清单。选择8日或9日均可看到这项持续活动，但不能据此分配某个军团某小时进入某县。`,["peng","renbishi","red-army"],["red-army","northeast-army","army17"],"janZhou",{endDay:9,precision:"range",date:"1937年1月8日—9日",evidenceNote:"跨日记录：来源同时列8日、9日，未拆分各部队逐日位置。"}),te("xian-demonstration",9,"社会","西安各界团体游行，要求撤兵与停止内战","陕西 · 西安","民众向全国发通电，要求实现对内和平与对外抗战。",`陕西图书馆专题史记载，1月9日西安各界团体举行武装示威游行，通电要求国民党中央撤退入陕部队、惩办挑动内战者。

本条以有日期的游行和通电为核心。史料列有参加团体和人数，但这些规模数字尚未在本档案中独立核验，因此不以数字渲染现场。`,["xian-public"],["xian-public"],"janXian"),te("no-fire",9,"政治","张闻天、毛泽东复电：非不得已不开火","陕北 → 西安","要求保持西北局面，将避免新内战作为基本方针。",`张闻天、毛泽东9日回复周恩来、博古，提出保持西北目前局面、非不得已不开火是当前基本方针。

它与5日红军南下的部署并不矛盾：中央一面加强友军的防御能力，一面设法避免局势转为新内战。月底对是否与友军共同应战的讨论，则是后续的另一层问题。`,["zhangwentian","mao","zhouenlai","bogu"],["cpc-central"],"janPolicy"),te("mao-travel10",10,"政治","毛泽东离开保安，宿侯市寺儿台","保安 → 志丹县侯市寺儿台","迁往延安的第一天，经桥儿沟、张沟等地，傍晚住宿。",`人民政协报所刊行程记载，毛泽东1月10日从保安动身，经桥儿沟、张沟、余家坡、井沟岔、王家畔，傍晚到侯市寺儿台住宿。

这里展现的是个人迁驻行程，不将1月13日“中央到达延安”的总体节点当成其每一天都在延安办公。沿途里程与时间来自后来的行程整理，尚未对照原始日记逐段复测。`,["mao"],["cpc-central"],"janYan",{actions:[Se("mao","从保安出发，傍晚在侯市寺儿台住宿。")]}),te("zhou-zhang-letter",10,"政治","周恩来写信给张学良，表明三军共进退","西安 → 张学良","盼张学良返回西安，并说明红军与东北军、十七路军的关系。",`人民网所载周恩来相关章节记载，1月10日周恩来致函张学良，表示红军与东北军、十七路军共同进退，希望他回西安主持大计。

书信体现了周恩来在三方之间协调的角色。它不等同于南京已经允许张学良返回，也不能替代此后发生变化的三军关系。`,["zhouenlai","zhangxueliang"],["red-army","northeast-army","army17"],"janLetters"),te("mao-travel11",11,"政治","毛泽东继续行军，宿安塞王窑高沟口","侯市寺儿台 → 安塞县王窑高沟口","早晨出发，经侯家坡、王新庄等地，夜间在高沟口住宿。",`逐日行程记载，1月11日毛泽东从寺儿台出发，经郭家砭、侯家坡、王新庄等地，到安塞县王窑高沟口住宿。

来源整理了路线与落脚点，却没有当天的完整工作日程。不能因为他正在迁驻，就虚构沿途会议、给每一位同行人员分配谈话或补出准确到分钟的到达时刻。`,["mao"],["cpc-central"],"janYan",{actions:[Se("mao","继续向延安行进，宿高沟口。")]}),te("zhou-chiang-letter",11,"政治","周恩来致函蒋介石，要求撤兵与释张","西安 → 蒋介石","指出中央军再次入陕与张学良被扣，引发西安方面不安。",`在10日致张学良信后的第二天，周恩来写信给蒋介石，要求撤退进入陕甘的中央军，释放张学良返回西北主持军政，以避免新的内战。

“第二天”与前条10日信件构成日期依据。本条只记写信行为及主要要求，不以缺失的投递日或回信日代替写作日。`,["zhouenlai","chiang","zhangxueliang"],["cpc-central"],"janLetters",{evidenceNote:"人民网相关章节先记1月10日致张信，接着以“第二天”记致蒋信；日期据上下文确定为11日。"}),te("mao-travel12",12,"政治","毛泽东从高沟口出发，宿安塞碟子沟","王窑高沟口 → 安塞碟子沟","经招安、枣湾等地继续南行，尚未到达延安城。",`逐日行程记载，毛泽东1月12日从高沟口出发，经庙湾、白渠、白坪、招安、店子坪、枣湾等地，在安塞碟子沟住宿。

这一天的可确认信息是迁驻路线与宿营地点。它与河西走廊高台战事恰在同一日发生，地点却相隔很远；同日不意味着两条活动直接发生联系。`,["mao"],["cpc-central"],"janYan"),te("gaotai-attack",12,"军事","马步芳部开始强攻高台，红五军据城防守","甘肃 · 高台","高台与临泽红军的联系受到切断，攻守战延续到20日。",`1月12日，马步芳部集中兵力进攻高台。董振堂指挥红五军守城，进攻方利用炮击、纵火等手段逼近城下，高台与临泽的联系被切断。

不同资料对进攻部队的旅数表述不一，因此本条不采用精确旅数。12—20日为战事区间；在其中某天看到本条，只代表战斗持续，不能据此虚构那天的具体冲锋次数和伤亡。`,["mabufang","dongzhentang","red5"],["ma-clique","west-red"],"janGaotai",{endDay:20,precision:"range",date:"1937年1月12日—20日",references:["janGaotaiCheck"],actions:[Se("mabufang","所部从12日起强攻高台。"),Se("dongzhentang","组织红五军守城，在孤立状态下持续抵抗。")],evidenceNote:"起攻日12日、失守日20日可对照；旅数有差别，未采用。区间内没有逐日作战日志，不补齐每日战况。"}),te("delegates-nanjing",12,"政治","杨虎城、王以哲、周恩来商议派代表赴南京","西安 → 南京","决定由李志刚、鲍文樾继续谈判，把张学良去留作为关键问题。",`杨虎城、王以哲、周恩来等研究南京提出的方案及蒋介石来信，认为张学良返陕问题须优先解决，决定派十七路军代表李志刚、东北军代表鲍文樾前往南京谈判。

这里记录决定派遣的日期；代表的实际出发时刻和沿途交通没有在本资料中逐项给出。`,["yanghucheng","wangyizhe","zhouenlai","lizhigang"],["army17","northeast-army"],"janXian"),te("zhu-arrival",13,"军事","朱德与所率队伍到达延安","陕北 · 延安","行程整理记载朱德较毛泽东先到城内，率队进入延安。",`人民政协报关于中共中央进驻延安的文章记载，1月13日朱德率队进入延安，时间早于毛泽东到达。

资料给出约下午3时的回溯记述，本档案以日为最高导航精度，并在说明中保留其“约”的性质，不将该时刻当作多源核验后的精确计时。`,["zhu","red-army"],["red-army"],"janYan",{actions:[Se("zhu","率红军队伍进入延安。")],evidenceNote:"单篇行程整理记作13日约下午3时；时刻为约数，本条按日展示。"}),te("mao-arrival",13,"政治","毛泽东、张闻天等抵达延安","碟子沟 → 延安","经过沿河湾、杨家岭等地，进入延安，中央迁驻完成。",`毛泽东等1月13日从碟子沟出发，经沿河湾、河庄坪、杨家岭等地抵达延安。城内各界群众和红军人员迎接中央领导。

中央迁驻的日期也见于中国共产党1937年大事记。逐日路线与现场细节主要出自人民政协报的回溯整理，不把欢迎场面中的每一项安排都当作独立核定的日记记录。`,["mao","zhangwentian","renbishi"],["cpc-central"],"janYan",{actions:[Se("mao","从碟子沟行进至延安。"),Se("zhangwentian","随中央领导机关迁驻延安。")]}),te("yanan-welcome",14,"社会","延安举行欢迎大会，毛泽东讲话，商会赠慰问品","延安 · 大操场","郭洪涛主持；军民听取团结抗日、生产支援等主张。",`1月14日上午，延安大操场举行欢迎中央进驻大会，郭洪涛主持。毛泽东讲话，提出团结抗日、加紧生产、支援前线等要求；商会向中央及红军赠送慰问品。

这条把讲话、群众参与与物资慰问放在同一场活动中阅读。来源未列出慰问品的数量、品名与各商户份额，不补造清单。`,["mao","yanan-public"],["cpc-central","yanan-public"],"janYan",{actions:[Se("mao","在欢迎大会上发表团结抗日与生产支援的讲话。"),Se("yanan-public","参加欢迎活动；当地商会赠送慰问品。")]}),te("mediation15",15,"政治","张闻天联络上海地下党，潘汉年回复调停进展","延安 ↔ 上海","要求推动地方实力派与宋子文斡旋；潘汉年请宋庆龄转达。",`张闻天15日致电冯雪峰、潘汉年，要求联络韩复榘、刘湘及李宗仁、白崇禧等，促成和平调停，并请宋子文继续承担调解责任。

潘汉年当天回复，已经请宋庆龄向宋子文说项，并安排向各方联络。发出要求与回复进展是两个方向的行动，不应据此认定被联络者都已在当天答应。`,["zhangwentian","panhannian","songqingling","songziwen"],["cpc-central"],"janPolicy",{actions:[Se("zhangwentian","发电要求上海方面扩大调停联系。"),Se("panhannian","回复联络进展，报告已请宋庆龄向宋子文说项。")]}),te("regional-circular",15,"政治","刘湘、李宗仁、白崇禧联名呼吁政治解决","川系、桂系 · 对全国通电","要求入陕中央军停止进攻，希望蒋介石回南京主持大计。",`刘湘、李宗仁、白崇禧在15日联名发表通电，呼吁入陕中央军停止进攻，以政治办法处理西安问题，并希望蒋介石结束休假返回南京。

它与同日中共通过上海联系各方的努力有关联，但现有资料不能证明每位署名者都直接收到某封电报后立即作出决定。具体的签署地点也未逐一给出。`,["liuxiang","li","baichongxi","chiang"],["sichuan-clique","guangxi-clique"],"janPolicy"),te("accept-dismissal",16,"政治","杨虎城、于学忠通电接受撤职留任处分","西安、甘肃方面","同时继续请求让张学良返回陕西处理善后。",`16日杨虎城、于学忠通电接受“革职留任”的处分，并请求蒋介石让张学良返陕主持善后。

接受处分是一项具体的政治让步，不能等同于对所有驻防方案都已同意，更不意味着东北军内部关于战与和的争论已经解决。`,["yanghucheng","yuxuezhong","zhangxueliang"],["army17","northeast-army"],"janXian"),te("kangda-name",19,"文化","中央决定将红军大学更名为抗日军政大学","陕西 · 延安","学校正式采用“中国人民抗日军事政治大学”的名称。",`为适应统一战线的新形势，中央在1月19日决定将中国人民抗日红军大学更名为中国人民抗日军事政治大学，校址设在延安。

更名决定与21日开学、发布招生广告是相互关联的不同活动。本条不把办学名称变更写成一所全无前身的新学校首次创办。`,["kangda","lin"],["cpc-central"],"janSchool"),te("gaotai-falls",20,"军事","高台城失守，董振堂、杨克明等牺牲","甘肃 · 高台","历经持续攻守战，红五军在孤立状态下遭受严重损失。",`甘肃党史资料记载，20日凌晨原民团人员打开城门，进攻部队入城；董振堂、杨克明等红五军人员在战斗中牺牲。

本条记录战事区间的终点与指挥人员的结局。不同回忆对末期细节与损失规模有差别，档案不补出未经核对的最后一句话、个人动作或每小时伤亡。`,["dongzhentang","yangkeming","red5","mabufang"],["west-red","ma-clique"],"janGaotai"),te("delegate-return20",20,"政治","李志刚等回到西安，带回修订后的善后方案","南京 → 西安","代表带回蒋介石、张学良的信，以及甲、乙两种安排。",`《杨虎城大传》记载，李志刚等20日回西安，带回蒋介石、张学良给杨虎城的信和再次修订的陕事方案。方案仍分甲、乙两类，涉及东北军、十七路军及红军的驻区。

此前已有方案提出和交换，20日对应的是代表带回修订文本。不能把所有版本都视为同一日形成的固定协议。`,["lizhigang","yanghucheng","chiang","zhangxueliang"],["army17","northeast-army"],"janXian"),te("kangda-opening",21,"文化","抗大举行第二期开学典礼，毛泽东讲话","延安 · 抗日军政大学","毛泽东任教育委员会主席，林彪任校长，刘伯承任副校长。",`1月21日，抗日军政大学举行第二期开学典礼。学校成立教育委员会，毛泽东任主席，林彪任校长，刘伯承任副校长。

开学活动反映对军政干部培养的组织化安排。相关军史资料记录毛泽东在典礼上的讲话，本条不将后来各期校训与教学规定都倒推为当天已齐备。`,["mao","lin","liubocheng","kangda"],["cpc-central"],"janSchool",{actions:[Se("kangda","举行第二期开学典礼，组织军政干部教育。"),Se("mao","出席并在典礼上讲话。")]}),te("kangda-advert",21,"文化","抗大发布招生广告，列明资格、考试与供给办法","延安 · 面向全国招生","规定随到随考，录取后被服、膳食、书籍文具由学校供给。",`抗日战争纪念馆所藏招生广告的介绍明确给出1月21日。广告招收有志民族解放、具高小或同等文化程度、身体健康的18至28岁青年，考试包括政治测验、作文、口试、体格检查。

被录取者由招生处送往延安，学校供给被服、膳食、书籍和文具。这里记录广告规定，不能据此认定当天实际入学人数或当天供应物资的数量。`,["kangda"],["cpc-central"],"janSchool",{actions:[Se("kangda","公布招生条件、测试科目及入学后的生活学习供给办法。")],evidenceNote:"资料依据纪念馆陈列的1937年1月21日招生广告；年龄和考试科目为广告规定。"}),te("xian-conference21",21,"政治","杨虎城召集军政负责人，提出接受甲案的附加要求","陕西 · 西安","周恩来应邀参加；会议决定再派李志刚到奉化。",`杨虎城21日召开东北军和十七路军军政负责人会议，周恩来应邀参加。会议决定派李志刚携信赴奉化，表示接受甲案，同时提出中央军暂退、在西安保留友军以及给予张学良名义等要求。

会议还提出，在国民党三中全会决定国策前由杨虎城接济红军。记录的是谈判条件，不代表南京已经全部接受，也不代表经费当天已经拨付。`,["yanghucheng","zhouenlai","lizhigang"],["army17","northeast-army","red-army"],"janXian",{actions:[Se("yanghucheng","主持会议，讨论有条件接受甲案与临时接济红军。"),Se("lizhigang","被安排携会议意见赴奉化继续交涉。")]}),te("officers22",22,"军事","彭德怀、任弼时邀东北军军官座谈","陕西 · 西安","尝试说服主和、主战双方接受甲案，座谈没有消除分歧。",`陕西图书馆所收专题史记载，22日上午彭德怀、任弼时邀请东北军主和、主战两派军官座谈，希望推动接受甲案；谈话结束时军官没有积极回应。

这里能确认一次协调会议和分歧仍存。主战、主和是本阶段对善后办法的态度，不能等同于某个军官终身固定的政治标签。`,["peng","renbishi"],["red-army","northeast-peace","northeast-young"],"janXian"),te("chiang-li23",23,"政治","蒋介石在奉化会见李志刚","浙江 · 奉化","重申张学良不能返陕，要求西安直接与顾祝同接洽。",`李志刚由戴笠陪同到奉化，当晚被蒋介石召见。蒋介石重申张学良不能回去，要求西安方面服从善后安排，并把实际困难交给顾祝同商谈。

本条据专题史记录会面的日期与主要意见。书中长段对话属于事后史述，本档案用间接转述，避免把全部对话当作逐字现场录音。`,["chiang","lizhigang","guzhutong"],["nanjing-government","army17"],"janXian"),te("mao-report24",24,"政治","毛泽东在常委会上讨论和平与撤防边界","陕西 · 延安","提出以和平为总方针，讨论退至渭北等可能让步与张学良问题。",`24日毛泽东在中央政治局常委会议作报告，分析西安与南京关系，说明和平是总方针，讨论潼关、西安驻兵和撤至渭水以北等可能安排，并强调张学良问题与和平保障。

这是会议中的形势判断和谈判边界，不能写成当天所有部队已经按该方案撤防。`,["mao","zhangxueliang"],["cpc-central"],"janXian"),te("yang-tongguan24",24,"政治","杨虎城同意派代表与顾祝同在潼关商谈","西安 → 潼关方向","电复蒋介石，并催李志刚回陕汇报、参加谈判。",`杨虎城24日电复蒋介石，同意派代表赴潼关直接与顾祝同商谈；同日致电李志刚，要求尽快回陕西汇报，再参加潼关谈判。

这是谈判渠道的转换与派遣安排，不把25日回报、此后在潼关的谈判结果提前到24日。`,["yanghucheng","chiang","guzhutong","lizhigang"],["army17","nanjing-government"],"janXian"),te("li-return25",25,"政治","李志刚飞回西安，军政会议听取奉化交涉汇报","奉化、南京 → 西安","杨虎城召集高级人员，决定由李志刚、谢珂赴潼关谈判。",`李志刚25日飞回西安。杨虎城立即召集东北军、十七路军高级军政人员听取其交涉汇报；在获悉张学良仍不能返回后，转入讨论如何直接与顾祝同谈判，决定由李志刚、东北军代表谢珂前往潼关。

同一天发生了代表返回、内部汇报和决定新派遣，详情以行动顺序串联，不补出未经记载的航班号或开会小时。`,["lizhigang","yanghucheng","guzhutong"],["army17","northeast-army"],"janXian"),te("zhang-depart25",25,"政治","张闻天从延安启程，前往西安协调危局","延安 → 西安","在东北军内部争论加剧时出发，27日到达西安。",`程中原的研究记载，张闻天25日从延安出发，27日秘密到达西安，与周恩来、博古等商讨局勢。

本条将启程与到达分列。25日不能写成他已经在西安参加27日晚的军官请愿；也不根据路程猜测26日住宿地。`,["zhangwentian","zhouenlai","bogu"],["cpc-central"],"janPolicy"),te("yan-mediation25",25,"政治","张闻天电请刘少奇推动阎锡山调停","延安方面 → 北方局","将促成西安和平解决列为时局关键，请北方局扩大联络。",`25日张闻天致电北方局刘少奇，提出大力策动各方和平解决西安问题，请其设法推动阎锡山出面调停。

资料可以确认这项联络要求。阎锡山是否当天接到、如何回复及具体会面，需要另查其年谱和相关文电，不能直接由此电推定。`,["zhangwentian","liushaoqi","yanxishan"],["cpc-central","shanxi-clique"],"janPolicy"),te("sunrise-preview26",26,"文化","《民报》预告《日出》公演，引用茅盾评论","上海 · 《民报》","报道为戏剧工作社在卡尔登大戏院的演出预热。",`26日《民报》在《〈日出〉将公演》的报道中引用茅盾在集体批评中希望该剧早日上演的意见，为欧阳予倩执导、戏剧工作社组织的公演作宣传。

所引研究明确给的是报道日期，不把“将公演”改写为这天已经首演。之后29日、31日还刊出评论节选，构成连续的报刊宣传活动。`,["maodun","ouyangyuqian","caoyu"],["press-world"],"janSunrise"),te("zhang-arrives27",27,"政治","张闻天秘密抵达西安，与周恩来、博古商讨","陕西 · 西安","先与中共代表讨论方针，随后秘密住在王以哲副官家。",`张闻天27日抵达西安，与周恩来、博古商量局势和方针，随后秘密住到王以哲一位副官家中。

来源强调其行程隐蔽性。人物姓名、住址门牌和完整当日作息尚未由本资料逐一提供，本条只记录有根据的抵达、商讨和住宿安排。`,["zhangwentian","zhouenlai","bogu","wangyizhe"],["cpc-central","northeast-peace"],"janPolicy",{references:["janXian"]}),te("petition27",27,"军事","东北军青年军官夜间到周恩来住处请愿","西安 · 中共代表住处","坚持张学良返回后才能撤兵，周恩来反复劝说。",`27日晚，东北军青年军官到周恩来住处集体请愿，反对在张学良未返的情况下撤兵，要求红军共同应战。周恩来试图说服他们，争论持续到深夜。

不同研究对人数、提出的问题数量和谈话语气有不同表述，因此本条保留可对照的活动、时间与核心争点，不采用某个精确问题数量。`,["zhouenlai","zhangxueliang"],["northeast-young","cpc-central"],"janPolicy",{references:["janXian","janLetters"],actions:[Se("northeast-young","夜间集体提出诉求，要求释张后撤兵并争取红军支持。"),Se("zhouenlai","劝说军官避免新的内战，继续向中央请示。")],evidenceNote:"三篇史述均记27日晚的聚会争论；对召集方式、人数和问题数量有差别，本条不取其精确数值。"}),te("zhang-yunyang28",28,"政治","博古安排张闻天转往云阳红军指挥部","西安 → 泾阳云阳镇","西安夜间争论后，张闻天转移，与任弼时等讨论对策。",`28日上午博古向张闻天说明夜间情况，安排车辆送他到泾阳县云阳镇红军前敌总指挥部。张闻天到达后，与任弼时、杨尚昆、王稼祥等商议。

["1936.03","出任首相。"],["1937年","内阁辞职后，再在近卫内阁任外务大臣。"]]);it("ugakikazushige","宇垣一成","1868.08.09","1956.04.30","日本军人和政治人物，曾任陆军大臣、朝鲜总督、外务大臣，1937年组阁受陆军阻挠而失败。",[["日本国立国会图书馆 · 宇垣一成生平","https://www.ndl.go.jp/portrait/e/datas/239/"]],[["1923年","任陆军次官。"],["1924年","任陆军大臣。"],["1925年","推进裁军。"],["1931年","转任朝鲜总督。"],["1938年","任外务大臣等职。"],["1953年","当选参议院议员。"]]);const f7=u7,h7={},d7={},m7={},z=(a,i,l)=>({title:a,period:i,text:l});function je(a,i,l=[]){h7[a]=i,m7[a]=l.map(([o,c],f)=>{const h=`life-${a}-${f}`;return d7[h]={name:o,url:c},h})}const Ra=(a,i)=>[`大英百科全书 · ${a}生平`,`https://www.britannica.com/biography/${i}`];je("chiang",[z("早年与军事教育","1887—1923","蒋介石名中正，生于浙江奉化溪口。青年时期接受新式军事教育，赴日本学习，并参加反清革命活动。辛亥革命后，他在上海等地从事军政活动，逐渐进入孙中山的政治与军事圈子。1923年赴苏联考察军事制度，这段经历与他随后参与黄埔军校建设有关。"),z("黄埔、北伐与南京政府","1924—1936","1924年出任黄埔军校校长，建立了对其后政治生涯有重要影响的军政人脉。北伐期间担任国民革命军总司令。1927年发动清共，第一次国共合作破裂，随后成为南京国民政府的主要领导人。他在整合地方军事力量的同时推进对共产党的军事围剿，1936年西安事变后被迫接受停止内战、共同抗日的要求。"),z("抗日战争与战后内战","1937—1949","全面抗战期间，蒋介石以军事委员会委员长身份统筹正面战场和国民政府军政事务，政府逐步迁往重庆。太平洋战争爆发后积极争取同盟国援助，1943年参加开罗会议。抗战结束后，国共谈判未能阻止全面内战，国民党军队在主要战役中失败，国民政府最终撤往台湾。"),z("台湾时期与逝世","1949—1975","在台湾继续担任中华民国总统，维持国民党的威权统治及戒严体制，也推动土地改革与经济建设。政治镇压、白色恐怖及其战争时期的决策，是评价其一生时不可忽略的部分。1975年4月5日在台北去世。他的生涯贯穿晚清、民国革命、抗日战争、国共内战及两岸分治。")],[Ra("蒋介石","Chiang-Kai-shek")]);je("mao",[z("求学与思想转变","1893—1921","毛泽东生于湖南湘潭韶山的农民家庭。辛亥革命期间曾短期参军，1914年至1918年在湖南第一师范学校求学，与蔡和森等组织新民学会。五四运动前后，他在读书、社会调查和政治活动中逐渐接受马克思主义，参与创建湖南共产主义组织，并于1921年出席中共一大。"),z("农民运动、根据地与长征","1921—1935","早期主要从事工人运动、党务和农民运动，主持农民运动讲习所并撰写社会调查文章。1927年国共合作破裂后领导秋收起义，转向井冈山建立农村根据地。1928年与朱德所部会师，参与建设红军与中央苏区。1934年参加长征，1935年遵义会议后逐步取得中央和红军的主要领导地位。"),z("抗战、内战与建国","1935—1949","在陕北和延安时期参与制定抗日民族统一战线政策，抗战中提出持久战和敌后游击战争的战略，撰写《论持久战》《新民主主义论》等著作。1945年主持中共七大，随后赴重庆参加国共谈判。全面内战期间参与统筹军事和政治部署，1949年10月1日在北京宣告中华人民共和国成立。"),z("国家建设与晚年","1949—1976","新中国成立后领导土地改革、工业化和社会主义改造，任中央人民政府主席、国家主席及中共中央主席。1958年发动“大跃进”和人民公社化运动，1966年发动“文化大革命”，这些决策造成严重损失，是其晚年历史的重要组成部分。1970年代推动中美关系改善。1976年9月9日在北京去世；其革命贡献和晚年错误均应纳入完整生平。")],[["中国共产党新闻网 · 毛泽东生平","https://cpc.people.com.cn/daohang/n/2013/0227/c357212-20620790.html"]]);je("zhouenlai",[z("早年教育与革命道路","1898—1924","周恩来生于江苏淮安，少年时期在东北和天津求学，曾赴日本，并在五四运动中参与天津学生运动。1920年赴欧洲勤工俭学，在法国等地从事革命组织工作并加入中国共产党。回国后进入黄埔军校，担任政治部主任，参与第一次国共合作时期的军队政治工作。"),z("武装斗争与统一战线","1924—1945","参与领导上海工人第三次武装起义和南昌起义，后来负责中央军事、组织与地下工作，并参加长征。西安事变期间赴西安参与谈判，推动和平解决。抗战时期长期在武汉、重庆等地开展统一战线与对外联络，协调国共关系，联系民主人士和国际社会。"),z("总理、外交与晚年","1949—1976","新中国成立后长期任国务院总理，早期兼任外交部长，参与国家经济、行政和外交事务。出席日内瓦会议和万隆会议，推动和平共处五项原则的外交实践。“文化大革命”期间继续处理政府工作，处境复杂。晚年患病仍参与中美关系改善等事务，1976年1月8日在北京去世。")],[["人民网 · 周恩来生平年表","https://cpc.people.com.cn/GB/143527/147173/10536441.html"]]);je("zhu",[z("从旧军队到革命者","1886—1927","朱德生于四川仪陇的农民家庭，早年做过教员，进入云南陆军讲武堂后开始军旅生涯，参加辛亥革命和护国战争。1922年赴欧洲学习并加入中国共产党，后来到苏联学习军事。回国后参加北伐，并参与领导南昌起义。"),z("红军与抗日战争","1927—1945","南昌起义后率部转战，1928年与陈毅等领导湘南起义，随后与毛泽东在井冈山会师。此后长期任红军总司令，参与根据地建设与长征。1937年红军改编后任八路军总指挥，后称总司令，组织敌后抗战和根据地军队建设。"),z("建国后的公共职务","1945—1976","解放战争时期任人民解放军总司令，参与全国军事战略部署。新中国成立后担任国家副主席、全国人大常委会委员长等职，1955年被授予元帅军衔。他长期关心国防、农业和工业建设，1976年7月6日在北京去世。")],[["人民网 · 朱德生平年表","https://cpc.people.com.cn/GB/143527/147175/10536603.html"]]);je("peng",[z("贫苦童年与参军","1898—1928","彭德怀生于湖南湘潭乌石乡的贫苦农民家庭，童年因家庭困境辍学，靠劳动谋生。1916年进入湘军，后来到湖南陆军讲武堂学习，逐步升任军官。1928年加入中国共产党，同年与滕代远等领导平江起义，转入红军。"),z("红军、抗战与军队领导","1928—1958","红军时期率部在湘鄂赣等地作战，参加长征。抗战中任八路军副总指挥，组织敌后作战，1940年指挥百团大战。解放战争时期主持西北战场作战。1950年出任中国人民志愿军司令员兼政治委员，后来任国防部长，1955年获元帅军衔。"),z("庐山会议后的遭遇","1959—1974","1959年庐山会议期间对“大跃进”中的问题提出意见，受到错误批判并被撤职。此后曾到西南参与建设工作，“文化大革命”中遭受迫害，晚年患病。1974年11月29日在北京去世，1978年获得平反，其军事贡献与直言批评的经历共同构成其生平。")],[["中国共产党新闻网 · 彭德怀生平","https://cpc.people.com.cn/GB/64162/126778/126780/7490066.html"]]);je("lin",[z("求学与红军经历","1907—1936","林彪生于湖北黄冈，青年时期进入黄埔军校，随后参加北伐和南昌起义。进入红军后逐渐升任主要军事指挥职务，参与中央苏区作战和长征，在红一军团形成了其军事声望。"),z("抗战与东北战场","1937—1949","抗战初期任八路军第一一五师师长，所部参加平型关战斗。负伤后赴苏联治疗。抗战结束后进入东北，参与领导东北人民解放军，指挥辽沈战役，此后率第四野战军南下，在国共内战后期发挥重要作用。"),z("政治地位与结局","1949—1971","新中国成立后担任国防等领导职务，1955年获元帅军衔。“文化大革命”中地位上升，1969年被写入党章作为毛泽东的接班人。1971年9月13日乘机外逃途中在蒙古坠机身亡。“九一三事件”的细节涉及不同材料，应区分已确认事实与仍有争论的解释。")],[Ra("林彪","Lin-Biao")]);je("li",[z("广西军旅与北伐","1891—1936","李宗仁生于广西临桂，受过新式军事教育，早年在广西军队任职。与白崇禧等形成新桂系军事政治力量，参与北伐，并在此后与蒋介石的合作和竞争中成为重要地方军政人物。"),z("抗战指挥与代总统","1937—1949","全面抗战后任第五战区司令长官，参与组织徐州会战，1938年台儿庄战役的胜利使其声望上升。1948年当选中华民国副总统，1949年蒋介石下野后担任代总统，主持国共和平谈判，未能扭转内战局势。"),z("旅美、回国与晚年","1949—1969","离开中国大陆后长期居住美国，与台湾当局的关系渐趋疏远。1965年返回北京，晚年就两岸和国际局势发表意见。1969年1月30日在北京去世。他的经历连接桂系军政、抗战指挥、南京政府末期和战后海外生活。")],[["人民网 · 李宗仁重要经历与晚年","https://dangshi.people.com.cn/n/2013/0531/c85037-21684271-4.html"]]);je("zhang",[z("早年与西北军","1891—1936","张自忠生于山东临清，青年时期接触革命思想并进入军队，后来长期在冯玉祥所部任职，从基层军官逐渐升任高级指挥官。1930年代在第二十九军担任师长等职，参与长城抗战。"),z("全面抗战中的作战","1937—1939","曾任天津市长，七七事变后在复杂局势中一度受到舆论质疑。此后回到前线，指挥第五十九军参加临沂、徐州和随枣等战役，并升任第三十三集团军总司令，持续在正面战场抗击日军。"),z("枣宜会战与牺牲","1940","1940年枣宜会战中亲率部队渡过襄河作战，部队陷入日军包围。5月16日在湖北宜城南瓜店附近战斗中牺牲。他是抗战期间在前线牺牲的高级将领，其遗骸后来安葬于重庆北碚。")],[["新华社 · 张自忠抗战生平","https://www.news.cn/20250826/8e5e654f67d240319eb74fd5de66b864/c.html"]]);je("dai",[z("从黄埔到抗日前线","1904—1938","戴安澜生于安徽无为，青年时期投身军队，毕业于黄埔军校第三期，参加北伐。此后历任基层与中高级指挥职务，参加长城抗战和全面抗战初期的作战，在台儿庄等战场积累经验。"),z("第二〇〇师与远征缅甸","1939—1942","出任第二〇〇师师长后，参加昆仑关战役。1942年随中国远征军进入缅甸，指挥同古保卫战，在补给和联合作战困难的条件下率部抵抗日军，随后奉命撤退。"),z("撤退中的负伤与殉国","1942","撤退途中遭遇日军，戴安澜负伤后仍随部队转移，伤势恶化。1942年5月26日在缅甸茅邦村去世。其遗骸辗转运回中国，国共双方均有悼念，体现了其作为抗日将领的历史地位。")],[["中央党史和文献研究院 · 戴安澜生平","https://www.dswxyjy.org.cn/n1/2019/0121/c244523-30580339.html"]]);je("sun",[z("中美求学与入伍","1900—1937","孙立人生于安徽庐江，少年考入清华，后赴美国学习工程，并进入弗吉尼亚军事学院接受军事教育。回国后投身军队，参与部队训练和指挥工作，其教育经历使他重视现代军事训练与装备。"),z("缅甸战场的指挥经历","1937—1945","参加淞沪抗战后，担任新编第三十八师师长。1942年随远征军入缅，所部在仁安羌作战中支援被围英军。退往印度后参与中国驻印军整训，后来指挥缅北反攻，是中国远征军的重要将领。"),z("台湾时期与晚年","1945—1990","战后在东北及台湾担任高级军职。1955年因所谓“孙立人案”被解除职务，此后长期受到软禁与监控，晚年生活与军政活动分离。1990年11月19日在台湾去世；该案的责任归属与具体过程应结合档案资料审慎理解。")],[["安徽省地矿局 · 孙立人故居生平介绍","https://dkj.ah.gov.cn/dqgz/qngz/39674088.html"]]);je("churchill",[z("家庭、从军与写作","1874—1900","丘吉尔生于英国布伦海姆宫，父亲是保守党政治家，母亲来自美国。他在桑赫斯特军校受训，先后以军人和战地记者身份在印度、苏丹及南非活动，通过战争报道和著述进入公众视野。写作后来一直是其政治之外的重要事业。"),z("议会政治与挫折","1900—1939","1900年当选议员，此后先后加入保守党和自由党，担任贸易、内政、海军和财政等职。第一次世界大战中推动达达尼尔海峡行动，失败后离开海军大臣职位。1930年代虽在政治上相对孤立，仍不断警告纳粹德国扩张的危险，反对绥靖政策。"),z("战时首相与同盟外交","1940—1945","1940年5月出任首相，组织联合政府，以演说和军政协调凝聚英国抵抗意志。积极争取美国援助，在德国入侵苏联后推动反法西斯同盟，参加主要同盟国会议。其战时领导作用突出，但殖民立场及若干战争决策也持续受到历史研究的批评。"),z("战后、著述与逝世","1945—1965","1945年大选失败后继续领导反对党，1946年发表“铁幕”演说。1951年再次任首相，1955年退休。其战争回忆录等著述使他于1953年获得诺贝尔文学奖。1965年1月24日在伦敦去世，获国葬，安葬于布拉登。")],[["剑桥大学丘吉尔档案中心 · 丘吉尔生平","https://archives.chu.cam.ac.uk/collections/churchill-papers/churchill-biography/"]]);je("roosevelt",[z("家庭、求学与从政","1882—1920","罗斯福生于纽约州海德帕克，先后在格罗顿和哈佛求学，又在哥伦比亚大学学习法律，取得律师资格后从事律师工作。1905年与埃莉诺结婚。1910年当选纽约州参议员，后来任海军部助理部长，1920年作为民主党副总统候选人参加选举。"),z("疾病、复出与新政","1921—1939","1921年患病导致下肢瘫痪，在康复治疗与家人支持下重返政坛，1928年当选纽约州州长。1933年在经济大萧条中就任总统，推进银行整顿、公共工程、金融监管和社会保障等新政措施。改革扩大了联邦政府的作用，也引发财政与宪政争论。"),z("战争领导与最后岁月","1939—1945","欧洲战争爆发后逐步扩大对同盟国的援助，1941年签署《租借法案》。珍珠港事件后领导美国参战，与丘吉尔、斯大林等协调战争战略，并参与筹建联合国。他是美国唯一四次当选的总统。1945年4月12日在佐治亚州温泉镇去世，安葬于海德帕克。")],[["罗斯福总统图书馆 · 罗斯福传记","https://www.fdrlibrary.org/fdr-biography"]]);je("hitler",[z("早年与第一次世界大战","1889—1918","希特勒生于奥匈帝国布劳瑙，青年时期在维也纳生活，报考艺术学校失败，后迁往慕尼黑。第一次世界大战中在德军服役。战败、激进民族主义和反犹观念成为其此后政治宣传的重要背景，不能据此把纳粹掌权理解为必然结果。"),z("纳粹运动与独裁建立","1919—1938","1919年进入德国工人党，后来成为纳粹党领袖。1923年政变失败后入狱，撰写《我的奋斗》。利用经济危机、政治动荡及保守精英支持扩大势力，1933年被任命为总理，随后摧毁民主制度、镇压反对者，建立个人独裁并逐步扩大对外侵略。"),z("侵略战争、大屠杀与覆亡","1939—1945","1939年入侵波兰，发动欧洲战争，1941年入侵苏联。其统治实施对犹太人的系统性迫害和种族灭绝，并迫害、杀害其他群体。纳粹战争及占领给欧洲造成巨大灾难。1945年4月30日在柏林地下掩体自杀，数日后纳粹德国投降。")],[["美国大屠杀纪念馆 · 希特勒生平","https://encyclopedia.ushmm.org/content/zh/article/adolf-hitler"],["美国大屠杀纪念馆 · 希特勒早年","https://encyclopedia.ushmm.org/content/zh/article/adolf-hitler-early-years-1889-1921"]]);je("stalin",[z("格鲁吉亚青年与革命活动","1878—1917","斯大林本名约瑟夫·朱加什维利，生于格鲁吉亚哥里，曾在第比利斯神学校学习，后来加入俄国社会民主主义运动，参与布尔什维克的组织与地下活动，多次被捕和流放。十月革命前后进入布尔什维克中央领导层。"),z("权力集中与社会改造","1917—1939","革命后担任民族事务等职，1922年出任党的总书记。列宁去世后，在党内权力斗争中逐渐确立统治地位。通过五年计划推动快速工业化，强制农业集体化造成严重社会损害与饥荒；大清洗、处决和劳改体系使政治镇压深入社会各层。"),z("战争、冷战与去世","1939—1953","1939年签订苏德互不侵犯条约，1941年德国入侵后领导苏联对德战争。参加德黑兰、雅尔塔、波茨坦等会议，苏联成为战后主要大国。战后继续强化个人统治，并与西方进入冷战。1953年3月5日去世，随后苏联对其个人崇拜和镇压政策展开批判。")],[Ra("斯大林","Joseph-Stalin")]);je("hirohito",[z("皇室教育与即位","1901—1926","裕仁生于东京，接受皇室和军事教育。1921年赴欧洲访问，同年因父亲大正天皇健康问题担任摄政。1926年继位，年号昭和。他的在位时期经历了日本军国主义扩张、战争失败和战后制度转型。"),z("战争时期的天皇","1926—1945","其在位期间，日本先后侵占中国东北、发动全面侵华战争并投入太平洋战争。作为帝国宪制中的最高统治者，他与政府、军方的关系及战争决策责任，是历史研究的重要问题，不能简单描绘为完全没有权力的旁观者。1945年8月通过广播宣布接受《波茨坦公告》。"),z("战后象征天皇与晚年","1945—1989","战后在盟军占领政策下保留皇位，未在东京审判中受审。1947年宪法实施后，天皇成为日本国家与国民统一的象征，政治权力受到宪法限制。他继续从事皇室公务和海洋生物研究，1989年1月7日在东京去世。")],[Ra("裕仁","Hirohito")]);je("chamberlain",[z("商业与地方政治","1869—1937","张伯伦生于英国伯明翰的政治家庭，早年从事商业，后来进入地方公共事务，担任伯明翰市长。进入议会后任卫生大臣和财政大臣等职，重视住房、财政与社会政策，1937年接替鲍德温成为首相。"),z("绥靖政策与战争爆发","1937—1939","面对德国扩张，张伯伦试图通过谈判与妥协避免战争，1938年签署《慕尼黑协定》，允许德国吞并捷克斯洛伐克的苏台德地区。德国继续侵略后，其政策失去基础；1939年德国入侵波兰，英国在其任内对德宣战。"),z("辞职与生命末期","1940","挪威战役失败引发议会对政府的批评，张伯伦于1940年5月辞去首相职务，由丘吉尔接任，之后短期留在联合政府。因病退出公共事务，同年11月9日去世。他的政治评价需要同时考察国内改革和对外政策的失败。")],[["英国政府 · 张伯伦生平","https://www.gov.uk/government/history/past-prime-ministers/neville-chamberlain"]]);je("george",[z("王子与海军经历","1895—1936","乔治六世本名阿尔伯特，生于桑德林厄姆，是乔治五世的次子，青年时期接受海军教育并服役。1923年与伊丽莎白·鲍斯-莱昂结婚。他长期面对口吃问题，通过训练改善公开讲话能力，早年并未被视为主要王位继承人。"),z("意外继位与战争","1936—1945","1936年兄长爱德华八世退位后继承王位，1937年加冕。第二次世界大战期间与王后留在英国，访问军队和遭轰炸地区，通过广播及公务活动维持王室的公众角色，并与丘吉尔的战时政府合作。"),z("战后转型与逝世","1945—1952","战后英国帝国逐步转型，印度和巴基斯坦独立，王室与英联邦关系随之改变。乔治六世的健康逐渐恶化，1952年2月6日在桑德林厄姆去世，由女儿伊丽莎白二世继位。")],[Ra("乔治六世","George-VI")]);je("wang",[z("反清革命与国民党政治","1883—1932","汪精卫生于广东三水，原名汪兆铭，早年加入同盟会，因参与谋刺清朝摄政王而入狱，辛亥革命后获释。此后在国民党内担任重要职务，曾主持武汉国民政府，与蒋介石长期存在权力竞争。"),z("从国民政府到对日合作","1932—1940","1930年代在南京政府担任行政院长等职。全面抗战后主张对日妥协，1938年底离开重庆，经河内转向与日本合作。1940年在南京建立日本扶植的政权，严重损害中国的抗战事业。"),z("南京政权与去世","1940—1944","汪精卫政权依赖日本占领力量，名义上的行政和军事权力受到日本控制，其政治活动与侵略占领密切相连。晚年健康恶化，赴日本治疗，1944年11月10日在名古屋去世。他的早年革命经历不能抹去其后与侵略者合作的责任。")],[Ra("汪精卫","Wang-Ching-wei")]);je("xian",[z("贫困童年与音乐求学","1905—1935","冼星海生于澳门的船工家庭，少年随母亲在南洋生活，后来回国学习音乐，先后在广州、北京和上海求学。1929年赴法国勤工俭学，在艰难生活中继续学习作曲和演奏，1935年回国。"),z("救亡音乐与延安创作","1935—1940","回国后投入抗日救亡音乐活动，创作适合群众演唱的歌曲。1938年到延安，在鲁迅艺术学院从事教学与创作。1939年为光未然的组诗谱写《黄河大合唱》，以多种合唱形式表现民族危机与抗争，成为其最有影响的作品。"),z("旅苏岁月与病逝","1940—1945","1940年赴苏联工作，苏德战争爆发后因交通和战争局势难以回国，辗转在中亚生活，继续创作管弦乐和声乐作品。贫病交加之中仍坚持音乐工作，1945年10月30日在莫斯科去世。")],[["人民网 · 冼星海生平","https://politics.people.com.cn/n1/2021/0524/c1001-32111031.html"]]);je("yet",[z("军事教育与北伐","1896—1927","叶挺生于广东惠阳，接受军事教育，曾赴苏联学习。回国后任国民革命军第四军独立团团长，在北伐中率部作战，独立团以纪律与战斗力著称。1927年参与南昌起义和广州起义。"),z("海外生活与新四军","1928—1941","广州起义失败后曾旅居海外，之后回国。全面抗战时期出任新四军军长，参与组建部队及华中抗战。1941年皖南事变后被国民党扣押，长期失去自由，在拘押期间写下《囚歌》等作品。"),z("获释与空难","1946","1946年在政治协商和交涉中获释，随后重新加入中国共产党。同年4月8日由重庆飞往延安的飞机失事，他与家属及王若飞、博古等一同遇难。其生命贯穿北伐、革命起义、抗战和长期囚禁。")],[["人民网 · 中国共产党人物资料","https://cpc.people.com.cn/GB/64162/126778/index.html"]]);je("degaulle",[z("职业军人与军事思考","1890—1939","戴高乐生于法国里尔，毕业于圣西尔军校。第一次世界大战中负伤被俘，战后继续在军队任职，撰写军事著作，主张发展机械化部队。他的战略主张在战前法国并未获得充分采纳。"),z("自由法国与解放","1940—1946","1940年法国战败后赴伦敦，通过广播号召继续抵抗，领导自由法国运动。此后与盟国协商法国的政治和军事地位，参与建立法国民族解放委员会。法国解放后主持临时政府，1946年因对政治制度的分歧辞职。"),z("第五共和国与晚年","1958—1970","1958年阿尔及利亚危机中重返政坛，推动建立第五共和国并任总统。任内结束阿尔及利亚战争，强调法国外交自主。1969年公投失败后辞职，退居科隆贝，1970年11月9日去世。")],[Ra("戴高乐","Charles-de-Gaulle")]);je("truman",[z("农场、战争与地方政治","1884—1934","杜鲁门生于美国密苏里州，早年从事农场和其他工作，第一次世界大战期间任炮兵军官。战后经营商业，随后进入地方政治，在杰克逊县担任公共职务，1934年当选联邦参议员。"),z("总统任期与战争结束","1934—1948","在参议院主持调查战时军工开支的委员会，1944年当选副总统。1945年4月罗斯福去世后继任总统，参加波茨坦会议，任内批准对日本使用原子弹，战争随后结束。原子弹决策的军事理由和人道后果一直是重要历史议题。"),z("冷战政策与退休","1948—1972","1948年竞选连任成功，推行遏制苏联的政策，支持马歇尔计划和北约建立，并在朝鲜战争中领导美国政府。1953年离任后回到密苏里州，撰写回忆录并参与总统图书馆建设，1972年12月26日去世。")],[["弗吉尼亚大学米勒中心 · 杜鲁门生平","https://millercenter.org/president/truman"]]);je("chenyi",[z("留法与革命活动","1901—1928","陈毅生于四川乐至，青年时期赴法国勤工俭学，回国后加入中国共产党。1927年参加南昌起义，后与朱德率部转战，1928年参与湘南起义和井冈山会师，逐渐成为红军的重要军政干部。"),z("游击战争与华东指挥","1928—1949","中央红军长征后留在南方开展游击战争。全面抗战时期参与组建和领导新四军，皖南事变后任代理军长。解放战争中领导华东部队，与粟裕等共同组织华东战场作战，参与淮海战役等重要军事行动。"),z("上海建设、外交与逝世","1949—1972","新中国成立后任上海市长，后来任国务院副总理、外交部长，1955年获元帅军衔。他长期参与外交活动，也以诗歌和鲜明的个人风格为人所知。“文化大革命”中受到冲击，1972年1月6日在北京去世。")],[["人民网 · 中国共产党人物资料","https://cpc.people.com.cn/GB/64162/126778/index.html"]]);je("liushaoqi",[z("青年求学与工人运动","1898—1930","刘少奇生于湖南宁乡，青年时期赴苏联学习并加入中国共产党。回国后主要从事工人运动，在安源、上海、武汉等地开展组织工作，逐渐进入党的中央领导层。"),z("抗战组织与中央工作","1930—1949","长期负责白区党组织和群众工作，抗战中参与领导华北、华中根据地建设。皖南事变后任新四军政治委员，在延安担任中央领导职务，著有《论共产党员的修养》等文章。内战后期参与土地改革和中央政策制定。"),z("国家主席与受难","1949—1969","新中国成立后先后任全国人大常委会委员长、国家主席，参与国家制度和经济政策工作。“文化大革命”中受到严重迫害，被撤销党内外职务。1969年11月12日在开封去世，1980年获得平反，恢复名誉。")],[["中国政府网 · 刘少奇生平与历史评价","https://www.gov.cn/xinwen/2018-11/23/content_5342860.htm"]]);je("guangweiran",[z("早年求学与文学活动","1913—1937","光未然原名张光年，生于湖北光化，青年时期参加革命活动，在学徒、店员和求学生活中坚持阅读写作。1930年代从事戏剧与诗歌创作，创作《五月的鲜花》等救亡作品。"),z("《黄河大合唱》的诞生","1938—1949","抗战中随抗敌演剧队活动，黄河沿岸的行军经历成为创作的重要素材。1939年在延安写成《黄河大合唱》组诗，经冼星海谱曲后广泛传播。此后继续从事文艺宣传、写作和文学组织工作。"),z("编辑、评论与晚年","1949—2002","新中国成立后曾任《剧本》《文艺报》《人民文学》等刊物主编及中国作协领导职务，长期从事文学评论和编辑工作。晚年继续关注青年创作与古典文学研究，2002年1月28日去世。")],[["中国作家网 · 光未然生平","https://www.chinawriter.com.cn/xdzj/297.shtml"],["央视网 · 光未然生卒与作品","https://tv.cctv.com/cctv3/special/gechangzuoguo01/gechangzuguohuanghedahechang/index.shtml"]]);je("heyinqin",[z("军事教育与黄埔经历","1890—1926","何应钦生于贵州兴义，早年在国内和日本接受军事教育，辛亥革命期间回国参与军队活动。后来在贵州任职，1924年进入黄埔军校担任军事教官等职，与蒋介石建立密切的军政关系。"),z("军政领导与抗战受降","1926—1945","北伐后升任高级军职，1930年开始长期任军政部长，负责国民政府军队行政事务。其对日交涉及抗战前后的政策存在重要争议。1945年9月9日在南京代表中国战区接受日军投降，是其军政生涯的重要时刻。"),z("战后与台湾生活","1945—1987","战后曾任国防部长和行政院长，1949年后赴台湾，主要从事顾问、纪念和社会团体活动，逐渐退出实际军政决策。1987年10月21日在台北去世。")],[["黄埔军校同学会 · 何应钦生平","https://www.huangpu.org.cn/hpjs/201209/t20120923_3116195.html"]]);je("xuyongchang",[z("贫困童年与军旅起步","1887—1936","徐永昌生于山西崞县，幼年家庭贫困，只接受过有限的私塾教育，后来投身军队，通过从军与军事学习逐步升任指挥官。曾在国民军、晋绥军系统任职，担任山西省政府主席等职。"),z("军令工作与日本受降","1937—1945","抗战时期长期主持国民政府军令部事务，参与战略协调和作战行政。1945年以中国代表身份赴东京湾，在9月2日“密苏里”号投降仪式上签署受降文件，见证日本正式投降。"),z("军事教育与晚年","1945—1959","战后从事军队和军事教育工作，曾任陆军大学校长。1949年后居住台湾，1953年退役，1959年7月12日去世。其日记与回忆资料为研究民国军政史提供了重要材料。")],[["人民网 · 徐永昌生平与受降经历","https://dangshi.people.com.cn/n/2015/0723/c85037-27349149.html"]]);je("okamura",[z("日本陆军职业生涯","1884—1937","冈村宁次生于东京，毕业于日本陆军士官学校和陆军大学，参加日俄战争，后来从事参谋、驻华联络和军队指挥工作。其职业经历与日本在中国的军事扩张和情报活动密切相关。"),z("侵华战争中的指挥责任","1937—1945","全面侵华战争中担任第十一军、华北方面军及中国派遣军等高级指挥职务，组织进攻、占领和对抗日根据地的残酷“扫荡”，对占领区的重大暴行负有指挥责任。1945年9月在南京代表中国战区日军签署投降书。"),z("战后审判与晚年","1945—1966","战后在中国接受审判，1949年获国民党军事法庭无罪判决，判决及其背后的政治因素一直存在争议。回到日本后继续参与军事相关顾问活动，1966年9月2日在东京去世。")],[["中国新闻网 · 冈村宁次生平","https://www.chinanews.com.cn/cul/news/2009/03-27/1620800.shtml"]]);je("abe",[z("从军与晋升","1886—1937","阿部规秀生于日本青森县，1907年毕业于日本陆军士官学校，历任步兵、师团参谋和军校职务，1930年代升任联队长和旅团级指挥官。现有可靠材料主要集中于其军事履历。"),z("侵华与华北作战","1937—1939","其部队参加日本侵华战争，阿部规秀后来担任独立混成第二旅团旅团长，1939年晋升中将。率部在华北山区进攻晋察冀抗日根据地，参与日军的军事“扫荡”。"),z("黄土岭战斗中的死亡","1939","1939年11月在河北涞源黄土岭地区的战斗中，日军部队陷入八路军伏击。阿部规秀于11月7日被炮火击中后死亡。关于其所谓“名将之花”“山地战专家”的宣传性称呼，不能代替对实际履历的判断。")],[["国防部 · 阿部规秀履历与黄土岭战斗","https://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4854495_3.html"]]);je("hand",[z("军校与国民革命军","早年—1936","韩德勤是江苏泗阳人，毕业于保定军官学校，参加北伐，此后担任参谋、旅长、师长等军职，并在江苏军政系统任职。其生年存在1891年与1892年的不同记载，不能仅凭一种资料补定具体生日。"),z("江苏抗战与国共冲突","1937—1945","抗战时期在江苏掌握国民党军事力量，并担任江苏省政府主席等职。与新四军在苏北的活动发生冲突，1940年黄桥战役中所部失败，1943年在山子头战斗中被新四军俘获，后来获释。"),z("战后去向与逝世","1945—1988","1949年后赴台湾，担任顾问及国民大会相关职务，后来退役。1988年在台北去世。其生平既包含对日作战背景，也包含国共军事摩擦，不宜只用一种角色概括。")],[["大众网 · 韩德勤生平资料","https://www.dzwww.com/jiuwenhua2019/news/news/201509/t20150908_13029953.htm"]]);je("picasso",[z("西班牙童年与巴黎求索","1881—1906","毕加索生于西班牙马拉加，父亲从事绘画与教学，他从少年时期接受美术训练，后来在巴塞罗那、马德里及巴黎学习和创作。早期蓝色时期、玫瑰时期作品表现贫困、孤独以及马戏团人物等题材。"),z("立体主义与艺术实验","1907—1936","1907年创作《亚维农的少女》，随后与乔治·布拉克共同发展立体主义，通过分解和重组形体改变绘画对空间的表现。其艺术不断跨越绘画、雕塑、版画、拼贴和舞台设计，风格并不局限于一个时期。"),z("《格尔尼卡》与晚年创作","1937—1973","1937年为西班牙共和国展馆创作《格尔尼卡》，回应战争中对平民的轰炸。此后长期居住法国，继续进行绘画、雕塑和陶艺实验，也参与政治与和平活动。1973年4月8日在法国穆然去世，留下规模庞大、持续影响现代艺术的作品。")],[Ra("毕加索","Pablo-Picasso")]);je("franco",[z("职业军人与殖民战争","1892—1935","佛朗哥生于西班牙费罗尔，接受军事教育，长期在西班牙驻摩洛哥军队服役，凭借殖民战争中的指挥经历迅速晋升。第二共和国时期担任高级军职，其政治立场逐渐与保守、反共和力量结合。"),z("西班牙内战与独裁建立","1936—1939","1936年参与反对共和国政府的军事叛乱，在内战中逐渐成为国民军最高领导人，获得纳粹德国和法西斯意大利支持。1939年获胜后建立独裁统治，镇压政治反对者，战争及战后清算造成深重社会创伤。"),z("长期统治与逝世","1939—1975","第二次世界大战期间维持与轴心国接近但避免全面参战的政策，战后经历国际孤立，后来在冷战背景下改善与美国等国关系。其统治延续至1975年11月20日去世，随后西班牙开始向议会民主转型。")],[Ra("佛朗哥","Francisco-Franco")]);je("baldwin",[z("实业家庭与议会道路","1867—1923","鲍德温生于英国伍斯特郡的工业家庭，先从事家族企业，后进入议会。在第一次世界大战及战后任财政等职，1923年首次出任首相，成为两次世界大战之间保守党的主要领导人。"),z("多次执政与国内事务","1923—1936","先后在1923年至1924年、1924年至1929年和1935年至1937年担任首相，中间也在联合政府任职。其任内处理1926年总罢工、经济与社会问题，并推动广播等公共制度的发展。政治风格强调稳定和议会秩序。"),z("王位危机、退休与晚年","1936—1947","1936年在爱德华八世退位危机中维护内阁和议会立场，乔治六世继位后于1937年退休，由张伯伦接任。其对德国威胁和英国军备准备的判断后来受到争议。1947年12月14日去世。")],[["英国政府 · 鲍德温生平","https://www.gov.uk/government/history/past-prime-ministers/stanley-baldwin"]]);je("blum",[z("文学、法律与社会主义","1872—1935","布鲁姆生于巴黎，早年从事法律和文学批评，在德雷福斯事件中参与公共讨论并进入社会主义政治。1919年进入议会，1920年图尔大会后坚持保留法国社会主义政党的独立组织，成为法国社会主义者的重要领导人。"),z("人民阵线政府与改革","1936—1938","1936年领导人民阵线政府，推动马提尼翁协议、每周四十小时工作制、带薪休假和部分国有化改革。经济金融困难、联盟分歧及对西班牙内战的不干预政策削弱政府，1937年辞职，1938年又曾短期组阁。"),z("迫害、战后活动与去世","1940—1950","1940年反对授予贝当全权，后被维希政权审判并被交给德国，遭到拘押和驱逐。战争结束后重新参与法国政治，1946年至1947年短期主持临时政府，1950年3月30日去世。")],[["戴高乐基金会 · 布鲁姆生平","https://www.charles-de-gaulle.org/lhomme/biographies/leon-blum/"]]);je("daladier",[z("教师、军人与议员","1884—1932","达拉第生于法国卡庞特拉，早年从事教学，第一次世界大战期间服役，战后进入议会，成为激进党重要政治人物。长期参与国防与政府事务，多次出任部长和总理。"),z("慕尼黑与战争时期","1933—1940","1930年代多次组阁，1938年再次出任总理并代表法国签署《慕尼黑协定》。德国继续侵略后转向遏制政策，1939年领导法国对德国宣战。1940年法国军事危机中失去政府领导职务。"),z("拘押与战后政治","1940—1970","法国战败后被维希政权拘押，遭里翁审判，后来被德国关押。战后回到法国，重新参与议会和地方政治。1970年10月10日在巴黎去世，其生涯与法国两次世界大战之间的政党困境密切相关。")],[Ra("达拉第","Edouard-Daladier")]);je("attlee",[z("法律与东伦敦社会工作","1883—1935","艾德礼生于伦敦，毕业于牛津，受过法律训练。参与东伦敦贫困社区的慈善与青年工作后转向社会主义，1908年加入独立工党。第一次世界大战中服役，战后任地方市长和议员，1935年成为工党领袖。"),z("战时联合政府与首相","1939—1951","战争期间参加丘吉尔联合政府，1942年起任副首相。1945年率工党赢得大选，出任首相，推动国民保健制度、社会保险和煤炭、铁路等行业国有化，在战后财政困难和物资短缺中实施福利制度建设。"),z("外交转型与退休","1945—1967","其政府见证印度、巴基斯坦等地独立，也参与马歇尔援助、柏林空运、联合国和北约等事务。1951年大选失利后继续领导工党至1955年，1967年10月8日在伦敦去世。")],[["英国政府 · 艾德礼生平","https://www.gov.uk/government/history/past-prime-ministers/clement-attlee"]]);je("zhangxueliang",[z("东北家庭与军旅成长","1901—1928","张学良生于奉天，父亲张作霖是奉系军事政治领袖。1919年进入东三省陆军讲武堂，毕业后在奉军担任指挥职务。1928年张作霖在皇姑屯事件中被日军炸死，张学良接掌东北军政，同年12月宣布东北易帜，接受南京国民政府的统一名义。"),z("九一八与西安事变","1931—1936","九一八事变后，东北军失去东北根据地，撤入关内。此后张学良参与国民政府对共产党的军事行动，但逐渐转向停止内战、共同抗日。1936年与周恩来会谈，同年12月12日与杨虎城发动西安事变，扣留蒋介石，推动抗日政策转变；和平解决后陪送蒋离开西安。"),z("长期拘禁与晚年","1936—2001","陪蒋回南京后即失去自由，随后辗转被拘禁，1946年转至台湾，长期远离军政生活。1964年与赵一荻结婚，1991年获准赴美探亲，后来定居夏威夷。2001年10月14日按夏威夷当地日历去世，部分中国报道使用10月15日。")]);je("yanghucheng",[z("陕西民军与地方军政","1893—1930","杨虎城生于陕西蒲城，早年投身地方武装，辛亥革命时参加陕西民军。后来与陕西军政变动相伴，1924年加入国民党，参加北伐。1930年任第十七路军总指挥和陕西省政府主席，成为陕西的重要军政人物。"),z("抗日主张与西安事变","1930—1937","在西北军政活动中逐渐主张停止内战、联合抗日，与东北军及中共方面建立联系。1936年12月12日与张学良共同发动西安事变，迫使蒋介石就抗日与国共关系作出调整。事变和平解决后被解除主要军政职务，1937年出国考察。"),z("回国、拘禁与被害","1937—1949","全面抗战后回国，希望参加抗日，但随即被拘禁，长期辗转于各地。1949年9月6日在重庆被国民党特务杀害，家属和身边工作人员亦遭杀害。其晚年没有获得参与抗战的自由，生平的重要结局是长期囚禁与遇害。")]);je("zhangwentian",[z("文学青年与海外学习","1900—1931","张闻天生于上海南汇，早年从事文学和新文化活动，曾赴日本、美国学习，后来加入中国共产党。1925年赴苏联学习，回国后进入党中央宣传与领导机构，以洛甫等笔名开展理论和政治工作。"),z("中央领导与调查工作","1931—1949","参加中央苏区工作和长征，1935年遵义会议后在中央负总责，参与重大路线调整与军政协调。此后从事理论、干部教育和地方调查，抗战结束后到东北工作，其经历包含中央领导与地方实践两个方面。"),z("外交生涯与晚年","1951—1976","1951年出任驻苏联大使，后来任外交部副部长，参与新中国外交事务。1959年庐山会议上因支持对政策问题的批评而受到错误批判，离开外交领导岗位。“文化大革命”中受迫害，1976年7月1日去世，后来获得平反。")]);je("bogu",[z("秦邦宪的青年时代","1907—1930","博古原名秦邦宪，生于江苏无锡，青年时期参加学生运动并加入中国共产党。1926年赴苏联学习，1930年回国后进入党的领导机关，逐渐担任重要中央职务。"),z("中央领导与遵义会议","1931—1936","1931年进入临时中央政治局领导层，后来到中央苏区，参加红军长征。第五次反“围剿”失败和长征初期的重大损失促使中央领导调整，1935年遵义会议后他不再在中央负总责，转而承担其他党务及军政工作。"),z("新闻工作与遇难","1936—1946","此后参与统一战线与西安事变相关工作，后来从事党报和通讯社建设，参与《解放日报》及新华社的领导工作。1946年4月8日从重庆飞往延安途中因飞机失事遇难，同机者包括叶挺、王若飞等人。")]);je("renbishi",[z("青年组织与苏联学习","1904—1930","任弼时生于湖南，青年时期参加社会主义青年团，赴苏联学习，1922年加入中国共产党。回国后长期负责青年和组织工作，逐步进入党的中央领导层。"),z("根据地、长征与军队工作","1931—1939","1931年进入中央苏区，后来在湘赣地区领导党和军队工作，参与红六军团西征及红二方面军长征。抗战初期从事八路军政治和组织工作，后赴苏联承担对外联络任务。"),z("中央事务与逝世","1940—1950","1940年回到延安后参加中央书记处工作，兼任中央秘书长，负责组织、干部和中央日常事务。内战时期转战陕北，参与土地政策等重要工作。长期繁重工作使其健康恶化，1950年10月27日在北京去世。")]);je("yejianying",[z("军事教育与革命转向","1897—1934","叶剑英生于广东梅县，1917年进入云南讲武学校，后来参与黄埔军校创建和北伐。1927年加入中国共产党并参与广州起义，随后从事军队和参谋工作，曾赴苏联学习，回国后进入红军。"),z("长征、抗战与军事教育","1934—1949","参加长征，在红军领导机关从事参谋工作。抗战中任八路军参谋长，在统一战线和军队联络方面承担任务。此后参与军事调处及军事教育，担任华北军政大学校长等职。"),z("国防领导与晚年","1949—1986","新中国成立后参与华南治理和军队建设，1955年获元帅军衔，后来任国防部长、全国人大常委会委员长。1976年参与粉碎“四人帮”的行动，晚年关注国家建设和统一问题，1986年10月22日在北京去世。")]);je("wangyizhe",[z("东北军职业经历","早年—1931","王以哲是东北军高级将领，早年接受军事训练，在奉系军队中逐渐升任指挥职务。1928年后担任师级领导，九一八事变时所部驻于沈阳地区，其经历与东北军失去东北的过程密切相关。"),z("西安时期的军政协调","1931—1937","撤入关内后继续在东北军任职，后来随军到西北。西安事变前后参与军事和政治协调，事变和平解决后倾向于通过谈判处理东北军、十七路军与南京政府之间的危局，与部分青年军官的激进主张产生分歧。"),z("二二事件与生年分歧","1937","1937年2月2日在西安被部分东北军青年军官杀害，此事加剧了东北军内部矛盾。其生年有1895年、1896年等记载，未据此补定具体生日。理解其生平需要结合东北军的组织关系与事变善后的政治环境。")]);je("guzhutong",[z("军事教育与黄埔体系","1893—1936","顾祝同生于江苏涟水，接受军事教育后进入军队，1924年在黄埔军校任职，参与东征与北伐，逐渐成为蒋介石所倚重的高级将领。其军旅生涯与黄埔系军政体系密切相关。"),z("第三战区与战争责任","1937—1945","全面抗战期间担任第三战区司令长官，指挥华东地区国民党部队。其任内既有对日作战，也有与新四军之间的军事冲突，1941年皖南事变是评价其战时角色时必须面对的重要事件。"),z("战后军职与台湾晚年","1946—1987","战后任陆军总司令、参谋总长等高级职务，参与国共内战时期的军队部署。1949年后赴台湾，继续担任军政顾问等职，晚年逐渐退出实际军事指挥。1987年1月17日在台湾去世。")]);je("yuxuezhong",[z("北洋与东北军经历","早年—1936","于学忠是山东籍军事人物，军校毕业后在北洋军中任职，1927年加入奉系军事力量，后来成为东北军高级将领。其成长经历跨越北洋军、奉军及南京政府时期的军队整合。"),z("西安事变与山东抗战","1936—1943","西安事变时期参与西安方面的军政活动和善后调停。全面抗战后率部对日作战，后来在山东担任重要军职，其部队面对日军进攻、地方武装竞争和国共关系等多重压力。"),z("后期生活与资料分歧","1943—1964","离开山东军事指挥岗位后逐渐淡出主要战场，1949年后在大陆生活，1964年去世。所引人物资料采用1890年生，但其他记载存在差异，生卒日期保留到可确认的年份，不补写未经核实的具体日月。")]);je("sunweiru",[z("陕西教育与地方军旅","1896—1936","孙蔚如生于陕西，1915年毕业于陕西陆军测量学校，后来进入陕西军队，与杨虎城长期共事。1926年协助守卫西安，随后在地方军政事务中承担重要职务，参与陕西政治和军事建设。"),z("抗日战争与武汉受降","1937—1945","西安事变后在陕西军政善后中发挥作用。1938年率部进入抗日前线，担任第四集团军总司令，后来任第六战区司令长官。1945年9月18日在武汉主持第六战区受降，成为其战争生涯的重要节点。"),z("战后公共活动与晚年","1945—1979","战后逐渐转向政治和社会事务，新中国成立后参与陕西地方公共工作及政协活动，持续关注抗战史与地方建设。1979年7月27日去世。其一生兼有陕西地方军政、抗日指挥和后期公共活动。")]);je("lizhigang",[z("身份与资料范围","早年未详","李志刚是杨虎城在南京的代表。能够归属此人的史料主要来自西安事变善后谈判的回忆，尚不足以确立完整的籍贯、求学和早年职业经历；其姓名与其他同名者也需要严格区分。"),z("西安事变善后的联络","1936—1937","西安事变发生时在西安，随后以杨虎城方面代表身份在南京和西安之间进行政治联络，参与就军队处置、政治关系和事变善后问题的交涉。这些经历显示其主要角色是代表、传递意见和参与谈判，而不能直接等同于军队指挥者。"),z("后续经历与生卒缺口","后期未详","现有材料未能可靠确认其后期去向及生卒日期，因此这里不补写婚姻、任职、晚年生活或去世地点。待获得能够明确归属此人的人物传记、地方档案或其他直接材料后，才能继续补充。")]);je("dongyingbin",[z("东北军高级军官","1894—1934","董英斌是东北军军事人物，生于1894年，其职业经历主要见于东北军的军职与部队资料。作为张学良系统中的高级军官，他的活动与东北军撤入关内及其后的重新部署密切相关；早年家庭和求学细节在现有资料中较少。"),z("军衔与西安时期","1935—1937","1935年获授陆军少将，1936年获授陆军中将。西安事变前后参与东北军内部会议及军事协调，在事变善后的和战讨论中表达意见。其经历应结合军内不同派别与南京政府的关系理解。"),z("后续生涯","1937—1960","此后继续处于国民党军队体系中，经历抗战和战后军政变化，1960年去世。现有资料不足以展开每一阶段的具体行动，这里保留已能确认的身份、军职与生卒年份，不补写缺乏依据的私人生活。")]);je("liweihan",[z("新民学会与留法经历","1896—1924","李维汉生于湖南，参与组织新民学会，1919年赴法国勤工俭学，1922年加入中国共产党。回国后从事党务、教育和组织工作，曾以罗迈之名开展革命活动。"),z("组织、教育与统一战线","1924—1949","在党的地方与中央机构负责组织工作，参加长征，抗战时期从事干部教育和统一战线事务。1948年开始主持中央统一战线工作，参与新政协筹备和不同政治力量之间的协商。"),z("政协工作与晚年","1949—1984","新中国成立后任中央统战部部长、全国政协秘书长及副主席等职，长期处理统一战线、民族和工商界相关工作。晚年参与历史经验总结，1982年任中央顾问委员会副主任，1984年8月11日去世。")]);je("xizhongxun",[z("青年时期与陕甘边革命","1913—1935","习仲勋生于陕西富平，少年参加青年团活动，1928年加入中国共产党。在陕西和甘肃从事群众与武装工作，与刘志丹等参与创建陕甘边根据地，1934年当选陕甘边区苏维埃政府主席。"),z("西北治理与中央工作","1935—1962","抗战和内战时期长期在西北从事地方领导与统一战线工作。新中国成立后参与西北地区治理，后来到中央任宣传部长、国务院秘书长及副总理等职，承担行政协调和政策工作。"),z("政治挫折、广东改革与晚年","1962—2002","1960年代受到错误批判，“文化大革命”中遭迫害。恢复工作后于1978年起在广东担任领导职务，支持改革开放和经济特区探索，后来任全国人大常委会副委员长。2002年5月24日在北京去世。")]);je("panhannian",[z("文化工作与地下组织","1906—1934","潘汉年生于江苏宜兴，早年从事文学、报刊和出版活动，1925年加入中国共产党。后来转入地下工作与政治联络，1933年参与同十九路军的谈判，1934年参加长征。"),z("统一战线与情报工作","1935—1949","1930年代在国共接触和西安事变前后承担联络任务，抗战中长期在复杂的城市环境中从事统一战线与情报工作。战后继续参与政治联络，1949年前后参与资源委员会及两航起义等相关工作。"),z("上海任职与晚年遭遇","1949—1977","新中国成立后在上海担任领导职务，1955年被捕，此后长期被关押和审查。1977年去世，1982年获得平反。其隐蔽工作涉及多方关系，具体行动应以能够核实的档案和研究为依据。")]);je("songziwen",[z("求学与金融工作","1894—1936","宋子文生于上海，赴美国接受大学教育，1915年完成哈佛大学阶段学习。回国后从事金融工作，1920年代进入广东革命政府及国民政府的财政体系，长期主持财政、金融和经济事务。"),z("西安调停与同盟国外交","1936—1945","西安事变中赴西安参与调停。抗战期间承担筹措援助和对外联络，1942年任外交部长，1945年参加旧金山会议并参与对苏谈判。其生涯兼有金融专业背景和高层政治、外交活动。"),z("战后与旅美晚年","1945—1971","战后曾任行政院长及广东省政府主席，1949年离开中国大陆，后来长期居住美国。1971年4月去世。所引人物辞典对去世日有4月24日和26日等不同记载，因此不在这里任意确定某一天。")]);je("songqingling",[z("留美求学与孙中山","1893—1925","宋庆龄生于上海，青年时期在美国求学，回国后参与孙中山的革命工作，1915年与孙中山结婚。她的早期政治经历与民主革命、国民党改组及孙中山的革命主张相联系。"),z("政治立场与救亡公益","1925—1949","孙中山去世后坚持其革命主张，对国民党清共和政治镇压提出批评。1930年代从事民权保障、抗日救亡及国际援助工作，抗战时期关注医疗救济和儿童福利，联系海内外援助力量。"),z("国家职务与儿童福利","1949—1981","参与新中国筹建，后来担任国家副主席及全国人大常委会副委员长等职，并长期领导儿童福利和国际友好活动。1981年5月获中华人民共和国名誉主席称号，同月29日在北京去世。")]);je("baichongxi",[z("广西军事教育与北伐","1893—1936","白崇禧生于广西临桂，接受军事教育后进入广西军队，与李宗仁等共同建立新桂系军事政治力量。北伐中担任重要参谋和指挥职务，此后在中央与广西地方势力之间的竞争中保持影响。"),z("抗战中的军事工作","1937—1945","全面抗战后参与国民政府军事战略和指挥工作，协助组织作战，关注游击战与持久抗战。桂系部队在多个战场活动，其与李宗仁的合作构成其军政生涯的重要部分。"),z("国防部长与晚年","1946—1966","1946年任国防部长，后来在国共内战中指挥华中等地部队。1949年后赴台湾，实际军事权力逐渐消失，与蒋介石的关系也受到桂系历史矛盾影响。1966年12月2日在台北去世。")]);je("liuxiang",[z("四川军政中的成长","1888—1921","刘湘生于四川，受过新式军事教育，进入川军后逐步升任将领。辛亥革命后四川长期处于地方军事力量竞争之中，刘湘在这一环境下扩大军政影响，1921年担任川军总司令、四川省省长。"),z("地方统治与建设","1921—1936","在四川军阀竞争中逐渐取得优势，推动省内政治整合，并参与重庆的市政、教育和文化设施建设。其地方治理同时具有建设活动与军阀政治的双重面向，需要放在四川当时的社会条件下考察。"),z("抗战动员与病逝","1937—1938","全面抗战爆发后支持川军出川作战，担任第二十三集团军总司令，参与抗战军政事务。其健康随后恶化，1938年在汉口病逝，未能完成整个抗战时期的军事活动。")]);je("yanxishan",[z("留日与辛亥革命","1883—1911","阎锡山生于山西五台，青年时期赴日本学习军事并加入同盟会。1911年参与太原起义，清朝在山西的统治被推翻后任山西都督，从此长期控制山西军政。"),z("地方建设与战争","1912—1948","在山西推进兵工、教育和地方行政建设，也维持个人主导的地方军政体系。曾与蒋介石合作并参与反蒋战争。抗战时期任第二战区司令长官，在日军压力、国共关系和地方利益之间采取复杂政策。"),z("离开山西与台湾晚年","1949—1960","1949年太原战局恶化后离开山西，短期主持国民政府行政事务，随后赴台湾。晚年主要从事著述和政治理念阐述，1960年去世，其生平与山西地方现代化和军阀统治相互交织。")]);je("dongzhentang",[z("军事教育与西北军","1895—1931","董振堂生于河北新河，青年时期进入清河陆军中学和保定陆军军官学校，毕业后在西北军任职。经历军队内部变动和国内战争，逐渐对原有军政道路产生转变。"),z("宁都起义与红军长征","1931—1936","1931年12月与赵博生等参与领导宁都起义，率部转入红军，1932年加入中国共产党。后来任红五军团军团长，长征中率部担任重要后卫任务，掩护主力转移。"),z("西路军与高台牺牲","1936—1937","1936年随西路军进入河西走廊，在兵力、补给和外援受限的情况下作战。1937年1月指挥红五军在高台抵抗马家军围攻，1月20日战斗中牺牲。其生涯止于西路军的艰苦作战。")]);je("yangkeming",[z("青年运动与农民组织","1905—1932","杨克明生于四川地区，青年时期参加社会主义青年团，1926年加入中国共产党，随后从事地方党组织和农民运动。1929年前后组织农民武装，逐步进入红军政治工作体系。"),z("红军政治工作","1933—1936","1933年任红三十三军政治委员，参与川陕根据地的军队政治与组织工作。后来随红军转战，担任红五军政治部主任，其职责主要集中于部队组织、干部和政治动员。"),z("高台战斗与牺牲","1937","随西路军进入河西走廊，在高台战斗中与董振堂等共同组织部队抵抗。1937年1月20日牺牲。其生平较短，主要经历集中于四川农民运动、红军政治工作和西路军作战。")]);je("mabufang",[z("西北军事家族与青海","早年—1936","马步芳出身西北马氏军事家族，依托家族军队进入地方军政，逐渐掌握青海的军事和行政力量。其生年有1902年、1903年等不同记载，现有资料不足以消除这一分歧。"),z("地方统治与军事活动","1936—1949","主持青海军政期间参与对红军西路军的作战，并在抗战时期处于国民政府西北军事体系中，后来担任第四十集团军总司令等职。其统治与青海地方建设、军队控制及严重军事暴力同时相关，不能仅用地方建设概括。"),z("海外去向与晚年","1949—1975","1949年离开中国大陆，辗转海外，1957年至1961年曾任台湾当局驻沙特阿拉伯代表，后来在当地生活。1975年7月去世。其后期经历主要转入外交身份与海外居住。")]);je("maodun",[z("求学、编辑与新文学","1896—1927","茅盾原名沈德鸿，生于浙江桐乡乌镇，1913年进入北京大学预科，1916年进入商务印书馆编译所。通过翻译、评论和《小说月报》编辑工作参与新文学运动，也参加早期共产主义组织和革命活动。"),z("小说创作与抗战文化","1927—1949","以《蚀》三部曲等作品进入小说创作，旅居日本后回到上海，创作《子夜》《林家铺子》《春蚕》等，关注城市经济、农村困境和社会变化。抗战时期辗转各地，从事文学、出版及文化组织工作。"),z("文化事务与晚年","1949—1981","新中国成立后任文化部长、中国作协领导职务，继续从事文学评论、翻译和回忆写作。晚年以个人积蓄设立文学奖励基金，其后发展为茅盾文学奖。1981年3月27日在北京去世。")]);je("xiaoqian",[z("北京青年与新闻文学","1910—1939","萧乾生于北京，青年时期通过求学进入文学和新闻领域，1935年毕业于燕京大学，编辑《大公报·文艺》，同时创作小说和散文，其早期写作关注普通人的生活与心理。"),z("英国生活与战地报道","1939—1949","1939年赴英国任教并从事记者工作，后来在剑桥研究英国文学。1944年转为驻英特派员和战地记者，报道欧洲战争结束及战后重要事件，以中国记者的视角观察欧洲社会。"),z("翻译、回忆与晚年","1949—1999","回国后继续新闻、文学和翻译工作，政治运动中经历挫折，后来恢复写作。晚年与文洁若合作翻译乔伊斯《尤利西斯》，并撰写大量回忆和随笔。1999年2月10日在北京去世。")]);je("bajin",[z("成都家庭与赴法经历","1904—1929","巴金原名李尧棠，生于四川成都，青年时期接触新思想，1923年离开成都到上海、南京求学，1927年赴法国。旅欧期间开始小说创作，《灭亡》的发表使其进入现代文学作家的行列。"),z("小说、翻译与出版","1929—1949","回国后长期从事写作、翻译和出版，创作《家》《春》《秋》及《寒夜》等，描写家庭制度、青年反抗和战争中的生活困境。抗战期间辗转上海、重庆、桂林等地，以作品和出版工作参与文化活动。"),z("反思写作与生命末期","1949—2005","新中国成立后继续写作，并承担中国作协等文学组织工作。“文化大革命”中遭受冲击，后来写成《随想录》，反思个人经历与社会创伤。2003年获“人民作家”称号，2005年10月17日在上海去世。")]);je("shencongwen",[z("湘西生活与文学起步","1902—1928","沈从文生于湖南凤凰，少年时期经历湘西地方社会和军队生活，后来到北京，通过自学进入文学创作。1924年开始发表作品，早期经验成为其描写湘西人物、风俗和社会关系的重要基础。"),z("小说与文学教育","1928—1949","在上海、青岛、北京及昆明等地从事写作、编辑和教学，创作《边城》《长河》等作品，以细致的语言表现乡村生活、情感与现代社会的冲突。抗战时期在西南联大等机构任教。"),z("文物服饰研究与晚年","1949—1988","1949年后逐渐把主要工作转向历史文物和服饰研究，长期在博物馆与研究机构工作，完成《中国古代服饰研究》等成果。1980年代文学作品重新受到广泛关注，1988年5月10日在北京去世。")]);je("caoyu",[z("天津成长与戏剧训练","1910—1933","曹禺原名万家宝，生于天津，少年时期在南开接触新剧，加入南开新剧团，后来在清华求学。中外戏剧的阅读与舞台实践共同塑造了其创作，对家庭关系、人物心理和社会压迫的表现尤为突出。"),z("代表剧作与战争年代","1934—1949","1934年《雷雨》发表，随后创作《日出》《原野》《北京人》等剧作，成为中国现代话剧的重要作家。抗战时期从事戏剧教育与创作，1946年赴美国讲学，1949年到北平参与新政协筹备。"),z("人民艺术剧院与晚年","1949—1996","新中国成立后参与创建北京人民艺术剧院，长期从事剧院和戏剧公共工作，继续创作《明朗的天》《王昭君》等作品。其早期剧作持续在舞台上演出，1996年12月13日在北京去世。")]);je("ouyangyuqian",[z("留日与早期话剧","1889—1910","欧阳予倩生于湖南浏阳，青年赴日本学习，参与留学生戏剧演出和春柳社活动，是中国早期话剧实践的重要人物。1910年回国后继续从事舞台艺术。"),z("多种艺术与戏剧教育","1910—1949","除话剧外，还从事京剧表演、剧本创作和电影工作，在不同艺术形式之间探索新的表达。抗战时期在桂林等地组织戏剧活动，参与戏剧教育和救亡文化工作。"),z("中央戏剧学院与晚年","1949—1962","新中国成立后主持中央戏剧学院等机构的戏剧教育，参与培养演员、编剧和导演。他的一生连接传统戏曲与现代话剧、电影的转型，1962年9月21日在北京去世。")]);je("gebaoquan",[z("求学、报刊与俄语学习","1913—1938","戈宝权生于江苏东台，大学毕业后进入报刊编辑工作，通过外语学习与翻译逐步转向外国文学。1935年赴苏联任《大公报》驻莫斯科记者，1938年在汉口加入中国共产党。"),z("外交与文学译介","1938—1960年代","此后从事对外联络、外交及文学翻译，长期关注俄苏文学和中外文化关系。其工作兼有外交实践与文学研究，翻译和介绍的范围包括俄苏作家以及其他国家文学。"),z("研究、交流与晚年","后期—2000","后期持续开展外国文学研究、翻译和国际文化交流，重视通过语言理解不同文学传统。晚年在南京生活，健康恶化后仍保持对文化工作的关注，2000年5月15日去世。")]);je("liubaiyu",[z("青年写作与革命道路","1916—1938","刘白羽生于北京，青年时期开始文学创作，1936年发表小说《冰天》，次年出版首部短篇小说集。1938年加入中国共产党，逐渐把文学写作与战争中的见闻和革命活动结合起来。"),z("战争报道与散文创作","1938—1949","抗战中从事部队和报刊工作，1944年任《新华日报》副刊编辑，内战时期继续随军采访写作。其作品强调战争环境中的人物感受、集体经历与理想，以报道和抒情散文见长。"),z("文学组织与晚年作品","1949—2005","新中国成立后继续军旅报道与文学创作，参与抗美援朝时期的采访，并承担文学组织工作。晚年创作小说和回忆性作品，《第二个太阳》等体现其对战争记忆的持续书写。2005年8月24日去世。")]);je("cheyaoxian",[z("川军经历与思想转变","1894—1929","车耀先生于四川，1912年加入川军，经历多年军旅后逐渐转向社会和革命活动。1929年加入中国共产党，在成都以经营餐馆等方式维持生活，并为地下联络提供空间。"),z("“努力餐”与救亡宣传","1929—1940","其经营的“努力餐”餐馆成为革命活动与社会联络的场所，创办《大声周刊》，从事抗日救亡宣传和文化活动。公开经营与隐蔽工作的结合，使他在四川救亡网络中具有特殊作用。"),z("被捕与遇害","1940—1946","1940年被国民党逮捕，此后长期被关押。在囚禁中坚持政治立场，1946年8月18日被杀害。其生平不仅是地下工作经历，也包含军旅、经营、报刊和文化宣传等不同阶段。")]);je("chengfangwu",[z("留日、创造社与文学","1897—1931","成仿吾生于湖南，青年赴日本学习，1921年完成大学学业，参与创造社的文学活动，从事评论和翻译。后来转向革命政治，继续在海外和中国参与文化与组织工作，1931年返回上海。"),z("干部教育与陕北公学","1931—1949","进入革命根据地后把主要工作转向教育，1934年在中央党校任教，并经历长征。1937年主持陕北公学筹备和办学，后来参与华北地区的教育机构建设，重视把教学与干部培养结合。"),z("高校建设与翻译","1949—1984","新中国成立后参与大学建设，曾主持山东大学、中国人民大学等学校工作，持续从事马克思主义著作的翻译与教育研究。其生涯由现代文学运动延伸到革命教育和高校治理，1984年去世。")]);je("liubocheng",[z("四川军旅与军事学习","1892—1932","刘伯承生于四川开县，青年时期投身辛亥革命后的军事活动，在战斗中负伤失去一眼。1926年加入中国共产党，参加南昌起义，后来赴苏联学习军事，回国后任红军总参谋长。"),z("长征、抗战与刘邓大军","1932—1949","参加长征并从事战略与参谋工作，抗战时期任八路军第一二九师师长，与邓小平长期合作。解放战争中领导晋冀鲁豫野战军和第二野战军，1947年挺进大别山，参与淮海战役及渡江、进军西南等行动。"),z("军事教育与晚年","1950—1986","1950年受命组建军事学院，推动正规军事教育和军官训练，1955年获元帅军衔。晚年视力与健康恶化，逐渐辞去领导职务。1986年10月7日在北京去世，军事教育与理论学习是其生平的重要方面。")]);je("hirotakoki",[z("外交官生涯","1878—1933","广田弘毅生于日本福冈，接受高等教育后进入外交系统，历任外交和外务省职务，1923年任欧美局局长，后来担任驻苏联大使。其职业基础来自外交系统，而非一开始即为军队将领。"),z("首相与侵华外交","1933—1938","1933年任外务大臣，1936年二二六事件后出任首相，任内军方对政府的影响扩大。1937年内阁辞职后在近卫内阁再任外务大臣，参与全面侵华战争时期的外交和政府决策。"),z("战后审判与处刑","1945—1948","日本战败后被远东国际军事法庭起诉，被判为甲级战犯。其对于侵略战争及南京大屠杀相关失职的责任在审判中受到讨论，最终判处死刑，1948年12月23日被执行。")]);je("ugakikazushige",[z("陆军职业与改革","1868—1930","宇垣一成生于日本冈山，长期在陆军任职，1923年任陆军次官，1924年任陆军大臣。1925年推动裁减部分陆军师团，同时调整军费和装备，其政策在军内引起不同反应。"),z("殖民治理与组阁失败","1931—1937","1931年出任朝鲜总督，参与日本殖民统治。1937年广田内阁辞职后被授命组阁，但陆军拒绝提供陆军大臣人选，导致组阁失败，显示出军部对日本政治制度的强大控制。"),z("外交职务与晚年","1938—1956","1938年曾任外务大臣等职，之后逐渐离开主要行政岗位。战后日本政治制度改变，他于1953年当选参议院议员。1956年4月30日去世，其经历跨越明治以来的军队建设、殖民治理和战后政治。")]);const p7=[],g7={希特勒:"hitler",弗朗哥:"franco",布鲁姆:"blum",宇垣:"ugakikazushige",滨田:"hamadakunimatsu",寺内:"terauchihisaichi",贝尔:"danielwbell",斯蒂特:"fredstitt",谢苗诺夫:"nikolaisemenovattache","Joseph E. Springarn":"joelspingarn","James Roosevelt":"jamesroosevelt"},y7={},q=a=>["维基百科 · 人物条目（辅助生平资料）",`https://en.wikipedia.org/wiki/${a}`],Oe=a=>["大英百科全书 · 人物生平",`https://www.britannica.com/biography/${a}`],_l=a=>["韩国学中央研究院 · 韩国民族文化大百科",`https://encykorea.aks.ac.kr/Article/${a}`];function E(a,i,l,o,c,f,h,p){const g=f.map(([v,y],S)=>({title:["早年与成长","主要经历与事迹","晚年与历史影响"][S],period:v,text:y})),j=h.map(([v,y],S)=>{const T=`jan-life-${a}-${S}`;return y7[T]={name:`${i} · ${v}`,url:y},T});p7.push({id:a,name:i,type:"人物",lifespan:l,subtitle:o,description:g[1].text,milestones:[],biography:g,biographySources:j,sources:j,biographyNote:p??(h.some(([v])=>v.includes("辅助生平资料"))?"生平含百科辅助资料，尚未逐项与原始档案校验。":void 0)});for(const v of[i,...c])g7[v]=a}E("zhuguangqian","朱光潜","1897—1986","美学家 · 文艺批评与翻译",[],[["1897—1933","生于安徽桐城，早年接受传统和新式教育，后赴英国、法国研究文学、心理学与美学。欧洲学习使他接触西方美学体系，也形成以文学实践解释审美经验的写作方法。"],["1933—1949","回国后在北京大学等校任教，撰写《谈美》《文艺心理学》等著作，参与现代文学批评与教育。对《日出》的评论属于其关注戏剧、艺术形式与人生经验的文艺活动。"],["1949—1986","继续在北京大学教学，撰写《西方美学史》，翻译黑格尔、克罗齐等人的美学著作。1986年去世，其学术工作对中国现代美学教育与西方美学译介影响深远。"]],[q("Zhu_Guangqian")]);E("yeshengtao","叶圣陶","1894—1988","作家 · 编辑与语文教育家",[],[["1894—1921","原名叶绍钧，生于江苏苏州，早年任小学教师。教学经历使他长期关注儿童生活、普通人的处境与教育方法，五四时期参加新文学运动。"],["1921—1949","参与文学研究会，创作小说、童话和散文，代表作有《稻草人》《倪焕之》。长期从事出版编辑及语文教材工作，重视文字表达、阅读和写作训练。"],["1949—1988","在出版和教育机构任职，参与教材建设、语言文字规范与政协工作。他提出教学应使学生逐步获得自主学习能力。1988年去世，其文学与教育事业相互贯通。"]],[q("Ye_Shengtao")]);E("zhupede","朱培德","1888—1937","云南军人 · 国民政府军政人员",[],[["1888—1916","云南人，毕业于云南陆军讲武堂，参加辛亥革命及护国战争。早年在滇军体系中任职，与云南近代军事教育和反袁斗争有密切联系。"],["1917—1936","参加护法及北伐，在国民革命军中担任高级指挥职务，后任江西省政府主席、参谋及军训系统领导职务。其经历连接滇军、广州革命政府和南京国民政府。"],["1937","西安事变善后期间参与军政讨论，1937年2月17日去世。生平不能只由一次会议概括，也不应把他与同样出身云南讲武堂的朱德混为一人。"]],[["昆明市委党史研究室 · 朱培德传略","https://kmds.km.gov.cn/c/2017-10-08/2202986.shtml"]]);E("zhushaoliang","朱绍良","1891—1963","国民党高级将领 · 军政人员",[],[["1891—1926","浙江籍军人，早年受军事教育，参加辛亥革命及民国初期军政活动。后来进入国民革命军系统，逐步担任高级军事职务。"],["1926—1949","参加北伐，此后在南京国民政府担任军事指挥及地方行政职务。抗战期间任第八战区司令长官等职，负责西北地区军政和战略部署。"],["1949—1963","国民党政权撤往台湾后继续在相关军政机构任职，1963年去世。其经历反映民国军人从地方军事体系进入中央军政系统的过程。"]],[q("Zhu_Shaoliang")]);E("linwei","林蔚","1889—1955","国民政府参谋人员 · 军事行政",[],[["1889—1920年代","浙江黄岩人，早年接受军事教育，在民国军队及参谋系统任职。与一线部队指挥官相比，其职业生涯更多集中在军事幕僚与行政工作。"],["1920年代—1949","在南京国民政府军事委员会和参谋机构中担任要职，参与军队组织、计划与作战协调。抗日战争期间继续从事军事幕僚工作。"],["1949—1955","迁往台湾后仍任军事顾问及行政职务，1955年去世。其生平应置于参谋制度和国民政府军政运作中理解，不由一次西北善后会议推定全部职责。"]],[q("Lin_Wei_(general)")]);E("zhangbangying","张邦英","1910—2010","陕甘革命工作者 · 民政干部",[],[["1910—1933","陕西耀县人，1927年加入中国共产党，参与当地组织工作、游击活动及陕甘边根据地建设。1933年配合耀县起义，率游击队进入照金地区。"],["1933—1949","参与陕甘边南区和关中特区的党政工作，担任苏维埃政府及边区参议会等职。此后在西北及晋绥地区从事组织和地方领导工作。"],["1949—2010","任陕西省政府、中共中央新疆分局和民政部等机构职务，参与地方行政及民政建设。2010年去世。部分网页存在出生年份错字，采用陕西省图书馆所记1910—2010。"]],[["陕西省图书馆 · 张邦英生平注释","https://www.sxlib.org.cn/dfzy/yajs/qwts_5014/yajs/mwrlyajss/201701/t20170109_585622.html"]]);E("guohongtao","郭洪涛","1909—2004","陕北革命工作者 · 经济与铁路干部",[],[["1909—1933","陕西米脂人，学生时代参加革命组织，1925年加入中国共产党。曾在山西求学、从事学生工作并遭拘捕，获释后继续参加革命活动。"],["1933—1949","参与陕北根据地建设，担任党政领导职务，中央迁驻延安时从事地方协调。抗战中赴山东工作，此后参与根据地经济及交通建设。"],["1949—2004","长期在铁路、经济计划和工业交通领域任职，参与国家建设，2004年去世。其一生既包括早期地方革命，也包括建国后的经济行政工作。"]],[["陕西省图书馆 · 郭洪涛生平简介","https://www.sxlib.org.cn/dfzy/rwk/bqjsldr/ght/spjj/"]]);E("baowenyue","鲍文樾","1892—1980","东北军军人 · 后参与汪政权",[],[["1892—1920年代","东北籍军人，早年接受军事教育，在奉系及东北军体系任职。其早期职业背景与东北地方军事集团的形成和转型相连。"],["1920年代—1945","在东北军和南京政府军政系统担任职务，西安事变善后时参与交涉。后来追随汪精卫，任汪政权军政职务，其合作经历是评价生平不能略去的部分。"],["1945—1980","日本战败后因参与汪政权而受审、被拘禁，后到台湾生活，1980年去世。前期东北军经历与后期政治选择应分别叙述。"]],[q("Bao_Wenyue")]);E("xieke","谢珂","1891—1974","东北军将领 · 西安善后谈判代表",[],[["1891—1920年代","辽宁籍军人，早年进入东北军事体系，接受军事训练，逐步担任部队和参谋职务。"],["1920年代—1949","在东北军中从事军事与幕僚工作，西安事变后代表东北军参与善后交涉。其军衔记录列有1936年晋少将、1937年晋中将等节点。"],["战后—1974","后期经历的公开简传较少，1974年去世。谈判中的具体主张应以同期文书为准，不由其军衔或代表身份补写未经证实的立场。"]],[["Generals.dk · 谢珂军历","https://generals.dk/general/Xie_Ke/_/China.html"]],"公开材料主要为军历，家庭及部分晚年经历尚未详考。");E("zhangce","张策","1911—1999","关中特委工作者 · 纪检干部",[],[["1911—1932","陕西高陵人，曾用名王尚义，青年时期参加学生和农民运动，1927年加入共青团，1932年转入中国共产党。"],["1932—1949","参加陕甘边革命斗争，在关中特委等机构从事宣传和组织工作。抗战胜利后赴东北，担任地方党政职务，参与东北及内蒙古地区工作。"],["1949—1999","新中国成立后从事地方行政和党的纪律检查工作，1999年去世。他与1866—1934年的同名武术家不是同一人。"]],[["黑龙江省委史志研究室 · 张策生平","https://www.hljszw.org.cn/news/2365.html"]]);E("yamamotoyuzo","山本有三","1887—1974","日本小说家 · 剧作家与语言改革倡议者",[],[["1887—1920","生于栃木县，东京帝国大学求学期间与芥川龙之介等创办《新思潮》。毕业后创作戏剧，以《杀婴》《坂崎出羽守》等作品确立剧作家地位。"],["1920—1945","转向小说，创作《波》《女人的一生》《真真实实》《路傍之石》等作品，以人道主义立场关注教育、贫困和个人成长，也参与作家及剧作家组织建设。"],["1945—1974","战后任贵族院及参议院议员，推动日语书写改革和国立国语研究所建设，1965年获文化勋章，1974年去世。文学、语言与公共教育是其相互联系的事业。"]],[["日本国立国会图书馆 · 山本有三","https://www.ndl.go.jp/portrait/datas/6245/"]]);E("ishiharakanji","石原莞尔","1889—1949","日本陆军军人 · 九一八事变策划者",["石原莞爾"],[["1889—1928","山形县人，毕业于陆军大学校，曾任教并赴德国研究战争史。其军事思想逐渐与所谓“世界最终战争”构想结合。"],["1928—1941","在关东军任参谋，策划九一八事变并推动日本占领中国东北。后来在参谋本部任职，反对扩大1937年对华战争，与东条英机发生冲突；这种分歧不能抵消其侵略责任。"],["1941—1949","退出现役后推动东亚联盟运动，1949年去世。其理论和与军内对手的冲突常被讨论，须与其在殖民扩张中的实际行动一并考察。"]],[["日本国立国会图书馆 · 石原莞尔","https://www.ndl.go.jp/portrait/datas/355"]]);E("hayashisenjuro","林铣十郎","1876—1943","日本陆军大将 · 1937年首相",["林銑十郎"],[["1876—1930","石川县人，毕业于陆军士官学校和陆军大学校，参加日俄战争，历任部队、教育和参谋职务。1930年任驻朝鲜军司令官。"],["1931—1937","九一八事变后未经事先正式批准即派驻朝鲜军越境支援关东军。后来任陆军大臣，1937年2月至6月出任首相，试图摆脱政党支持而执政，大选后政治基础受挫。"],["1937—1943","卸任后任内阁参议等职，1943年去世。1937年1月的受命组阁和2月内阁成立是不同阶段，不能把受命当天当作已就任。"]],[["日本国立国会图书馆 · 林铣十郎关系文书与履历","https://ndlsearch.ndl.go.jp/en/rnavi/kensei/hayashisenjuurou"]]);E("hamadakunimatsu","滨田国松","1868—1939","日本众议员 · 曾任众议院议长",["浜田国松","濱田國松"],[["1868—1904","三重县人，早年从事法律工作，后进入议会政治。1904年起多次当选众议员 8","任罗斯福商务部长，处理商业、工业及政府与企业关系，参与新政行政和对外经济事务。"],["1938—1943","后来任驻加拿大使节并从事公共事务，1943年去世。与姓名缩写C. H. Roper的驱逐舰舰长不是同一人。"]],[q("Daniel_C._Roper")]);E("sumnerwelles","萨姆纳·韦尔斯","1892—1961","美国外交官 · 副国务卿",["韦尔斯"],[["1892—1933","受教育后进入外交体系，在拉丁美洲等地工作，熟悉美国西半球政策。"],["1933—1943","在罗斯福政府任国务院高级职务，参与睦邻政策、欧洲危机和战后秩序讨论，1937年起任副国务卿。"],["1943—1961","离任后写作并评论国际事务，1961年去世。个人与部门政治的冲突也是其离任背景的一部分。"]],[["美国国务院 · 韦尔斯任职","https://history.state.gov/departmenthistory/people/welles-sumner"]]);E("macedosoares","若泽·卡洛斯·马塞多·苏亚雷斯","1883—1968","巴西外交官 · 政治与经济事务",["马塞多·苏亚雷斯","José Carlos de Macedo Soares"],[["1883—1930年代","巴西法律、经济与公共事务人士，参与工商界及政府工作，逐渐进入国家政治和外交领域。"],["1930年代—1950年代","多次任外交部长，也承担州级及其他公共职务，参与巴西与美国等国关系及国际组织事务。"],["后期—1968","继续公共与文化组织活动，1968年去世。1937年白宫接待发生在其曾任外长的身份背景下，不能改写为当日已签新条约。"]],[q("José_Carlos_de_Macedo_Soares")]);E("irnaphillips","伊尔娜·菲利普斯","1901—1973","美国广播与电视连续剧创作者",["Irna Phillips"],[["1901—1930年代","生于芝加哥，早年任教师并尝试表演，后来进入广播创作，关注家庭和普通人的持续生活故事。"],["1930年代—1960年代","创作《指路明灯》等广播剧，后来参与电视肥皂剧建设，发展连续情节、人物关系和长期播出模式。"],["1960年代—1973","继续剧本及制作顾问工作，培养后来电视创作者，1973年去世。1937年的《指路明灯》是广播节目，电视阶段属于后续发展。"]],[q("Irna_Phillips")]);E("lawrencehenderson","劳伦斯·亨德森","1878—1942","哈佛生理学家 · 科学与社会研究",["L. J. Henderson"],[["1878—1900年代","接受医学和科学训练，在哈佛大学从事生理学研究，关注生命系统与化学环境。"],["1900年代—1930年代","研究血液、酸碱平衡及生命环境，著有《环境的适宜性》，也参与科学教育和社会学讨论。"],["1930年代—1942","参与哈佛研究组织和青年学者培养，1942年去世。保林给他的推荐信属于研究员选拔材料，不应当作录取结果。"]],[Oe("Lawrence-Joseph-Henderson")]);E("martinjohnson","马丁·约翰逊","1884—1937","美国旅行纪录片制作者",[],[["1884—1910年代","早年旅行并参与影像制作，与妻子奥莎·约翰逊合作记录海外景观、动物和居民生活。"],["1910年代—1930年代","在非洲、亚洲和太平洋地区拍摄探险纪录片。作品推动公众对远方的兴趣，也带有当时探险和殖民观看方式的局限。"],["1937","1937年1月在加利福尼亚航空事故中受重伤后去世。事故日与死亡日须区分，不能把其全部影片当作对当地社会的中立记录。"]],[q("Martin_and_Osa_Johnson")]);E("pyatakov","格奥尔基·皮亚塔科夫","1890—1937","苏联经济官员 · 莫斯科审判被告",["皮亚塔科夫"],[["1890—1917","生于俄罗斯帝国境内，青年时期参加社会主义活动，加入布尔什维克，经历流亡与革命。"],["1917—1936","在乌克兰和苏联党政、银行及工业机构任职，曾参与党内反对派，后来从事重工业管理。"],["1936—1937","大清洗中被捕，1937年第二次莫斯科审判被判死刑并处决，后来获平反。审判中的间谍及破坏指控不能直接作为已证实生平。"]],[q("Georgy_Pyatakov")]);E("karlradek","卡尔·拉狄克"," 来与资助者在政治路线及编辑问题上发生分歧。"],["1938—1942","离开《Tribune》后继续新闻工作，1942年去世。刊物路线不能一概当作工党全体政策，其编辑任期亦需与后继者区分。"]],[q("William_Mellor")]);E("charlesmadge","查尔斯·马奇","1912—1996","英国诗人 · 社会学家与大众观察发起人",["马奇"],[["1912—1936","早年在英国求学，参与诗歌、新闻及现代主义文化环境，对普通人的生活与社会观察产生兴趣。"],["1937—1945","与汤姆·哈里森、汉弗莱·詹宁斯发起大众观察，尝试通过日记和观察研究社会生活，后来转向更系统的社会调查。"],["1945—1996","任社会学教学和研究职务，继续诗歌及社会研究，1996年去世。观察者材料具有重要经验价值，但不自动等于全国代表性统计。"]],[q("Charles_Madge")]);E("tomharrisson","汤姆·哈里森","1911—1976","英国社会观察者 · 博物学与人类学工作者",["汤姆·哈里森"],[["1911—1936","早年参加博物学考察，在海外接触当地社会和生活，对研究英国本土日常经验形成兴趣。"],["1937—1945","参与创办大众观察，组织普通人的观察及生活记录；二战中赴婆罗洲参加盟军行动，与当地社会合作。"],["1945—1976","在砂拉越博物馆和婆罗洲考古、人类学研究中工作，1976年死于交通事故。此人不与美国参议员帕特·哈里森合并。"]],[q("Tom_Harrisson")]);E("maryadams","玛丽·亚当斯","1898—1984","英国广播与电视制作人",["玛丽·亚当斯","亚当斯"],[["1898—1930年代","接受科学教育，曾从事学术工作，后来进入BBC广播，参与谈话和教育节目，将科学与公共传播联系起来。"],["1937—1950年代","成为早期BBC电视制作人，参与女性、教育及社会题材节目。战后继续推动电视谈话与纪实节目，女性在新媒体中的职业空间是其经历的重要背景。"],["退休后—1984","退休后继续公共和慈善事务，1984年去世。1937年的行政批准是职业转型节点，不能写成其此前没有广播经验。"]],[q("Mary_Adams_(broadcaster)"),["BBC早期电视女性研究","https://eprints.bournemouth.ac.uk/37420/3/17496020221103461.pdf"]]);E("basilnicolls","巴兹尔·尼科尔斯","生卒未详","BBC行政与广播管理人员",["巴兹尔·尼科尔斯"],[["早年未详","已查材料能确认其BBC行政管理身份，尚不足以可靠补齐出生日期、教育和早期军旅经历，不采用拍卖网页中明显异常的年份。"],["1920年代—1950年代","长期在BBC从事行政和广播管理，1937年批准玛丽·亚当斯转入电视部门。BBC口述历史也讨论其资历、管理风格及对新电视业务的认识。"],["晚年未详","完整晚年及卒年仍待可靠人事档案补充。现有学术研究和BBC口述资料支持其职业身份，不足以构造完整家庭生活。"]],[["BBC口述历史 · John Arkell访谈","https://connectedhistoriesofthebbc.org/data/main/JohnArkell/interview1/LR0000281Transcripts1.pdf"],["早期BBC电视研究","https://eprints.bournemouth.ac.uk/37420/3/17496020221103461.pdf"]],"公开材料主要为BBC职业记录，生卒和私人经历未详。");E("laurenceolivier","劳伦斯·奥利维尔","1907—1989","英国演员 · 导演",["奥利维尔"],[["1907—1930年代","在英国成长，接受表演训练，进入剧院和电影界，以莎士比亚舞台表演逐步成名。"],["1930年代—1960年代","主演、导演《亨利五世》《哈姆雷特》等舞台和电影作品，参与老维克及英国国家剧院建设，兼演现代戏剧。"],["1960年代—1989","继续电影、电视和舞台活动，获多项艺术荣誉，1989年去世。1937舞台版、后来赴丹麦演出与1948电影版是不同制作。"]],[Oe("Laurence-Olivier")]);E("tyroneguthrie","泰隆·格思里","1900—1971","英国戏剧导演 · 剧院建设者",["格思里"],[["1900—1930年代","接受大学教育，早年从事舞台表演、广播和导演，探索剧场空间与表演方式。"],["1930年代—1960年代","在老维克执导莎士比亚，后来参与加拿大斯特拉特福戏剧节和美国格思里剧院建设，倡导与传统镜框舞台不同的演出空间。"],["晚年—1971","继续导演和写作，1971年去世。其影响包括戏剧作品与剧院制度，不能只由1937一部《哈姆雷特》概括。"]],[Oe("Tyrone-Guthrie")]);E("vivienleigh","费雯·丽","1913—1967","英国演员 · 舞台与电影",[],[["1913—1930年代","生于英属印度，后在英国接受教育和表演训练，进入舞台与电影界。"],["1930年代—1950年代","以《乱世佳人》和《欲望号街车》等电影获国际声誉，同时持续演出莎士比亚和现代戏剧，职业合作与婚姻均与奥利维尔相连。"],["1950年代—1967","继续舞台和电影演出，长期承受疾病困扰，1967年去世。表演成就与健康经历应尊重事实，不以角色性格代替个人传记。"]],[Oe("Vivien-Leigh")]);E("dallasbower","达拉斯·鲍尔","1907—1969","英国电影与早期电视制作人",["达拉斯·鲍尔"],[["1907—1930年代","早年进入电影行业，从事声音、剪辑和制作相关工作，参与有声电影发展的制作实践。"],["1930年代—1945","进入BBC早期电视业务，制作戏剧和综艺节目，包括1937年的《Burnt Sepia》，也从事电影与战时制作。"],["1945—1969","继续导演和制作，1969年去世。早期电视经常采用直播，节目存在播出记录并不意味着实况影像完整留存。"]],[q("Dallas_Bower")]);E("eunicewilson","尤妮斯·威尔逊","1910—1984","美国歌舞演员 · 早期电视表演者",[],[["1910—1930年代","生于美国，早年从事舞蹈和歌唱，进入黑人娱乐与巡演网络，逐渐获得舞台演出机会。"],["1930年代—1940年代","在欧洲与美国参加歌舞及电影表演，1937年出现在BBC《Burnt Sepia》。她与同节目钢琴家加兰·威尔逊是不同人物。"],["后期—1984","后来继续演艺活动，1984年去世。公开材料关于私人生活和完整演出行程较少，不从一份节目名单补写全年活动。"]],[q("Eunice_Wilson")]);E("garlandwilson","加兰·威尔逊","1909—1954","美国爵士钢琴家",[],[["1909—1930年代","生于西弗吉尼亚，学习钢琴，在爵士乐和夜总会环境中发展职业演奏。"],["1930年代—1940年代","在美国与欧洲演出、录音，在伦敦等地参与爵士和综艺节目，1937年出现在BBC黑人演员专场。"],["后期—1954","战后继续在欧洲活动，1954年于巴黎去世。演奏、录音与电视出演分别构成其职业经历。"]],[q("Garland_Wilson")]);E("cyrilblake","西里尔·布莱克","1897—1951","特立尼达爵士小号手 · 海员",[],[["1897—1918","生于特立尼达，第一次世界大战中在商船海运系统服役，后来定居英国。加勒比海员的迁移与其音乐职业发展相连。"],["1920年代—1940年代","在英国演奏爵士乐，与黑人和加勒比音乐人合作，1937年参加BBC《Burnt Sepia》，在伦敦乐队和夜总会环境中工作。"],["后期—1951","1951年去世。公开资料有限，海员和演奏经历有据，完整家庭及后期活动未详。不能套用同姓同名其他表演者的生卒。"]],[["Black History Month · 布莱克传略","https://www.blackhistorymonth.org.uk/article/section/100-years-of-service-and-sacrifice/cyril-blake-1897-1951/"],q("Cyril_Blake")]);E("mollymacarthur","莫莉·麦克阿瑟","1904—1993","英国舞台布景与服装设计师",["麦克阿瑟"],[["1904—1930年代","接受艺术训练，进入英国戏剧设计领域，逐步从事舞台布景与服装设计。"],["1930年代—战后","为老维克等剧院设计作品，1937年在BBC《妇女世界》中介绍《爱的徒劳》的舞台设计，使剧场制作过程进入新电视媒介。"],["晚年—1993","继续保有舞台设计作品记录，1993年去世。具体教育、家庭与晚年工作在本次资料中未详考。"]],[q("Molly_MacArthur")]);E("mileslampson","迈尔斯·兰普森","1880—1964","英国外交官 · 驻华与驻埃使节",["兰普森"],[["1880—1920年代","进入英国外交服务，在亚洲和欧洲任职，逐步担任高级驻外职务。"],["1926—1946","曾任驻华公使，后任驻埃及高级专员及大使，在英国驻军和埃及政治关系中发挥重要作用，1942年对埃及王室施加军事政治压力。"],["1946—1964","后来在东南亚担任外交职务，受封基勒恩男爵，1964年去世。1937递交国书只是身份转换，英国影响并未当天结束。"]],[q("Miles_Lampson,_1st_Baron_Killearn")]);E("aminhusseini","阿明·侯赛尼","约1895—1974","巴勒斯坦阿拉伯政治与宗教领导人",["耶路撒冷穆夫提"],[["约1895—1921","生于耶路撒冷，接受宗教及其他教育，经历第一次世界大战和奥斯曼帝国崩溃，进入巴勒斯坦政治活动。"],["1921—1945","任耶路撒冷大穆夫提，反对英国托管和犹太移民，参与阿拉伯民族政治。二战中与纳粹德国合作并从事反犹宣传，这一经历不能省略。"],["1945—1974","战后在阿拉伯地区继续政治活动，1974年在贝鲁特去世。不同资料的生年有差异，采用约年，不把职衔用于所有同职人员。"]],[q("Amin_al-Husseini")]);E("johnpiper","约翰·派珀","1903—1992","英国画家 · 版画与舞台设计",["派珀"],[["1903—1930年代","早年接触绘画，后接受艺术训练，参与现代主义和抽象艺术讨论，逐渐转向英国风景与建筑题材。"],["1930年代—1960年代","从事绘画、版画、艺术评论和舞台设计，二战中记录遭轰炸建筑，也设计教堂彩色玻璃，参与布里顿相关舞台制作。"],["1960年代—1992","持续创作风景、建筑和设计作品，1992年去世。电视介绍画廊作品属于其公共艺术传播活动。"]],[q("John_Piper_(artist)")]);E("pissarro","卡米耶·毕沙罗","1830—1903","法国印象派画家",["毕沙罗"],[["1830—1860年代","生于加勒比圣托马斯岛，青年时学习绘画，后到巴黎，与风景画家和新艺术圈交流。"],["1860年代—1890年代","参与全部八届印象派展览，描绘乡村劳动与城市生活，也尝试新印象派点彩技法，对多位后辈画家有影响。"],["1890年代—1903","晚年持续创作城市系列风景，1903年去世。1937年电视展示其作品是后人的传播活动，画家本人当时已去世。"]],[Oe("Camille-Pissarro")]);E("sisley","阿尔弗雷德·西斯莱","1839—1899","印象派风景画家",["西斯莱"],[["1839—1860年代","生于巴黎的英国家庭，受绘画训练，与莫奈、雷诺阿等交往，选择风景画道路。"],["1860年代—1890年代","参加印象派展览，长期描绘法国河流、村镇、道路和季节变化，注重光线与空气效果，生活中多次遭遇经济困难。"],["1890年代—1899","晚年在莫雷附近继续绘画，1899年去世。其英国国籍与法国创作环境并存，作品后来由画廊、博物馆及电视传播。"]],[Oe("Alfred-Sisley")]);E("christopherwood","克里斯托弗·伍德","1901—1930","英国画家",[],[["1901—1920年代","在英国成长，青年时赴巴黎学习绘画，接触欧洲现代艺术和舞台设计环境。"],["1920年代","在法国及英国创作，与本·尼科尔森等交往，作品结合现代主义与简朴的风景、人物表现，也参与舞台设计构想。"],["1930","1930年去世，年仅29岁。1937电视研究对某幅作品的辨認尚有疑问，不能把存疑作品认定为已确定展示。"]],[q("Christopher_Wood_(painter)")]);E("malcolmmacdonald","马尔科姆·麦克唐纳","1901—1981","英国自治领与殖民事务大臣 · 外交官",["麦克唐纳"],[["1901—1930年代","首相拉姆齐·麦克唐纳之子，求学后进入议会，担任政府职务，逐渐负责自治领和殖民事务。"],["1930年代—1950年代","参与英爱谈判、殖民地政策和1939年巴勒斯坦白皮书制定，战时任驻加拿大高级专员，后来在东南亚任高级职务。"],["1950年代—1981","继续驻外及公共事务工作，1981年去世。1937年的麦克唐纳指马尔科姆，不是其父亲，相关对话不据姓氏合并。"]],[q("Malcolm_MacDonald")]);E("devalera","埃蒙·德·瓦莱拉","1882—1975","爱尔兰政治家 · 总理与总统",["德·瓦莱拉"],[["1882—1920年代","生于纽约，在爱尔兰成长并任教师，参加1916年复活节起义，后来领导独立政治，在条约问题上反对分割及王室联系。"],["1920年代—1959","创立共和党，多次领导政府，推动1937年宪法和英爱关系调整，二战中实行中立，强调国家主权。"],["1959—1975","1959至1973年任爱尔兰总统，1975年去世。1937的政府首脑身份不能直接写成后来共和国的总统任期。"]],[Oe("Eamon-de-Valera")]);E("johndulanty","约翰·W·杜兰蒂","1881—1955","爱尔兰驻英外交代表",["杜兰蒂"],[["1881—1920年代","在英国成长和工作，与爱尔兰民族政治及公共行政产生联系，后来加入爱尔兰新国家的外交服务。"],["1920年代—1950年代","长期任爱尔兰驻英高级专员，后来任大使，参与两国关系及谈判联络，1937年记录德·瓦莱拉与麦克唐纳会谈。"],["晚年—1955","1955年去世。这里是外交官John W. Dulanty，不是记者Walter Duranty；中文近似译名不构成身份相同的依据。"]],[q("John_W._Dulanty"),["爱尔兰外交文献 · 1937秘密报告","https://difpdata.fs.ie/viewdoc.asp?DocID=2154"]]);E("benjaminbritten","本杰明·布里顿","1913—1976","英国作曲家 · 钢琴家与指挥",["布里顿"],[["1913—1930年代","生于洛斯托夫特，少年时作曲，受弗兰克·布里奇等指导，在皇家音乐学院学习，发展个人音乐语言。"],["1930年代—1960年代","创作管弦乐、歌剧和声乐作品，代表作有《彼得·格赖姆斯》《战争安魂曲》，与彼得·皮尔斯合作创办奥尔德堡音乐节。"],["1960年代—1976","晚年继续作曲，健康逐渐恶化，1976年去世。创作、广播首演和音乐会首演具有不同日期，不能合并为一次行动。"]],[Oe("Benjamin-Britten")]);E("josephlewis","约瑟夫·刘易斯","1878—1969","英国指挥家 · BBC音乐工作者",[],[["1878—1920年代","生于英国，接受音乐训练，早年从事钢琴、剧院和乐队工作，进入职业指挥领域。"],["1920年代—1940年代","在BBC及相关乐团中工作，参与广播音乐演出，1937年指挥布里顿《音乐晚会》的广播首演。"],["晚年—1969","1969年去世。这里是英国指挥家，不是美国劳工领袖约翰·L·刘易斯，生平和姓名入口分别维护。"]],[q("Joseph_Lewis_(conductor)")]);E("rossini","焦阿基诺·罗西尼","1792—1868","意大利作曲家",["罗西尼"],[["1792—1810年代","生于佩萨罗音乐家庭，少年时学习声乐及作曲，进入意大利剧院环境，迅速获得歌剧委约。"],["1810年代—1829","创作《塞维利亚的理发师》《灰姑娘》《威廉·退尔》等歌剧，以旋律、节奏和戏剧处理影响欧洲歌剧。"],["1829—1868","退出主要歌剧创作后仍写宗教音乐和晚年小品，1868年在法国去世。布里顿使用其主题是后世改编，并非罗西尼参与1937首演。"]],[Oe("Gioachino-Rossini")]);E("ronaldlindsay","罗纳德·林赛","1871—1945","英国外交官 · 驻美大使",["林赛"],[["1871—1920年代","进入外交服务，在多国使馆及英国外交部任职，担任驻土耳其、驻德国等使节。"],["1930—1939","任驻美大使，参与英美贸易、帝国特惠及欧洲危机背景下的交涉，1937年与赫尔会谈。"],["1939—1945","退休后于1945年去世。外交报告中的经济判断属于谈判立场，不直接代表双方已达成共同政策。"]],[q("Ronald_Lindsay")]);E("andrewcaldecott","安德鲁·卡尔德科特","1884—1951","英国殖民地行政官员 · 总督",["卡尔德科特"],[["1884—1930年代","接受英国教育，进入殖民地行政服务，长期在马来亚等地任职，积累地方行政经验。"],["1930年代—1944","任香港和锡兰总督，处理殖民地行政与战争时期事务。
